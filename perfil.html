<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Perfil - Bokalia</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 🔥 CONFIGURACIÓN TAILWIND PARA LA MARCA BOKALIA 🔥 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bokalia: {
              coral: '#e25e4c',  
              cream: '#fdfbf7',  
              beige: '#f4ede5',  
              dark: '#302b28'    
            }
          },
          boxShadow: {
            'elegant': '0 8px 30px rgba(0, 0, 0, 0.04)',
            'elegant-lg': '0 15px 40px rgba(0, 0, 0, 0.06)',
          }
        }
      }
    }
  </script>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #f4ede5; margin: 0; -webkit-tap-highlight-color: transparent; }
    @keyframes slideUp { from { transform: translate3d(0, 100%, 0); } to { transform: translate3d(0, 0, 0); } }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translate3d(0, -10px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
    .animate-fade-in { animation: fadeIn 0.2s ease forwards; }
    .mobile-container { transform: translate(0); }
    .custom-scrollbar::-webkit-scrollbar { height: 0px; display: none; }
    .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .bg-texture {
       background-color: #fdfbf7;
       background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23e25e4c' fill-opacity='0.02' fill-rule='evenodd'%3E%3Ccircle cx='3' cy='3' r='1'/%3E%3Ccircle cx='13' cy='13' r='1'/%3E%3C/g%3E%3C/svg%3E");
    }
  </style>
</head>
<body class="flex justify-center min-h-screen">
  
  <div id="root" class="w-full max-w-md bg-texture min-h-screen relative overflow-x-hidden shadow-2xl mobile-container pb-10">
    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; color:#e25e4c;">
      <h1 style="font-size:3rem; font-weight:900;">BOKALIA</h1>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) return (
            <div className="p-8 flex flex-col items-center justify-center min-h-screen bg-bokalia-cream text-center">
              <div className="text-6xl mb-4">🚨</div>
              <h1 className="text-2xl font-black text-bokalia-coral mb-2">Error Crítico</h1>
              <p className="text-bokalia-dark text-sm mb-6">{this.state.error.toString()}</p>
              <button onClick={() => window.location.reload()} className="bg-bokalia-coral text-white font-bold py-3 px-6 rounded-xl">Recargar App</button>
            </div>
        );
        return this.props.children;
      }
    }

    const supabase = window.supabase.createClient(
      'https://bswlriuzeintgjioywtz.supabase.co',
      'sb_publishable_oIWpn-mNPUZaQPdf7HNU_Q_Lc7R6UOB',
      { auth: { persistSession: true, storage: window.localStorage, autoRefreshToken: true } }
    );

    function PerfilApp() {
      const [vistaActual, setVistaActual] = useState('inicio'); 
      const [loading, setLoading] = useState(true);
      const [user, setUser] = useState(null);
      
      const [wallets, setWallets] = useState([]); 
      const [historial, setHistorial] = useState([]);
      const [sugerencias, setSugerencias] = useState([]); 
      
      const [recompensas, setRecompensas] = useState([]);
      const [niveles, setNiveles] = useState([]); // 🔥 ESTADO NIVELES
      
      const [modalPremios, setModalPremios] = useState(null); 
      const [modalNiveles, setModalNiveles] = useState(null); // 🔥 MODAL NIVELES
      
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login'); 
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      
      const [showInstallTutorial, setShowInstallTutorial] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      const [notificacionActiva, setNotificacionActiva] = useState(null);
      const [modalErrorCanjeo, setModalErrorCanjeo] = useState(false);
      const walletsRef = useRef([]);

      useEffect(() => {
        walletsRef.current = wallets;
      }, [wallets]);

      useEffect(() => {
        const safeTimer = setTimeout(() => { setLoading(false); }, 2500);
        cargarSugerencias();

        supabase.auth.getSession().then(({ data }) => {
          if (data?.session?.user) procesarUsuario(data.session.user);
          else setLoading(false);
        }).catch(() => setLoading(false));

        const { data: authListener } = supabase.auth.onAuthStateChange((event, session) => {
          if (session?.user) procesarUsuario(session.user);
          else { setUser(null); setWallets([]); setHistorial([]); setRecompensas([]); setNiveles([]); setLoading(false); }
        });

        const canalNotis = supabase.channel('notificaciones_push')
           .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notificaciones' }, payload => {
              const noti = payload.new;
              if (noti.es_global) {
                 setNotificacionActiva(noti);
              } else if (noti.restaurante_id) {
                 const tieneWallet = walletsRef.current.some(w => w.restaurante?.id === noti.restaurante_id);
                 if (tieneWallet) setNotificacionActiva(noti);
              }
           }).subscribe();

        return () => { 
           clearTimeout(safeTimer); 
           if (authListener?.subscription) authListener.subscription.unsubscribe(); 
           supabase.removeChannel(canalNotis);
        };
      }, []);

      const cargarSugerencias = async () => {
         try {
            const { data } = await supabase.from('restaurantes').select('id, nombre, color_tema').order('creado_en', { ascending: false }).limit(20);
            if (data) setSugerencias(data);
         } catch(e) { console.error(e); }
      };

      const procesarUsuario = async (authUser) => {
        setUser(authUser);
        try {
          let { data: perfil } = await supabase.from('usuarios').select('id').eq('id', authUser.id).maybeSingle();
          if (!perfil) await supabase.from('usuarios').insert([{ id: authUser.id, email: authUser.email }]);

          const { data: misPuntos } = await supabase.from('puntos_fidelizacion')
            .select('puntos, restaurante:restaurantes(id, nombre, color_tema)')
            .eq('usuario_id', authUser.id);
            
          if (misPuntos) {
             setWallets(misPuntos);
             const restIds = misPuntos.map(w => w.restaurante?.id).filter(Boolean);
             if (restIds.length > 0) {
                // Descargar Premios
                const { data: recs } = await supabase.from('recompensas')
                   .select('*').in('restaurante_id', restIds).eq('activo', true).order('coste_puntos', { ascending: true });
                if (recs) setRecompensas(recs);

                // 🔥 Descargar Niveles
                const { data: nivs } = await supabase.from('niveles_membresia')
                   .select('*').in('restaurante_id', restIds).order('puntos_minimos', { ascending: true });
                if (nivs) setNiveles(nivs);
             }
          }

          const seisMesesAtras = new Date();
          seisMesesAtras.setMonth(seisMesesAtras.getMonth() - 6);
          const { data: dataHistorial } = await supabase.from('pedidos_rondas')
            .select('id, fecha, estado, sesion:sesiones_mesa!inner(estado, restaurante:restaurantes(nombre, color_tema)), items:items_pedido(cantidad, precio_unitario, producto:productos(nombre))')
            .eq('usuario_id', authUser.id).eq('oculto_usuario', false).eq('sesiones_mesa.estado', 'pagada')
            .gte('fecha', seisMesesAtras.toISOString()).order('fecha', { ascending: false }).limit(20);
            
          if (dataHistorial) setHistorial(dataHistorial.filter(h => h.items && h.items.length > 0));
        } catch(e) { console.error(e); } 
        finally { setLoading(false); }
      };

      const handleAuth = async () => {
        setLoading(true);
        const { error } = authMode === 'register' ? await supabase.auth.signUp({ email, password }) : await supabase.auth.signInWithPassword({ email, password });
        if (error) { setLoading(false); alert("Error: " + error.message); }
        else setShowAuthModal(false);
      };

      const borrarHistorial = async () => {
        if (!user || historial.length === 0) return;
        if (window.confirm("¿Ocultar tus pedidos antiguos?")) {
           await supabase.from('pedidos_rondas').update({ oculto_usuario: true }).eq('usuario_id', user.id);
           setHistorial([]);
           mostrarToast("Historial ocultado 🧹");
        }
      };

      const formatMoney = (num) => Number(num).toFixed(2);
      const formatDate = (dateStr) => {
         const d = new Date(dateStr);
         return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} - ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
      };
      const mostrarToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 4000); };
      const intentarCanjear = () => { setModalErrorCanjeo(true); };

      const walletsConPuntos = wallets.filter(w => w.puntos > 0);
      const restaurantesConPuntosIds = walletsConPuntos.map(w => w.restaurante?.id);
      const sugerenciasFiltradas = sugerencias.filter(rest => !restaurantesConPuntosIds.includes(rest.id));

      if (loading) {
         return (
           <div className="h-screen flex items-center justify-center flex-col">
              <div className="w-16 h-16 border-4 border-bokalia-beige border-t-bokalia-coral rounded-full animate-spin mb-6"></div>
              <h2 className="text-xl font-bold text-bokalia-coral tracking-tight animate-pulse">Cargando Bokalia...</h2>
           </div>
         );
      }

      return (
        <div className="min-h-screen relative flex flex-col pb-10">
          
          {toastMsg && (
            <div className="fixed top-20 left-1/2 transform -translate-x-1/2 z-[60] animate-fade-in w-11/12 max-w-sm">
              <div className="bg-bokalia-dark text-white font-bold px-6 py-4 rounded-2xl shadow-elegant text-center">
                <span>{toastMsg}</span>
              </div>
            </div>
          )}

          <header className="bg-white border-b border-bokalia-beige p-6 shadow-sm flex justify-between items-center rounded-b-[2rem] z-10 relative">
            <h1 className="font-black text-3xl text-bokalia-coral tracking-tighter">BOKALIA</h1>
            {user ? (
               <button onClick={async () => await supabase.auth.signOut()} className="text-[11px] font-bold text-gray-400 bg-gray-50 px-4 py-2 rounded-xl border border-gray-100 active:scale-95 transition-transform uppercase tracking-widest">Salir</button> 
            ) : (
               <button onClick={() => { setAuthMode('login'); setShowAuthModal(true); }} className="text-sm font-bold bg-bokalia-coral text-white px-6 py-2 rounded-xl shadow-md active:scale-95 transition-transform">Entrar</button>
            )}
          </header>

          <div className="flex justify-center gap-6 border-b border-bokalia-beige z-0">
             <button onClick={() => setVistaActual('inicio')} className={`font-bold py-4 px-2 border-b-2 transition-colors ${vistaActual === 'inicio' ? 'border-bokalia-coral text-bokalia-coral' : 'border-transparent text-gray-400'}`}>Mis Wallets</button>
             <button onClick={() => setVistaActual('historial')} className={`font-bold py-4 px-2 border-b-2 transition-colors ${vistaActual === 'historial' ? 'border-bokalia-coral text-bokalia-coral' : 'border-transparent text-gray-400'}`}>Historial</button>
             <button onClick={() => setVistaActual('reservas')} className={`font-bold py-4 px-2 border-b-2 transition-colors ${vistaActual === 'reservas' ? 'border-bokalia-coral text-bokalia-coral' : 'border-transparent text-gray-400'}`}>Reservas</button>
          </div>

          <main className="flex-grow p-5 z-0 relative animate-fade-in">
            
            {vistaActual === 'inicio' && (
               <>
                  {!user && (
                     <div className="relative overflow-hidden rounded-[2rem] p-8 shadow-elegant bg-white border border-bokalia-beige cursor-pointer mt-4" onClick={() => { setAuthMode('register'); setShowAuthModal(true); }}>
                       <div className="relative z-10 flex flex-col items-center justify-center text-center">
                           <div className="text-5xl mb-4">✨</div>
                           <h3 className="font-black text-2xl text-bokalia-dark mb-2">Bokalia Wallet</h3>
                           <p className="text-sm font-medium text-gray-500 mb-8">Regístrate gratis para empezar a sumar puntos con cada comida.</p>
                           <button className="bg-bokalia-coral hover:bg-opacity-90 px-8 py-4 rounded-2xl font-bold text-white shadow-lg w-full text-lg active:scale-95 transition-transform">Activar Cuenta</button>
                       </div>
                     </div>
                  )}

                  {user && walletsConPuntos.length === 0 && (
                     <div className="bg-white border border-bokalia-beige p-8 rounded-[2rem] text-center mt-4 shadow-sm">
                        <span className="text-5xl block mb-4 opacity-70">💳</span>
                        <h3 className="text-xl font-bold text-bokalia-dark mb-2">Aún no tienes puntos</h3>
                        <p className="text-sm text-gray-500 font-medium">Pide tu cuenta en tu próxima visita a cualquier local Bokalia para empezar a sumar puntos.</p>
                     </div>
                  )}

                  {user && walletsConPuntos.length > 0 && (
                     <div className="space-y-6 mt-4">
                        {walletsConPuntos.map((w, idx) => {
                           const bgColor = w.restaurante?.color_tema || '#e25e4c'; 
                           
                           // Lógica Premios
                           const premiosLocal = recompensas.filter(r => r.restaurante_id === w.restaurante?.id);
                           const nextReward = premiosLocal.find(r => r.coste_puntos > w.puntos) || premiosLocal[premiosLocal.length - 1] || { titulo: 'Nivel Máximo', coste_puntos: w.puntos || 1000 };
                           const progress = Math.min((w.puntos / nextReward.coste_puntos) * 100, 100);

                           // 🔥 Lógica Niveles
                           const nivelesLocal = niveles.filter(n => n.restaurante_id === w.restaurante?.id);
                           const currentLevel = [...nivelesLocal].reverse().find(n => n.puntos_minimos <= w.puntos) || { nombre: 'Miembro', color: '#ffffff', puntos_minimos: 0 };
                           const nextLevel = nivelesLocal.find(n => n.puntos_minimos > w.puntos);

                           return (
                             <div key={idx} className="relative overflow-hidden rounded-[2rem] p-8 shadow-elegant-lg text-white border border-white/10" style={{ background: `linear-gradient(135deg, ${bgColor}, #302b28)` }}>
                               <div className="absolute -right-12 -top-12 w-48 h-48 rounded-full bg-white opacity-10 blur-2xl"></div>
                               <div className="absolute -left-8 -bottom-8 w-32 h-32 rounded-full bg-white opacity-5 blur-xl"></div>
                               
                               <div className="relative z-10 flex justify-between items-start mb-6">
                                 <div>
                                   <p className="text-xs font-bold uppercase tracking-widest mb-1 opacity-80">{w.restaurante?.nombre || 'Restaurante'}</p>
                                   <p className="text-5xl font-black tracking-tighter">{w.puntos} <span className="text-xl font-medium opacity-80">pts</span></p>
                                 </div>
                                 
                                 {/* ETIQUETA RANGO ACTUAL */}
                                 <div className="bg-white/10 backdrop-blur-md px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase shadow-sm tracking-widest border border-white/20 flex items-center gap-1.5">
                                   <span className="w-2 h-2 rounded-full shadow-sm" style={{ backgroundColor: currentLevel.color }}></span>
                                   {currentLevel.nombre}
                                 </div>
                               </div>
                               
                               <div className="relative z-10 mb-6">
                                 <div className="flex justify-between text-xs font-semibold opacity-90 mb-3">
                                   <span className="uppercase tracking-wide truncate pr-2">Regalo: {nextReward.titulo}</span>
                                   <span className="shrink-0">{w.puntos} / {nextReward.coste_puntos}</span>
                                 </div>
                                 <div className="h-2 w-full bg-black/20 rounded-full overflow-hidden">
                                   <div className="h-full bg-white rounded-full transition-all duration-1000" style={{ width: `${progress}%` }}></div>
                                 </div>
                                 
                                 {/* 🔥 TEXTO: CUANTO FALTA PARA EL SIGUIENTE NIVEL VIP */}
                                 {nextLevel && (
                                    <p className="text-[11px] font-medium text-white/70 text-center mt-3">
                                       A <span className="font-bold text-white">{nextLevel.puntos_minimos - w.puntos} pts</span> del rango <b style={{ color: nextLevel.color }}>{nextLevel.nombre}</b>
                                    </p>
                                 )}
                               </div>

                               {/* 🔥 BOTONES DIVIDIDOS ELEGANTES */}
                               <div className="relative z-10 flex gap-3 mt-2">
                                  <button onClick={() => setModalPremios(w)} className="flex-1 bg-white text-bokalia-dark font-bold py-3.5 rounded-xl text-sm active:scale-95 transition-transform shadow-lg border border-transparent">
                                     🎁 Premios
                                  </button>
                                  <button onClick={() => setModalNiveles(w)} className="flex-1 bg-white/10 hover:bg-white/20 backdrop-blur-md text-white font-bold py-3.5 rounded-xl text-sm active:scale-95 transition-transform border border-white/20 shadow-sm">
                                     ⭐ Rangos
                                  </button>
                               </div>
                             </div>
                           );
                        })}
                     </div>
                  )}

                  {sugerenciasFiltradas.length > 0 && (
                     <div className="mt-12">
                        <h2 className="text-xl font-bold text-bokalia-dark mb-2 tracking-tight flex items-center gap-2">Descubre más locales</h2>
                        <p className="text-gray-500 text-sm mb-6">Visita nuestros restaurantes asociados y expande tu wallet.</p>
                        <div className="grid gap-4 overflow-x-auto pb-4 custom-scrollbar snap-x" style={{ gridTemplateRows: 'repeat(2, 1fr)', gridAutoFlow: 'column', gridAutoColumns: 'calc(50% - 0.5rem)' }}>
                           {sugerenciasFiltradas.map(rest => (
                              <div key={rest.id} className="snap-start relative overflow-hidden p-5 rounded-3xl shadow-elegant border border-bokalia-beige bg-white flex items-center h-24">
                                 <div className="w-1.5 h-10 rounded-full mr-3" style={{ backgroundColor: rest.color_tema || '#e25e4c' }}></div>
                                 <div className="relative z-10">
                                    <p className="font-bold text-sm text-bokalia-dark leading-tight">{rest.nombre}</p>
                                    <p className="text-[10px] font-semibold text-gray-400 uppercase tracking-widest mt-1">Colaborador</p>
                                 </div>
                              </div>
                           ))}
                        </div>
                     </div>
                  )}

                  {user && !window.matchMedia('(display-mode: standalone)').matches && !window.navigator.standalone && (
                     <div onClick={() => setShowInstallTutorial(true)} className="mt-10 bg-white border border-bokalia-beige p-6 rounded-[2rem] flex justify-between items-center shadow-sm cursor-pointer active:scale-95 transition-transform">
                        <div>
                           <p className="text-sm font-bold text-bokalia-dark mb-1">App Nativa</p>
                           <p className="text-xs font-medium text-gray-500">Añádenos a tu inicio.</p>
                        </div>
                        <button className="bg-bokalia-beige text-bokalia-dark text-xs font-bold px-4 py-2 rounded-lg">Instalar</button>
                     </div>
                  )}
               </>
            )}

            {vistaActual === 'historial' && (
               <div className="animate-fade-in">
                  <h2 className="text-xl font-bold text-bokalia-dark mb-6 tracking-tight">Últimos Pedidos</h2>
                  {!user && (
                     <div className="bg-white p-8 rounded-[2rem] text-center border border-bokalia-beige mt-4 shadow-sm">
                        <p className="text-gray-500 font-medium mb-6">Inicia sesión para ver tu historial de visitas.</p>
                        <button onClick={() => setShowAuthModal(true)} className="bg-bokalia-coral text-white px-8 py-4 rounded-2xl font-bold w-full shadow-lg">Entrar ahora</button>
                     </div>
                  )}
                  {user && historial.length === 0 && (
                     <div className="bg-white p-8 rounded-[2rem] text-center mt-4 border border-bokalia-beige shadow-sm"><span className="text-4xl opacity-50 block mb-3">🧾</span><p className="text-gray-500 font-medium">Aún no hay visitas pagadas.</p></div>
                  )}
                  {user && historial.length > 0 && (
                     <div className="space-y-4">
                        {historial.map((h) => {
                           const total = h.items.reduce((acc, item) => acc + (item.cantidad * item.precio_unitario), 0);
                           return (
                              <div key={h.id} className="bg-white p-6 rounded-3xl shadow-sm border border-bokalia-beige">
                                <div className="flex justify-between items-center border-b border-bokalia-beige pb-4 mb-4">
                                  <div>
                                     <span className="text-[11px] font-bold text-bokalia-dark uppercase tracking-widest">{h.sesion?.restaurante?.nombre || 'Local Bokalia'}</span>
                                     <span className="text-[11px] font-medium text-gray-400 block mt-1">{formatDate(h.fecha)}</span>
                                  </div>
                                  <span className="text-lg font-black text-bokalia-coral">{formatMoney(total)}€</span>
                                </div>
                                <ul className="text-sm text-gray-600 space-y-3">
                                  {h.items.map((item, idx) => (
                                    <li key={idx} className="flex gap-3 font-medium items-center">
                                       <span className="bg-bokalia-beige text-bokalia-dark px-2 py-0.5 rounded-md text-xs font-bold">{item.cantidad}x</span>{item.producto?.nombre}
                                    </li>
                                  ))}
                                </ul>
                              </div>
                           );
                        })}
                        <button onClick={borrarHistorial} className="w-full mt-8 text-gray-400 font-bold py-4 rounded-2xl active:bg-bokalia-beige transition-colors text-sm uppercase tracking-widest">Ocultar historial</button>
                     </div>
                  )}
               </div>
            )}

            {vistaActual === 'reservas' && (
               <div className="p-10 text-center mt-10 animate-fade-in bg-white rounded-[2rem] border border-bokalia-beige shadow-sm">
                 <div className="text-5xl mb-6 opacity-70">📅</div>
                 <h2 className="text-2xl font-bold text-bokalia-dark mb-2">Próximamente</h2>
                 <p className="text-gray-500 font-medium text-sm">Estamos preparando una experiencia de reservas a tu medida.</p>
               </div>
            )}
          </main>

          {/* ========================================== */}
          {/* 🔥 MODALES FLOTANTES PREMIUM 🔥              */}
          {/* ========================================== */}

          {/* MODAL: PREMIOS VIP */}
          {modalPremios && (
            <div className="fixed inset-0 bg-bokalia-dark/60 backdrop-blur-sm z-[150] flex items-end justify-center p-0 animate-fade-in">
              <div className="bg-bokalia-cream w-full max-w-md rounded-t-[2.5rem] flex flex-col shadow-2xl relative animate-slide-up h-[85vh]">
                <div className="p-6 pb-4 flex justify-between items-center rounded-t-[2.5rem] sticky top-0 z-10 bg-bokalia-cream border-b border-bokalia-beige">
                   <div>
                      <h3 className="text-2xl font-black text-bokalia-dark tracking-tight">Premios VIP</h3>
                      <p className="text-sm font-bold text-gray-500 mt-1">Tienes <span className="text-bokalia-coral">{modalPremios.puntos} pts</span></p>
                   </div>
                   <button onClick={() => setModalPremios(null)} className="text-gray-400 font-bold text-xl bg-white w-10 h-10 rounded-full flex items-center justify-center shadow-sm active:scale-95 transition-transform border border-bokalia-beige">✕</button>
                </div>
                <div className="flex-grow overflow-y-auto p-5 space-y-4">
                   {recompensas.filter(r => r.restaurante_id === modalPremios.restaurante?.id).length === 0 ? (
                      <div className="p-8 text-center opacity-50 mt-10"><p className="text-5xl mb-4">🎁</p><p className="font-medium text-gray-600">Catálogo en preparación.</p></div>
                   ) : (
                      recompensas.filter(r => r.restaurante_id === modalPremios.restaurante?.id).map(premio => {
                         const puedoCanjear = modalPremios.puntos >= premio.coste_puntos;
                         return (
                            <div key={premio.id} className="bg-white rounded-3xl shadow-sm border border-bokalia-beige overflow-hidden flex flex-col">
                               <div className="h-40 bg-gray-100 shrink-0 relative"><img src={premio.imagen_url} className="w-full h-full object-cover" /></div>
                               <div className="p-5 flex flex-col flex-grow">
                                  <h4 className="font-bold text-bokalia-dark text-lg leading-tight mb-2">{premio.titulo}</h4>
                                  <p className="text-xs text-gray-500 font-medium mb-6 leading-relaxed line-clamp-2">{premio.descripcion}</p>
                                  <div className="mt-auto">
                                     {puedoCanjear ? (
                                        <button onClick={intentarCanjear} className="w-full bg-bokalia-coral text-white font-bold py-3.5 rounded-2xl text-sm shadow-lg shadow-bokalia-coral/30 active:scale-95 transition-transform flex justify-between px-6 items-center">
                                           <span>Canjear</span><span>{premio.coste_puntos} pts</span>
                                        </button>
                                     ) : (
                                        <button disabled className="w-full bg-bokalia-beige text-gray-400 font-bold py-3.5 rounded-2xl text-sm flex justify-between px-6 items-center">
                                           <span>Faltan {premio.coste_puntos - modalPremios.puntos} pts</span><span>{premio.coste_puntos} pts</span>
                                        </button>
                                     )}
                                  </div>
                               </div>
                            </div>
                         )
                      })
                   )}
                </div>
              </div>
            </div>
          )}

          {/* 🔥 MODAL: NIVELES VIP (NUEVO) 🔥 */}
          {modalNiveles && (
            <div className="fixed inset-0 bg-bokalia-dark/60 backdrop-blur-sm z-[150] flex items-end justify-center p-0 animate-fade-in">
              <div className="bg-bokalia-cream w-full max-w-md rounded-t-[2.5rem] flex flex-col shadow-2xl relative animate-slide-up h-[85vh]">
                <div className="p-6 pb-4 flex justify-between items-center rounded-t-[2.5rem] sticky top-0 z-10 bg-bokalia-cream border-b border-bokalia-beige">
                   <div>
                      <h3 className="text-2xl font-black text-bokalia-dark tracking-tight">Rangos VIP</h3>
                      <p className="text-sm font-bold text-gray-500 mt-1">Tienes <span className="text-bokalia-coral">{modalNiveles.puntos} pts</span></p>
                   </div>
                   <button onClick={() => setModalNiveles(null)} className="text-gray-400 font-bold text-xl bg-white w-10 h-10 rounded-full flex items-center justify-center shadow-sm active:scale-95 transition-transform border border-bokalia-beige">✕</button>
                </div>
                <div className="flex-grow overflow-y-auto p-5 space-y-4">
                   {niveles.filter(n => n.restaurante_id === modalNiveles.restaurante?.id).length === 0 ? (
                      <div className="p-8 text-center opacity-50 mt-10"><p className="text-5xl mb-4">⭐</p><p className="font-medium text-gray-600">No hay rangos definidos.</p></div>
                   ) : (
                      niveles.filter(n => n.restaurante_id === modalNiveles.restaurante?.id).map((nivel, idx) => {
                         const superado = modalNiveles.puntos >= nivel.puntos_minimos;
                         return (
                            <div key={nivel.id} className={`bg-white rounded-3xl p-5 shadow-sm border ${superado ? 'border-bokalia-coral/30' : 'border-bokalia-beige'} flex items-center justify-between`}>
                               <div className="flex items-center gap-4">
                                  <div className="w-12 h-12 rounded-2xl flex items-center justify-center font-black text-white text-xl shadow-md" style={{ backgroundColor: nivel.color }}>
                                     {idx + 1}
                                  </div>
                                  <div>
                                     <h4 className="font-bold text-bokalia-dark text-lg">{nivel.nombre}</h4>
                                     <p className="text-xs font-medium text-gray-400">A partir de {nivel.puntos_minimos} pts</p>
                                  </div>
                               </div>
                               <div>{superado ? <span className="text-2xl">✅</span> : <span className="text-2xl opacity-30">🔒</span>}</div>
                            </div>
                         )
                      })
                   )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL ERROR CANJEO (CENTRADO) */}
          {modalErrorCanjeo && (
             <div className="fixed inset-0 bg-bokalia-dark/60 backdrop-blur-md z-[300] flex items-center justify-center p-4 animate-fade-in">
                <div className="bg-white w-full max-w-xs rounded-[2rem] p-8 text-center shadow-2xl relative animate-slide-up border border-bokalia-beige">
                   <div className="text-5xl mb-4">🛎️</div>
                   <h3 className="text-xl font-bold text-bokalia-dark mb-2">Canjeo en Local</h3>
                   <p className="text-sm text-gray-500 font-medium mb-8 leading-relaxed">Para disfrutar tu premio VIP, por favor avisa a tu camarero en el momento de pedir la cuenta.</p>
                   <button onClick={() => setModalErrorCanjeo(false)} className="w-full bg-bokalia-coral text-white font-bold py-3.5 rounded-xl shadow-lg active:scale-95 transition-transform">Entendido</button>
                </div>
             </div>
          )}

          {/* MODAL NOTIFICACIONES PUSH (TIEMPO REAL) */}
          {notificacionActiva && (
             <div className="fixed inset-0 bg-bokalia-dark/60 backdrop-blur-md z-[300] flex items-center justify-center p-4 animate-fade-in">
                <div className="bg-white w-full max-w-sm rounded-[2.5rem] p-8 text-center shadow-2xl relative animate-slide-up border-4 border-bokalia-beige">
                   <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-bokalia-coral text-white text-3xl w-14 h-14 rounded-full flex items-center justify-center shadow-lg border-4 border-white">📣</div>
                   <h3 className="text-2xl font-black text-bokalia-dark mb-3 mt-6 tracking-tight">{notificacionActiva.titulo}</h3>
                   <p className="text-sm text-gray-600 font-medium mb-8 leading-relaxed">{notificacionActiva.mensaje}</p>
                   <button onClick={() => setNotificacionActiva(null)} className="w-full bg-bokalia-dark text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-transform">Cerrar aviso</button>
                </div>
             </div>
          )}

          {/* MODAL: AUTH */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-bokalia-dark/60 backdrop-blur-sm z-[200] flex items-end justify-center p-0 animate-fade-in">
              <div className="bg-white rounded-t-[2.5rem] p-8 w-full max-w-md relative shadow-2xl animate-slide-up">
                <button onClick={() => setShowAuthModal(false)} className="absolute top-6 right-6 text-gray-400 font-bold text-xl bg-bokalia-cream w-10 h-10 rounded-full flex items-center justify-center border border-bokalia-beige active:scale-95">✕</button>
                <h3 className="text-3xl font-black mb-2 text-bokalia-dark tracking-tight">{authMode === 'login' ? 'Hola de nuevo' : 'Únete al club'}</h3>
                <p className="text-gray-500 mb-8 font-medium text-sm">{authMode === 'login' ? 'Entra a tu cuenta para ver tu wallet.' : 'Crea tu cuenta para ganar puntos.'}</p>
                <input type="email" placeholder="Correo electrónico" value={email} onChange={e => setEmail(e.target.value)} className="w-full mb-4 p-4 bg-bokalia-cream border border-bokalia-beige rounded-2xl outline-none font-medium focus:border-bokalia-coral transition-colors" />
                <input type="password" placeholder="Contraseña" value={password} onChange={e => setPassword(e.target.value)} className="w-full mb-8 p-4 bg-bokalia-cream border border-bokalia-beige rounded-2xl outline-none font-medium focus:border-bokalia-coral transition-colors" />
                <button onClick={handleAuth} className="w-full text-white font-bold py-4 rounded-2xl text-lg active:scale-95 transition-transform mb-4 shadow-lg bg-bokalia-coral">
                   {authMode === 'login' ? 'Entrar' : 'Registrarme'}
                </button>
                <button onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')} className="w-full text-gray-500 font-medium py-2 text-sm">{authMode === 'login' ? 'No tengo cuenta, crear una' : 'Ya tengo cuenta, iniciar sesión'}</button>
              </div>
            </div>
          )}

          {/* MODAL: INSTALACIÓN */}
          {showInstallTutorial && (
             <div className="fixed inset-0 bg-bokalia-dark/60 backdrop-blur-sm z-[200] flex items-end justify-center p-0 animate-fade-in">
                <div className="bg-white w-full max-w-md rounded-t-[2.5rem] p-8 text-center shadow-2xl relative animate-slide-up border-t-8 border-bokalia-coral">
                   <button onClick={() => setShowInstallTutorial(false)} className="absolute top-6 right-6 text-gray-400 font-bold text-xl bg-bokalia-cream w-10 h-10 rounded-full flex items-center justify-center border border-bokalia-beige active:scale-95">✕</button>
                   <div className="text-5xl mb-4 mt-2">📲</div>
                   <h3 className="text-2xl font-black text-bokalia-dark mb-2 tracking-tight">App Nativa</h3>
                   <p className="text-gray-500 font-medium mb-8 text-sm">Instala la App en tu pantalla de inicio para acceder al instante.</p>
                   <div className="bg-bokalia-cream p-5 rounded-2xl text-left text-sm font-medium text-bokalia-dark space-y-4 mb-8 border border-bokalia-beige">
                      <p className="flex items-start gap-3"><span className="text-xl">1️⃣</span> <span className="mt-1">Toca <b>Compartir</b> en Safari o <b>3 puntitos</b> en Chrome.</span></p>
                      <p className="flex items-center gap-3"><span className="text-xl">2️⃣</span> <span>Desliza por el menú de opciones.</span></p>
                      <p className="flex items-start gap-3"><span className="text-xl">3️⃣</span> <span className="mt-1">Toca <b>Añadir a pantalla de inicio</b> ➕.</span></p>
                   </div>
                   <button onClick={() => setShowInstallTutorial(false)} className="w-full bg-bokalia-beige text-bokalia-dark font-bold py-4 rounded-2xl text-lg active:scale-95 transition-transform">Entendido</button>
                </div>
             </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><PerfilApp /></ErrorBoundary>);
  </script>
</body>
</html>
