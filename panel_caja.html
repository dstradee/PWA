<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caja Bokalia - Panel de Control</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; }
    @keyframes blinkAmber {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }
    .animate-blink { animation: blinkAmber 2s infinite; border-color: #f59e0b !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const supabase = window.supabase.createClient(
      'https://bswlriuzeintgjioywtz.supabase.co',
      'sb_publishable_oIWpn-mNPUZaQPdf7HNU_Q_Lc7R6UOB'
    );

    function CajaPanel() {
      const [mesas, setMesas] = useState([]);
      const [conexionDb, setConexionDb] = useState('conectando'); 
      const [audioUnlock, setAudioUnlock] = useState(false);
      
      const audioCtxRef = useRef(null);
      const intervalRef = useRef(null);

      // 1. INICIALIZAR SISTEMA Y AUDIO (Para engañar a Apple y que deje sonar el iPad)
      const inicializarSistema = () => {
         const AudioContext = window.AudioContext || window.webkitAudioContext;
         audioCtxRef.current = new AudioContext();
         const osc = audioCtxRef.current.createOscillator();
         osc.connect(audioCtxRef.current.destination);
         osc.start();
         osc.stop(audioCtxRef.current.currentTime + 0.01);
         setAudioUnlock(true);
      };

      // 2. FUNCIÓN DE ALARMA SONORA (Ding)
      const playBeep = () => {
         if (!audioCtxRef.current || audioCtxRef.current.state !== 'running') return;
         const osc = audioCtxRef.current.createOscillator();
         const gainNode = audioCtxRef.current.createGain();
         
         osc.connect(gainNode);
         gainNode.connect(audioCtxRef.current.destination);
         
         osc.type = 'sine';
         osc.frequency.setValueAtTime(880, audioCtxRef.current.currentTime); 
         gainNode.gain.setValueAtTime(0.2, audioCtxRef.current.currentTime);
         
         osc.start();
         gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtxRef.current.currentTime + 0.5);
         osc.stop(audioCtxRef.current.currentTime + 0.5);
      };

      // 3. CARGAR MESAS
      const cargarMesasActivas = async () => {
         try {
            const { data, error } = await supabase.from('sesiones_mesa')
               .select(`
                  *,
                  rondas:pedidos_rondas(
                     id, usuario_id, estado,
                     usuario:usuarios(nombre, email),
                     items:items_pedido(cantidad, precio_unitario, producto:productos(nombre))
                  )
               `)
               .in('estado', ['activa', 'pagando']);
               
            if (error) throw error;
            
            const mesasProcesadas = data.map(mesa => {
               const usuariosMap = {};
               let totalMesa = 0;
               
               mesa.rondas.forEach(ronda => {
                  if (ronda.estado === 'pendiente') return; 
                  
                  const userId = ronda.usuario_id;
                  const userName = ronda.usuario?.nombre || ronda.usuario?.email?.split('@')[0] || 'Cliente';
                  
                  if (!usuariosMap[userId]) {
                     usuariosMap[userId] = { nombre: userName, subtotal: 0, items: [] };
                  }
                  
                  ronda.items.forEach(item => {
                     const costeItem = item.cantidad * item.precio_unitario;
                     usuariosMap[userId].subtotal += costeItem;
                     usuariosMap[userId].items.push(item);
                     totalMesa += costeItem;
                  });
               });
               
               return { ...mesa, desglose: usuariosMap, totalConsolidado: totalMesa };
            });
            
            setMesas(mesasProcesadas);
            setConexionDb('conectado');
         } catch (e) {
            console.error("Error DB:", e);
            setConexionDb('desconectado');
         }
      };

      // 4. WEBSOCKETS (REALTIME Y RECONEXIÓN)
      useEffect(() => {
         if (!audioUnlock) return;
         cargarMesasActivas();

         const canalCaja = supabase.channel('caja_sync')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'sesiones_mesa' }, () => {
               cargarMesasActivas();
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos_rondas' }, () => {
               cargarMesasActivas();
            })
            .subscribe((status) => {
               if (status === 'SUBSCRIBED') setConexionDb('conectado');
               else setConexionDb('desconectado');
            });

         const reconexionInterval = setInterval(() => {
            if (conexionDb === 'desconectado') cargarMesasActivas();
         }, 5000);

         return () => {
            supabase.removeChannel(canalCaja);
            clearInterval(reconexionInterval);
         };
      }, [audioUnlock, conexionDb]);

      // 5. CONTROLADOR DEL SONIDO (CADA 5 SEG)
      useEffect(() => {
         const hayMesaPagando = mesas.some(m => m.estado === 'pagando');
         
         if (hayMesaPagando && !intervalRef.current) {
            playBeep(); // Suena al instante
            intervalRef.current = setInterval(playBeep, 5000); // Y luego cada 5 seg
         } else if (!hayMesaPagando && intervalRef.current) {
            clearInterval(intervalRef.current);
            intervalRef.current = null;
         }
      }, [mesas]);

      // 6. BOTÓN MAESTRO: CUENTA PAGADA (CON CAZADOR DE ERRORES ESTRICTO)
      const handleCompleteTable = async (mesa) => {
         try {
            // Detenemos el sonido temporalmente
            if (intervalRef.current) {
               clearInterval(intervalRef.current);
               intervalRef.current = null;
            }

            // Paso A: Cambiamos estado de la mesa en la base de datos
            const { error: errMesa } = await supabase.from('sesiones_mesa').update({ estado: 'pagada' }).eq('id', mesa.id);
            if (errMesa) throw new Error("Fallo al actualizar la mesa: " + errMesa.message);
            
            // Paso B: Reparto de puntos
            for (const userId of Object.keys(mesa.desglose)) {
               const subtotal = mesa.desglose[userId].subtotal;
               const puntosGanados = Math.floor(subtotal * 20); // 20 Puntos por euro (Lo he igualado a como estaba en la app)
               
               if (puntosGanados > 0) {
                  const { data: usr, error: errUsr } = await supabase.from('usuarios').select('puntos').eq('id', userId).single();
                  if (!errUsr) {
                      await supabase.from('usuarios').update({ puntos: (usr?.puntos || 0) + puntosGanados }).eq('id', userId);
                  }
               }
            }
            
            // Paso C: Disparamos el contador de Reseñas de 5 minutos en el backend
            const programadoPara = new Date(Date.now() + 5 * 60000).toISOString();
            const { error: errResena } = await supabase.from('resenas_pendientes').insert([{ sesion_id: mesa.id, programado_para: programadoPara }]);
            if (errResena) console.warn("Aviso (No crítico): Falló el trigger de reseñas -> " + errResena.message);
            
            // Paso D: Limpiamos la mesa del iPad
            setMesas(mesas.filter(m => m.id !== mesa.id));
            alert("✅ ¡MESA COBRADA! Puntos repartidos a los clientes.");
            
         } catch (error) {
            // SI ALGO FALLA, SALTA ESTE ERROR ROJO:
            alert("❌ ERROR AL COBRAR: " + error.message);
         }
      };

      // --- RENDERIZADO UI ---
      if (!audioUnlock) {
         return (
            <div className="h-screen bg-gray-900 flex flex-col items-center justify-center p-6 text-center">
               <h1 className="text-4xl font-black text-white mb-4">PANEL DE CAJA BOKALIA</h1>
               <p className="text-gray-400 mb-8">Pulsa el botón para habilitar las notificaciones sonoras.</p>
               <button onClick={inicializarSistema} className="bg-red-600 hover:bg-red-700 text-white font-black text-xl py-6 px-12 rounded-3xl shadow-2xl transition-transform active:scale-95">
                  ▶ INICIALIZAR PANEL
               </button>
            </div>
         );
      }

      return (
         <div className="min-h-screen bg-gray-100 flex flex-col">
            <header className="bg-gray-900 text-white p-6 shadow-md flex justify-between items-center">
               <div className="flex items-center gap-4">
                  <h1 className="text-2xl font-black tracking-widest text-yellow-400">BOKALIA CAJA</h1>
                  <span className="bg-gray-800 px-3 py-1 rounded-lg text-xs font-bold uppercase border border-gray-700">iPad Barra</span>
               </div>
               
               <div className="flex items-center gap-2 bg-gray-800 px-4 py-2 rounded-full border border-gray-700">
                  <span className={`w-3 h-3 rounded-full ${conexionDb === 'conectado' ? 'bg-green-500 shadow-[0_0_8px_#22c55e]' : 'bg-red-500 animate-pulse'}`}></span>
                  <span className="text-xs font-bold text-gray-300 uppercase tracking-widest">
                     {conexionDb === 'conectado' ? 'DB Conectada' : 'Reconectando...'}
                  </span>
               </div>
            </header>

            <main className="p-6 flex-grow">
               <div className="flex items-center justify-between mb-8">
                  <h2 className="text-xl font-black text-gray-800">Mesas en Sala ({mesas.length})</h2>
                  <div className="flex gap-4">
                     <span className="flex items-center gap-2 text-sm font-bold text-gray-500"><div className="w-4 h-4 bg-white border-2 border-gray-300 rounded"></div> Activa</span>
                     <span className="flex items-center gap-2 text-sm font-bold text-amber-600"><div className="w-4 h-4 bg-amber-50 border-2 border-amber-500 rounded animate-blink"></div> Pidiendo Cuenta</span>
                  </div>
               </div>

               {mesas.length === 0 ? (
                  <div className="h-64 flex items-center justify-center bg-white rounded-3xl border-2 border-dashed border-gray-300">
                     <p className="text-xl font-bold text-gray-400">No hay mesas activas en sala.</p>
                  </div>
               ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                     {mesas.sort((a,b) => (a.estado === 'pagando' ? -1 : 1)).map(mesa => (
                        <div key={mesa.id} className={`bg-white rounded-3xl overflow-hidden shadow-lg border-4 transition-all duration-300 ${mesa.estado === 'pagando' ? 'animate-blink bg-amber-50' : 'border-transparent'}`}>
                           
                           <div className={`p-5 flex justify-between items-center ${mesa.estado === 'pagando' ? 'bg-amber-500 text-white' : 'bg-gray-100'}`}>
                              <h3 className="text-2xl font-black">Mesa {mesa.num_mesa}</h3>
                              <span className={`px-3 py-1 text-xs font-black uppercase rounded-lg tracking-widest ${mesa.estado === 'pagando' ? 'bg-red-600 text-white shadow-md' : 'bg-green-200 text-green-800'}`}>
                                 {mesa.estado === 'pagando' ? '🔥 PIDIENDO CUENTA' : 'Comiendo'}
                              </span>
                           </div>

                           <div className="p-5">
                              {Object.keys(mesa.desglose).length === 0 ? (
                                 <p className="text-gray-400 text-sm font-medium py-4 text-center">Sin pedidos confirmados aún.</p>
                              ) : (
                                 <div className="space-y-4">
                                    {Object.values(mesa.desglose).map((user, idx) => (
                                       <div key={idx} className="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                                          <div className="flex justify-between items-center mb-2 border-b border-gray-200 pb-2">
                                             <p className="font-black text-gray-700 text-sm uppercase tracking-wider">{user.nombre}</p>
                                             <p className="font-black text-green-600">{Number(user.subtotal).toFixed(2)}€</p>
                                          </div>
                                          <ul className="space-y-1">
                                             {user.items.map((item, i) => (
                                                <li key={i} className="flex justify-between text-xs text-gray-600 font-medium">
                                                   <span>{item.cantidad}x {item.producto?.nombre}</span>
                                                </li>
                                             ))}
                                          </ul>
                                       </div>
                                    ))}
                                 </div>
                              )}
                           </div>

                           <div className="p-5 bg-gray-50 border-t border-gray-100">
                              <div className="flex justify-between items-end mb-4">
                                 <span className="text-gray-500 font-bold uppercase text-xs tracking-widest">Total Consolidado</span>
                                 <span className="text-4xl font-black text-gray-900">{Number(mesa.totalConsolidado).toFixed(2)}€</span>
                              </div>
                              
                              <button 
                                 onClick={() => handleCompleteTable(mesa)}
                                 disabled={mesa.estado !== 'pagando'}
                                 className={`w-full py-4 rounded-2xl font-black text-lg transition-transform ${mesa.estado === 'pagando' ? 'bg-green-500 text-white shadow-lg active:scale-95 hover:bg-green-600' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                              >
                                 {mesa.estado === 'pagando' ? '✓ CUENTA PAGADA' : 'Esperando solicitud...'}
                              </button>
                           </div>

                        </div>
                     ))}
                  </div>
               )}
            </main>
         </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CajaPanel />);
  </script>
</body>
</html>
