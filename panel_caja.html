<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caja Bokalia - Panel de Control</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; }
    @keyframes blinkAmber {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }
    .animate-blink { animation: blinkAmber 2s infinite; border-color: #f59e0b !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const supabase = window.supabase.createClient(
      'https://bswlriuzeintgjioywtz.supabase.co',
      'sb_publishable_oIWpn-mNPUZaQPdf7HNU_Q_Lc7R6UOB'
    );

    function CajaPanel() {
      const [mesas, setMesas] = useState([]);
      const [conexionDb, setConexionDb] = useState('conectando'); 
      const [notifPerm, setNotifPerm] = useState('default');
      
      // Para no enviar 20 notificaciones de la misma mesa, guardamos memoria de a quién hemos avisado
      const mesasNotificadas = useRef(new Set());

      // 1. INICIALIZAR Y PEDIR PERMISOS
      useEffect(() => {
         if ('Notification' in window) {
            setNotifPerm(Notification.permission);
         }
      }, []);

      const pedirNotificaciones = async () => {
         if (!('Notification' in window)) {
            alert("Tu dispositivo no soporta notificaciones nativas.");
            return;
         }
         try {
            const permission = await Notification.requestPermission();
            setNotifPerm(permission);
            if (permission === 'granted') alert("¡Notificaciones de Barra activadas! 🔔");
            else alert("Avisos bloqueados. Actívalos en los Ajustes del dispositivo.");
         } catch (error) {
            console.error("Error al pedir notificaciones:", error);
         }
      };

      // 2. CARGAR MESAS
      const cargarMesasActivas = async () => {
         try {
            const { data, error } = await supabase.from('sesiones_mesa')
               .select(`
                  *,
                  rondas:pedidos_rondas(
                     id, usuario_id, estado,
                     usuario:usuarios(nombre, email),
                     items:items_pedido(cantidad, precio_unitario, producto:productos(nombre))
                  )
               `)
               .in('estado', ['activa', 'pagando']);
               
            if (error) throw error;
            
            const mesasProcesadas = data.map(mesa => {
               const usuariosMap = {};
               let totalMesa = 0;
               
               mesa.rondas.forEach(ronda => {
                  if (ronda.estado === 'pendiente') return; 
                  
                  const userId = ronda.usuario_id;
                  const userName = ronda.usuario?.nombre || ronda.usuario?.email?.split('@')[0] || 'Cliente';
                  
                  if (!usuariosMap[userId]) {
                     usuariosMap[userId] = { nombre: userName, subtotal: 0, items: [] };
                  }
                  
                  ronda.items.forEach(item => {
                     const costeItem = item.cantidad * item.precio_unitario;
                     usuariosMap[userId].subtotal += costeItem;
                     usuariosMap[userId].items.push(item);
                     totalMesa += costeItem;
                  });
               });
               
               return { ...mesa, desglose: usuariosMap, totalConsolidado: totalMesa };
            });
            
            setMesas(mesasProcesadas);
            setConexionDb('conectado');
         } catch (e) {
            console.error("Error DB:", e);
            setConexionDb('desconectado');
         }
      };

      // 3. WEBSOCKETS (REALTIME Y RECONEXIÓN)
      useEffect(() => {
         cargarMesasActivas();

         const canalCaja = supabase.channel('caja_sync')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'sesiones_mesa' }, () => {
               cargarMesasActivas();
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos_rondas' }, () => {
               cargarMesasActivas();
            })
            .subscribe((status) => {
               if (status === 'SUBSCRIBED') setConexionDb('conectado');
               else setConexionDb('desconectado');
            });

         const reconexionInterval = setInterval(() => {
            if (conexionDb === 'desconectado') cargarMesasActivas();
         }, 5000);

         return () => {
            supabase.removeChannel(canalCaja);
            clearInterval(reconexionInterval);
         };
      }, [conexionDb]);

      // 4. CONTROLADOR DE NOTIFICACIONES PUSH
      useEffect(() => {
         mesas.forEach(mesa => {
            // Si la mesa pide cuenta y no la habíamos notificado antes
            if (mesa.estado === 'pagando' && !mesasNotificadas.current.has(mesa.id)) {
               mesasNotificadas.current.add(mesa.id); // La marcamos como notificada
               
               if (notifPerm === 'granted') {
                  new Notification('🔥 ¡Mesa Pidiendo Cuenta!', {
                     body: `La Mesa ${mesa.num_mesa} quiere pagar el total de ${Number(mesa.totalConsolidado).toFixed(2)}€.`,
                     icon: 'https://cdn-icons-png.flaticon.com/512/3514/3514491.png' // Icono genérico de ticket
                  });
               }
            }
         });
      }, [mesas, notifPerm]);

      // 5. BOTÓN MAESTRO: CUENTA PAGADA
      const handleCompleteTable = async (mesa) => {
         try {
            // A: Cambiamos estado de la mesa en la base de datos a pagada
            const { error: errMesa } = await supabase.from('sesiones_mesa').update({ estado: 'pagada' }).eq('id', mesa.id);
            if (errMesa) throw new Error("Fallo al actualizar la mesa: " + errMesa.message);
            
            // B: Limpiar historial visual del iPad y de notificaciones
            mesasNotificadas.current.delete(mesa.id);
            setMesas(mesas.filter(m => m.id !== mesa.id));
            
            // C: Disparamos la petición al cliente para que sepa que ha pagado
            // (El propio HTML del cliente ahora se encarga de repartirse los puntos)
            
         } catch (error) {
            alert("❌ ERROR AL COBRAR: " + error.message);
         }
      };

      // --- RENDERIZADO UI ---
      return (
         <div className="min-h-screen bg-gray-100 flex flex-col">
            <header className="bg-gray-900 text-white p-6 shadow-md flex justify-between items-center">
               <div className="flex items-center gap-4">
                  <h1 className="text-2xl font-black tracking-widest text-yellow-400">BOKALIA CAJA</h1>
                  <span className="bg-gray-800 px-3 py-1 rounded-lg text-xs font-bold uppercase border border-gray-700">iPad Camarero</span>
               </div>
               
               <div className="flex items-center gap-4">
                  {notifPerm !== 'granted' && (
                     <button onClick={pedirNotificaciones} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-sm transition-colors">
                        🔔 Activar Alertas
                     </button>
                  )}
                  
                  <div className="flex items-center gap-2 bg-gray-800 px-4 py-2 rounded-full border border-gray-700">
                     <span className={`w-3 h-3 rounded-full ${conexionDb === 'conectado' ? 'bg-green-500 shadow-[0_0_8px_#22c55e]' : 'bg-red-500 animate-pulse'}`}></span>
                     <span className="text-xs font-bold text-gray-300 uppercase tracking-widest">
                        {conexionDb === 'conectado' ? 'En línea' : 'Reconectando...'}
                     </span>
                  </div>
               </div>
            </header>

            <main className="p-6 flex-grow">
               <div className="flex items-center justify-between mb-8">
                  <h2 className="text-xl font-black text-gray-800">Mesas en Sala ({mesas.length})</h2>
                  <div className="flex gap-4">
                     <span className="flex items-center gap-2 text-sm font-bold text-gray-500"><div className="w-4 h-4 bg-white border-2 border-gray-300 rounded"></div> Activa</span>
                     <span className="flex items-center gap-2 text-sm font-bold text-amber-600"><div className="w-4 h-4 bg-amber-50 border-2 border-amber-500 rounded animate-blink"></div> Pidiendo Cuenta</span>
                  </div>
               </div>

               {mesas.length === 0 ? (
                  <div className="h-64 flex items-center justify-center bg-white rounded-3xl border-2 border-dashed border-gray-300 shadow-sm">
                     <p className="text-xl font-bold text-gray-400">Sala libre. No hay mesas abiertas.</p>
                  </div>
               ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                     {mesas.sort((a,b) => (a.estado === 'pagando' ? -1 : 1)).map(mesa => (
                        <div key={mesa.id} className={`bg-white rounded-3xl overflow-hidden shadow-lg border-4 transition-all duration-300 ${mesa.estado === 'pagando' ? 'animate-blink bg-amber-50' : 'border-transparent'}`}>
                           
                           <div className={`p-5 flex justify-between items-center ${mesa.estado === 'pagando' ? 'bg-amber-500 text-white' : 'bg-gray-100'}`}>
                              <h3 className="text-2xl font-black">Mesa {mesa.num_mesa}</h3>
                              <span className={`px-3 py-1 text-xs font-black uppercase rounded-lg tracking-widest ${mesa.estado === 'pagando' ? 'bg-red-600 text-white shadow-md' : 'bg-green-200 text-green-800'}`}>
                                 {mesa.estado === 'pagando' ? '🔥 PIDIENDO CUENTA' : 'Comiendo'}
                              </span>
                           </div>

                           <div className="p-5">
                              {Object.keys(mesa.desglose).length === 0 ? (
                                 <p className="text-gray-400 text-sm font-medium py-4 text-center">Aún no han pedido nada confirmado.</p>
                              ) : (
                                 <div className="space-y-4">
                                    {Object.values(mesa.desglose).map((user, idx) => (
                                       <div key={idx} className="bg-gray-50 p-4 rounded-2xl border border-gray-100 shadow-sm">
                                          <div className="flex justify-between items-center mb-2 border-b border-gray-200 pb-2">
                                             <p className="font-black text-gray-700 text-sm uppercase tracking-wider">{user.nombre}</p>
                                             <p className="font-black text-green-600">{Number(user.subtotal).toFixed(2)}€</p>
                                          </div>
                                          <ul className="space-y-1">
                                             {user.items.map((item, i) => (
                                                <li key={i} className="flex justify-between text-xs text-gray-600 font-medium">
                                                   <span><b className="text-red-500">{item.cantidad}x</b> {item.producto?.nombre}</span>
                                                </li>
                                             ))}
                                          </ul>
                                       </div>
                                    ))}
                                 </div>
                              )}
                           </div>

                           <div className="p-5 bg-gray-50 border-t border-gray-100">
                              <div className="flex justify-between items-end mb-4">
                                 <span className="text-gray-500 font-bold uppercase text-xs tracking-widest">Total a Cobrar</span>
                                 <span className="text-4xl font-black text-gray-900">{Number(mesa.totalConsolidado).toFixed(2)}€</span>
                              </div>
                              
                              <button 
                                 onClick={() => handleCompleteTable(mesa)}
                                 disabled={mesa.estado !== 'pagando'}
                                 className={`w-full py-4 rounded-2xl font-black text-lg transition-transform ${mesa.estado === 'pagando' ? 'bg-green-500 text-white shadow-lg active:scale-95 hover:bg-green-600' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                              >
                                 {mesa.estado === 'pagando' ? '✓ MARCAR COMO PAGADA' : 'Esperando solicitud...'}
                              </button>
                           </div>

                        </div>
                     ))}
                  </div>
               )}
            </main>
         </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CajaPanel />);
  </script>
</body>
</html>
