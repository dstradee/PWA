<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bokalia - Pide desde tu mesa</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: system-ui, sans-serif; background: #111827; margin: 0; -webkit-tap-highlight-color: transparent; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.3s ease forwards; }
    .mobile-container { transform: translate(0); }
  </style>
</head>
<body class="flex justify-center min-h-screen">
  
  <div id="root" class="w-full max-w-md bg-gray-50 min-h-screen relative overflow-x-hidden shadow-2xl mobile-container">
    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background-color:#fefce8; color:#dc2626;">
      <h1 style="font-size:3rem; font-weight:900; margin:0; letter-spacing:-2px;">BOKALIA</h1>
      <p style="font-weight:bold; margin-top:10px; opacity:0.7;">Conectando...</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const TIEMPO_LIMITE_MINUTOS = 120; // 2 Horas

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) return (
            <div className="p-8 flex flex-col items-center justify-center min-h-screen bg-red-50 text-center">
              <div className="text-6xl mb-4">🚨</div>
              <h1 className="text-2xl font-black text-red-600 mb-2">Error Crítico</h1>
              <p className="text-gray-700 text-sm mb-6">{this.state.error.toString()}</p>
              <button onClick={() => window.location.reload()} className="bg-red-600 text-white font-bold py-3 px-6 rounded-xl">Recargar App</button>
            </div>
        );
        return this.props.children;
      }
    }

    const supabase = window.supabase.createClient(
      'https://bswlriuzeintgjioywtz.supabase.co',
      'sb_publishable_oIWpn-mNPUZaQPdf7HNU_Q_Lc7R6UOB',
      { auth: { persistSession: true, storage: window.localStorage, autoRefreshToken: true } }
    );

    const MENU_EMERGENCIA = [
      { id: '11111111-1111-1111-1111-111111111111', nombre: 'Bokata Clásico', precio: 5.50, imagen_url: 'https://images.unsplash.com/photo-1619881589316-56c7f9e6b587?w=500', categoria: 'Bocadillos' },
      { id: '22222222-2222-2222-2222-222222222222', nombre: 'Burger Doble', precio: 8.90, imagen_url: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500', categoria: 'Hamburguesas' }
    ];

    function MainApp() {
      const [vistaActual, setVistaActual] = useState('mesa');
      const [mesaParam, setMesaParam] = useState(null);
      const [user, setUser] = useState(null);
      const [userProfile, setUserProfile] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      
      const [productos, setProductos] = useState([]);
      const [sesionActiva, setSesionActiva] = useState(null);
      const [mesaBloqueada, setMesaBloqueada] = useState(false);
      const [hostName, setHostName] = useState('');
      
      const [rondasBorrador, setRondasBorrador] = useState([]); 
      const [rondasEnviadas, setRondasEnviadas] = useState([]); 
      const [historial, setHistorial] = useState([]);
      
      const [ultimoPedido, setUltimoPedido] = useState(null);
      const [ultimaActividad, setUltimaActividad] = useState(Date.now());
      const [productoPendiente, setProductoPendiente] = useState(null);
      
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login'); 
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      
      const [showModoMesa, setShowModoMesa] = useState(false);
      const [showJoinPrompt, setShowJoinPrompt] = useState(false);
      const [showReviewModal, setShowReviewModal] = useState(false);
      const [showTimeoutModal, setShowTimeoutModal] = useState(false);
      
      const [showTicketModal, setShowTicketModal] = useState(false);
      const [datosTicket, setDatosTicket] = useState({ subtotal: 0, puntosGanados: 0, items: [] });
      
      const [notifPerm, setNotifPerm] = useState('default');
      const [toastMsg, setToastMsg] = useState('');

      const channelRef = useRef(null);

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const mesa = urlParams.get('mesa');
        if (mesa) setMesaParam(parseInt(mesa));
        if ('Notification' in window) setNotifPerm(Notification.permission);

        cargarMenu();

        supabase.auth.getSession().then(({ data }) => {
          if (data?.session?.user) procesarUsuario(data.session.user);
          else setAuthLoading(false);
        }).catch(() => setAuthLoading(false));

        const { data: authListener } = supabase.auth.onAuthStateChange((_, session) => {
          if(session?.user) procesarUsuario(session.user);
          else { setUser(null); setUserProfile(null); setUltimoPedido(null); setHistorial([]); setAuthLoading(false); }
        });

        return () => { if (authListener?.subscription) authListener.subscription.unsubscribe(); };
      }, []);

      useEffect(() => {
        if (!mesaParam || authLoading) return;
        verificarSesionMesa();

        const globalChannel = supabase.channel(`vigilante_mesa_${mesaParam}`)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'sesiones_mesa' }, (payload) => {
             if ((payload.new && payload.new.num_mesa === mesaParam) || (payload.old && payload.old.num_mesa === mesaParam)) {
                verificarSesionMesa();
             }
          }).subscribe();

        return () => supabase.removeChannel(globalChannel);
      }, [mesaParam, user, authLoading, sesionActiva]);

      useEffect(() => {
        if (sesionActiva) {
          cargarRondasMesa(sesionActiva.id);
          
          channelRef.current = supabase.channel(`db_sync_mesa_${sesionActiva.id}`)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos_rondas', filter: `sesion_id=eq.${sesionActiva.id}` }, () => {
               cargarRondasMesa(sesionActiva.id);
               setUltimaActividad(Date.now());
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'items_pedido' }, () => {
               cargarRondasMesa(sesionActiva.id);
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sesiones_mesa', filter: `id=eq.${sesionActiva.id}` }, (payload) => {
               if (payload.new.estado === 'pagada') {
                  cargarTicketFinal(sesionActiva.id);
               }
            })
            .subscribe();

          return () => { if (channelRef.current) supabase.removeChannel(channelRef.current); };
        }
      }, [sesionActiva, user]);

      useEffect(() => {
        if (!sesionActiva || sesionActiva.estado === 'pagada') return;
        const interval = setInterval(() => {
          const minutos = (Date.now() - ultimaActividad) / 60000;
          if (minutos >= TIEMPO_LIMITE_MINUTOS && !showTimeoutModal) {
             if (notifPerm === 'granted') new Notification('Bokalia 🍔', { body: '¿Sigues en la mesa?' });
             setShowTimeoutModal(true);
          }
        }, 60000);
        return () => clearInterval(interval);
      }, [sesionActiva, ultimaActividad, showTimeoutModal, notifPerm]);

      useEffect(() => {
        if (vistaActual === 'historial') cargarHistorial();
      }, [vistaActual, user]);

      const procesarUsuario = async (authUser) => {
        setUser(authUser);
        try {
          let { data } = await supabase.from('usuarios').select('*').eq('id', authUser.id).single();
          if (!data) {
            const { data: newUser } = await supabase.from('usuarios').insert([{ id: authUser.id, email: authUser.email, puntos: 50 }]).select().single();
            data = newUser || { puntos: 50, email: authUser.email }; 
          }
          setUserProfile(data);
          buscarUltimoPedido(authUser.id);
          cargarHistorial();
        } catch(e) { setUserProfile({ puntos: 0, email: authUser.email }); }
        setAuthLoading(false);
      };

      const pedirNotificaciones = async () => {
        if (!('Notification' in window)) {
          alert("🍏 Si estás en iPhone: Pulsa 'Compartir' (el cuadrado con la flecha) y dale a 'Añadir a la pantalla de inicio'.");
          return;
        }
        try {
          const permission = await Notification.requestPermission();
          setNotifPerm(permission);
          if (permission === 'granted' && user) mostrarToast("¡Avisos activados! 🔔");
          else if (permission === 'denied') alert("Avisos bloqueados. Actívalos en Ajustes.");
        } catch (error) { alert("Añade la web a inicio para recibir avisos."); }
      };

      const cargarMenu = async () => {
        const { data, error } = await supabase.from('productos').select('*').eq('activo', true);
        if (error || !data || data.length === 0) setProductos(MENU_EMERGENCIA);
        else setProductos(data);
      };

      const cargarHistorial = async () => {
        if (!user) return;
        const seisMesesAtras = new Date();
        seisMesesAtras.setMonth(seisMesesAtras.getMonth() - 6);

        const { data } = await supabase.from('pedidos_rondas')
          .select('id, fecha, estado, sesion:sesiones_mesa!inner(estado), items:items_pedido(cantidad, precio_unitario, producto:productos(nombre))')
          .eq('usuario_id', user.id).eq('oculto_usuario', false).eq('sesiones_mesa.estado', 'pagada')
          .gte('fecha', seisMesesAtras.toISOString()).order('fecha', { ascending: false });
          
        if (data) setHistorial(data.filter(h => h.items && h.items.length > 0));
      };

      const borrarHistorial = async () => {
        if (!user || historial.length === 0) return;
        if (window.confirm("¿Limpiar tu historial visual?")) {
           await supabase.from('pedidos_rondas').update({ oculto_usuario: true }).eq('usuario_id', user.id);
           setHistorial([]);
           mostrarToast("Historial ocultado 🧹");
        }
      };

      const buscarUltimoPedido = async (userId) => {
        const { data: ultimas } = await supabase.from('pedidos_rondas').select('id').eq('usuario_id', userId).neq('estado', 'pendiente').order('fecha', { ascending: false }).limit(1);
        if (ultimas && ultimas.length > 0) {
          const { data: items } = await supabase.from('items_pedido').select('producto_id, producto:productos(*)').eq('ronda_id', ultimas[0].id).limit(1);
          if (items && items.length > 0 && items[0].producto) setUltimoPedido(items[0].producto);
        }
      };

      const verificarSesionMesa = async () => {
        const { data } = await supabase.from('sesiones_mesa').select('*, host:usuarios(nombre, email)').eq('num_mesa', mesaParam).neq('estado', 'pagada').maybeSingle();
        if (data) {
          if (!user || data.host_id !== user?.id) {
            if (data.compartida === false) {
              setMesaBloqueada(true); 
              setShowJoinPrompt(false);
            } else {
              const yaAcepto = window.sessionStorage.getItem(`unido_mesa_${mesaParam}`);
              if (!yaAcepto) {
                setHostName(data.host?.nombre || data.host?.email?.split('@')[0] || 'Alguien');
                setShowJoinPrompt(true); 
                setMesaBloqueada(false);
              } else {
                setSesionActiva(data);
                setShowJoinPrompt(false);
                setMesaBloqueada(false);
              }
            }
          } else {
            setMesaBloqueada(false);
            setShowJoinPrompt(false);
            setSesionActiva(data);
          }
        } else {
          setSesionActiva(null);
          setMesaBloqueada(false);
          setShowJoinPrompt(false);
        }
      };

      const aceptarUnirse = () => {
         window.sessionStorage.setItem(`unido_mesa_${mesaParam}`, 'true');
         setShowJoinPrompt(false);
         verificarSesionMesa();
      };

      const cargarRondasMesa = async (idSesion) => {
        const { data, error } = await supabase.from('pedidos_rondas')
          .select('*, items:items_pedido(id, cantidad, precio_unitario, producto_id, producto:productos(nombre, precio)), usuario:usuarios(nombre, email)')
          .eq('sesion_id', idSesion).order('fecha', { ascending: true });
          
        if (data) {
           const borradores = data.filter(r => (r.estado === 'pendiente' || r.estado === 'listo') && r.items.length > 0);
           setRondasBorrador(borradores);
           
           const enviados = data.filter(r => r.estado === 'enviado' || r.estado === 'preparando' || r.estado === 'servido');
           setRondasEnviadas(enviados);
        }
      };

      // AUTH ROBUSTA: Si se loguea y tenía un producto pendiente, pregunta modo mesa o lo añade directo
      const handleAuth = async () => {
        setAuthLoading(true);
        const { error } = authMode === 'register' ? await supabase.auth.signUp({ email, password }) : await supabase.auth.signInWithPassword({ email, password });
        if (error) { 
           setAuthLoading(false); 
           alert("Error: " + error.message); 
        } else { 
           setShowAuthModal(false); 
           if (productoPendiente) {
              if (!sesionActiva) {
                 setShowModoMesa(true);
              } else {
                 ejecutarAñadirDB(sesionActiva.id, productoPendiente);
                 setProductoPendiente(null);
              }
           }
        }
      };

      // FLUJO AL PULSAR "AÑADIR"
      const intentarAñadirAlCarrito = (producto) => {
        if (!user) { 
           setProductoPendiente(producto);
           setAuthMode('register'); 
           return setShowAuthModal(true); 
        }
        if (!sesionActiva) {
           setProductoPendiente(producto);
           return setShowModoMesa(true);
        }
        ejecutarAñadirDB(sesionActiva.id, producto);
      };

      // FUNCIÓN IMPERATIVA: Añade a la DB y actualiza la pantalla en el mismo instante
      const ejecutarAñadirDB = async (idSesion, producto) => {
         try {
            let { data: ronda } = await supabase.from('pedidos_rondas')
               .select('id, estado').eq('sesion_id', idSesion).eq('usuario_id', user.id).in('estado', ['pendiente', 'listo']).maybeSingle();

            if (!ronda) {
               const { data: newRonda } = await supabase.from('pedidos_rondas')
                  .insert([{ sesion_id: idSesion, usuario_id: user.id, estado: 'pendiente' }]).select().single();
               ronda = newRonda;
            } else if (ronda.estado === 'listo') {
               await supabase.from('pedidos_rondas').update({ estado: 'pendiente' }).eq('id', ronda.id);
            }
            
            await supabase.from('items_pedido').insert([{
               ronda_id: ronda.id, producto_id: producto.id, cantidad: 1, precio_unitario: producto.precio
            }]);
            
            // FORZAMOS LA RECARGA INSTANTÁNEA
            cargarRondasMesa(idSesion);
            mostrarToast(`Añadido: ${producto.nombre} 🛒`);
         } catch(e) { console.error(e); }
      };

      const eliminarItemBorrador = async (itemId) => {
         await supabase.from('items_pedido').delete().eq('id', itemId);
         if (sesionActiva) cargarRondasMesa(sesionActiva.id); // Forzamos recarga
      };

      // CREAR MESA IMPERATIVA: Se crea la mesa y al instante procesa el plato pendiente
      const procesarCrearMesaYPedir = async (esCompartida) => {
        setShowModoMesa(false);
        try {
           const { data, error } = await supabase.from('sesiones_mesa')
               .insert([{ num_mesa: mesaParam, host_id: user.id, estado: 'activa', compartida: esCompartida }])
               .select().single();
               
           if (error) throw error;
           
           setSesionActiva(data);
           
           if (productoPendiente) {
              await ejecutarAñadirDB(data.id, productoPendiente);
              setProductoPendiente(null);
           }
        } catch(e) { alert("Error creando mesa: " + e.message); }
      };

      const enviarACocinaDB = async () => {
         if (!sesionActiva || !user) return;
         const miRonda = rondasBorrador.find(r => r.usuario_id === user.id);
         if (!miRonda) return;

         try {
            await supabase.from('pedidos_rondas').update({estado: 'listo'}).eq('id', miRonda.id);
            const { data: pendientes } = await supabase.from('pedidos_rondas')
               .select('id').eq('sesion_id', sesionActiva.id).eq('estado', 'pendiente');
               
            if (pendientes && pendientes.length > 0) {
               mostrarToast("¡Estás listo! Esperando a tus amigos... ⏳");
               cargarRondasMesa(sesionActiva.id);
            } else {
               await supabase.from('pedidos_rondas').update({estado: 'enviado', fecha: new Date().toISOString()})
                  .eq('sesion_id', sesionActiva.id).eq('estado', 'listo');
               mostrarToast("¡Ronda grupal enviada a cocina! 🚀");
               cargarRondasMesa(sesionActiva.id);
            }
         } catch(e) { console.error(e); }
      };

      // SOLO AVISA A CAJA Y ESPERA (Cero auto-cierre)
      const pedirCuenta = async () => {
        if (!sesionActiva) return;
        await supabase.from('sesiones_mesa').update({ estado: 'pagando' }).eq('id', sesionActiva.id);
        mostrarToast("El camarero trae la cuenta. ¡Avisado! 💸");
      };

      const cargarTicketFinal = async (idSesion) => {
         try {
            const { data: misRondas } = await supabase.from('pedidos_rondas').select('id').eq('sesion_id', idSesion).eq('usuario_id', user.id).in('estado', ['enviado', 'preparando', 'servido']);
            let totalGastado = 0;
            let misItems = [];
            
            if (misRondas && misRondas.length > 0) {
               const rondasIds = misRondas.map(r => r.id);
               const { data: items } = await supabase.from('items_pedido').select('cantidad, precio_unitario, producto:productos(nombre)').in('ronda_id', rondasIds);
               if (items) {
                  misItems = items;
                  items.forEach(i => totalGastado += (i.precio_unitario * i.cantidad));
               }
            }
            
            const puntosGanados = Math.floor(totalGastado * 20);
            if (puntosGanados > 0 && user) {
               await supabase.from('usuarios').update({ puntos: (userProfile?.puntos || 0) + puntosGanados }).eq('id', user.id);
               const { data: userData } = await supabase.auth.getUser();
               if (userData?.user) procesarUsuario(userData.user);
            }

            setDatosTicket({ subtotal: totalGastado, puntosGanados: puntosGanados, items: misItems });
            setShowTicketModal(true);
         } catch (e) {
            console.error(e);
            setShowReviewModal(true); 
         }
      };

      const finalizarYSalir = () => {
         setShowReviewModal(false);
         window.location.href = window.location.pathname; 
      };

      const formatMoney = (num) => Number(num).toFixed(2);
      const formatDate = (dateStr) => {
        const d = new Date(dateStr);
        return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} a las ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
      };

      const mostrarToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 4000); };

      // ==========================================
      // UI Y VISTAS
      // ==========================================

      if (authLoading) return (
        <div className="h-screen flex items-center justify-center bg-yellow-50 flex-col">
           <div className="w-16 h-16 border-8 border-red-200 border-t-red-600 rounded-full animate-spin mb-6"></div>
           <h2 className="text-2xl font-black text-red-600 tracking-tighter animate-pulse">Cargando Bokalia...</h2>
        </div>
      );

      if (mesaBloqueada) {
        return (
          <div className="min-h-screen bg-gray-900 flex flex-col justify-center items-center p-8 text-center text-white animate-fade-in z-50 absolute w-full h-full">
            <div className="text-8xl mb-8">🔒</div>
            <h1 className="text-4xl font-black mb-4">Mesa Cerrada</h1>
            <p className="text-gray-300 font-medium text-lg leading-relaxed mb-12">El host de esta mesa ha seleccionado <b className="text-yellow-400">Cuenta Única</b>. No se admiten más móviles conectados a esta mesa.</p>
            <button onClick={() => window.location.href = window.location.pathname} className="w-full bg-red-600 active:bg-red-700 text-white font-black py-5 rounded-2xl shadow-xl text-xl">Cambiar de mesa</button>
          </div>
        );
      }

      if (!mesaParam) return (
        <div className="min-h-screen bg-yellow-50 flex flex-col justify-center items-center p-6 text-center">
          <div className="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full">
            <h1 className="text-5xl font-black text-red-600 mb-2 tracking-tighter">BOKALIA</h1>
            <p className="text-gray-500 mb-8 font-bold text-lg">¿En qué mesa te sientas?</p>
            <input type="number" id="inputMesa" className="text-center text-6xl font-black w-full p-4 rounded-[2rem] bg-gray-50 border-4 border-gray-200 mb-6 outline-none focus:border-red-500 transition-colors" placeholder="0" />
            <button onClick={() => {
                const num = document.getElementById('inputMesa').value;
                if(num) window.location.search = `?mesa=${num}`;
              }} className="w-full bg-red-600 active:bg-red-700 text-white font-black py-5 rounded-[2rem] text-2xl shadow-xl">
              Empezar
            </button>
          </div>
        </div>
      );

      const miRondaBorrador = rondasBorrador.find(r => r.usuario_id === user?.id);
      const totalItemsMesaPendiente = rondasBorrador.reduce((acc, r) => acc + r.items.length, 0);
      const totalMesaEnviada = rondasEnviadas.reduce((acc, r) => acc + r.items.reduce((sum, item) => sum + (item.cantidad * item.precio_unitario), 0), 0);

      return (
        <div className="pb-36 bg-gray-50 min-h-screen relative flex flex-col">
          
          {toastMsg && (
            <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-[60] animate-fade-in w-11/12 max-w-sm">
              <div className="bg-green-500 text-white font-black px-6 py-4 rounded-2xl shadow-xl flex items-center justify-between">
                <span>{toastMsg}</span>
              </div>
            </div>
          )}

          {showJoinPrompt && (
            <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[100] flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-[2.5rem] p-8 w-full max-w-md text-center shadow-2xl animate-slide-up">
                <div className="text-6xl mb-4">👋</div>
                <h3 className="text-3xl font-black text-gray-800 mb-2">Mesa de {hostName}</h3>

                    <button key={star} onClick={() => { window.open('https://maps.google.com', '_blank'); finalizarYSalir(); }} className="text-5xl text-yellow-400 active:scale-75 transition-transform">★</button>
                  ))}
                </div>
                <button onClick={finalizarYSalir} className="text-sm font-bold text-gray-400 uppercase tracking-widest">Saltar y Salir</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><MainApp /></ErrorBoundary>);
  </script>
</body>
</html>
