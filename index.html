<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bokalia - Pide desde tu mesa</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- LIBRERÍAS DESDE CLOUDFLARE (Más seguras contra bloqueos) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- SISTEMA ANTI PANTALLA BLANCA -->
  <script>
    window.addEventListener('error', function(event) {
      document.getElementById('root').innerHTML = `
        <div style="background-color:#fee2e2; color:#991b1b; padding:2rem; min-height:100vh; font-family:sans-serif;">
          <h1 style="font-size:2rem; font-weight:bold; margin-bottom:1rem;">⚠️ Error de Sistema</h1>
          <p><strong>Mensaje:</strong> ${event.message}</p>
          <p><strong>Archivo:</strong> ${event.filename}</p>
          <p><strong>Línea:</strong> ${event.lineno}</p>
          <p style="margin-top:2rem; font-size:0.9rem;">Haz una captura de esta pantalla y envíasela al programador.</p>
        </div>
      `;
    });
  </script>

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f9fafb; margin: 0; }
  </style>
</head>
<body>
  <!-- Si React falla, se quedará este mensaje visible -->
  <div id="root">
    <div style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; background-color:#fefce8; color:#dc2626;">
      <h2 style="font-size:2rem; font-weight:900;">BOKALIA</h2>
      <p style="margin-top:10px;">Iniciando sistema...</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Conexión a Supabase con tus credenciales
    const supabase = window.supabase.createClient(
      'https://bswlriuzeintgjioywtz.supabase.co',
      'sb_publishable_oIWpn-mNPUZaQPdf7HNU_Q_Lc7R6UOB'
    );

    function App() {
      const [user, setUser] = useState(null);
      const [mesaParam, setMesaParam] = useState(null);
      const [loading, setLoading] = useState(true);
      
      // Estado de la App
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [productos, setProductos] = useState([]);
      const [sesion, setSesion] = useState(null);
      const [carrito, setCarrito] = useState([]);
      const [rondas, setRondas] = useState([]);

      useEffect(() => {
        // Inicializar
        const urlParams = new URLSearchParams(window.location.search);
        const mesa = urlParams.get('mesa');
        if (mesa) setMesaParam(parseInt(mesa));

        supabase.auth.getSession().then(({ data }) => {
          setUser(data?.session?.user || null);
          setLoading(false);
        });

        const { data: authListener } = supabase.auth.onAuthStateChange((_, session) => {
          setUser(session?.user || null);
        });

        cargarProductos();

        return () => {
          if (authListener?.subscription) authListener.subscription.unsubscribe();
        };
      }, []);

      useEffect(() => {
        if (mesaParam && user) {
          verificarSesion();
        }
      }, [mesaParam, user]);

      useEffect(() => {
        if (sesion) {
          cargarRondas();
          // Realtime simplificado
          const channel = supabase.channel('mesa_channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos_rondas' }, () => {
              cargarRondas();
            })
            .subscribe();
          return () => supabase.removeChannel(channel);
        }
      }, [sesion]);

      const cargarProductos = async () => {
        const { data } = await supabase.from('productos').select('*');
        if (data) setProductos(data);
      };

      const verificarSesion = async () => {
        const { data } = await supabase
          .from('sesiones_mesa')
          .select('*')
          .eq('num_mesa', mesaParam)
          .eq('estado', 'activa')
          .limit(1)
          .single();
        if (data) setSesion(data);
      };

      const abrirMesa = async () => {
        const { data, error } = await supabase
          .from('sesiones_mesa')
          .insert([{ num_mesa: mesaParam, host_id: user.id, estado: 'activa' }])
          .select().single();
        
        if (error) alert("Error al abrir mesa. ¿Están desactivadas las políticas RLS en Supabase?");
        if (data) setSesion(data);
      };

      const cargarRondas = async () => {
        const { data } = await supabase
          .from('pedidos_rondas')
          .select('*, items:items_pedido(*, producto:productos(nombre))')
          .eq('sesion_id', sesion.id);
        if (data) setRondas(data);
      };

      const handleLogin = async (isRegister) => {
        const { error } = isRegister
          ? await supabase.auth.signUp({ email, password })
          : await supabase.auth.signInWithPassword({ email, password });
        if (error) alert(error.message);
      };

      const enviarPedido = async () => {
        if (carrito.length === 0) return;
        
        const { data: ronda } = await supabase
          .from('pedidos_rondas')
          .insert([{ sesion_id: sesion.id, usuario_id: user.id }])
          .select().single();

        if (ronda) {
          // Agrupar items duplicados
          const conteo = {};
          carrito.forEach(p => { conteo[p.id] = (conteo[p.id] || 0) + 1; });
          
          const itemsInsert = Object.keys(conteo).map(id => ({
            ronda_id: ronda.id,
            producto_id: id,
            cantidad: conteo[id],
            precio_unitario: carrito.find(p => p.id === id).precio
          }));

          await supabase.from('items_pedido').insert(itemsInsert);
          setCarrito([]);
          cargarRondas();
        }
      };

      // --- RENDERIZADO --- //

      if (loading) return <div className="p-10 text-center text-red-600 font-bold">Cargando...</div>;

      if (!user) return (
        <div className="min-h-screen bg-yellow-50 flex flex-col justify-center items-center p-4">
          <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm border-2 border-red-100">
            <h1 className="text-4xl font-black text-red-600 mb-6 text-center">BOKALIA</h1>
            <input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full mb-3 p-3 bg-gray-100 rounded-xl" />
            <input type="password" placeholder="Contraseña" value={password} onChange={e => setPassword(e.target.value)} className="w-full mb-6 p-3 bg-gray-100 rounded-xl" />
            <button onClick={() => handleLogin(false)} className="w-full bg-orange-500 text-white font-bold py-3 rounded-xl mb-3">Entrar</button>
            <button onClick={() => handleLogin(true)} className="w-full bg-yellow-400 text-red-900 font-bold py-3 rounded-xl">Registrarse</button>
          </div>
        </div>
      );

      if (!mesaParam) return (
        <div className="min-h-screen bg-yellow-50 flex flex-col justify-center items-center p-4 text-center">
          <h1 className="text-3xl font-black text-red-600 mb-4">¡Bienvenido!</h1>
          <p className="mb-6 text-gray-600">Introduce el número de tu mesa:</p>
          <input type="number" id="inputMesa" className="text-center text-4xl w-32 p-4 rounded-2xl border-4 border-red-200 mb-6" placeholder="0" />
          <button onClick={() => window.location.search = `?mesa=${document.getElementById('inputMesa').value}`} className="bg-red-600 text-white font-black py-4 px-8 rounded-full text-xl shadow-lg">Entrar a la mesa</button>
        </div>
      );

      if (!sesion) return (
        <div className="min-h-screen bg-gray-50 flex flex-col justify-center items-center p-4 text-center">
          <div className="text-6xl font-black text-red-600 mb-4">{mesaParam}</div>
          <h2 className="text-2xl font-bold mb-6">Mesa Libre</h2>
          <button onClick={abrirMesa} className="bg-red-600 text-white font-black py-4 px-8 rounded-full shadow-lg">Abrir Mesa y Pedir</button>
        </div>
      );

      return (
        <div className="pb-32 bg-gray-50 min-h-screen">
          <header className="bg-red-600 text-white p-4 sticky top-0 z-10 shadow-md flex justify-between items-center">
            <h1 className="font-black text-xl text-yellow-400">BOKALIA</h1>
            <span className="font-bold bg-red-700 px-3 py-1 rounded-lg">Mesa {mesaParam}</span>
          </header>

          <div className="p-4 max-w-2xl mx-auto">
            <h2 className="text-2xl font-black text-gray-800 mb-4">La Carta</h2>
            <div className="grid grid-cols-2 gap-4 mb-8">
              {productos.map(p => (
                <div key={p.id} className="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col">
                  <div className="h-28 bg-gray-200"><img src={p.imagen_url} className="w-full h-full object-cover" /></div>
                  <div className="p-3 flex flex-col flex-grow">
                    <h3 className="font-bold text-gray-800 text-sm">{p.nombre}</h3>
                    <p className="text-orange-500 font-black mt-1 mb-3">{p.precio}€</p>
                    <button onClick={() => setCarrito([...carrito, { ...p, uuid: Math.random() }])} className="mt-auto w-full bg-red-50 text-red-600 font-bold py-2 rounded-xl text-sm">Añadir</button>
                  </div>
                </div>
              ))}
            </div>

            {rondas.length > 0 && (
              <div className="mb-8">
                <h2 className="text-xl font-black text-gray-800 mb-4">Pedidos de la Mesa</h2>
                {rondas.map((ronda, i) => (
                  <div key={ronda.id} className="bg-white p-4 rounded-xl shadow-sm border border-orange-100 mb-3">
                    <p className="font-bold text-orange-600 border-b border-orange-100 pb-2 mb-2">Ronda #{i+1} - {ronda.estado}</p>
                    <ul className="text-sm">
                      {ronda.items?.map(item => (
                        <li key={item.id} className="py-1"><b>{item.cantidad}x</b> {item.producto?.nombre}</li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>
            )}
          </div>

          {carrito.length > 0 && (
            <div className="fixed bottom-0 left-0 w-full bg-white p-4 shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.15)] border-t border-gray-100">
              <div className="flex justify-between items-center max-w-2xl mx-auto">
                <div>
                  <p className="text-xs font-bold text-gray-500">MI PEDIDO</p>
                  <p className="text-xl font-black">{carrito.length} productos</p>
                </div>
                <button onClick={enviarPedido} className="bg-green-500 text-white font-black py-4 px-6 rounded-2xl shadow-lg text-lg">
                  Enviar a Cocina
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
