<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bokalia - Pide desde tu mesa</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: system-ui, sans-serif; background: #111827; margin: 0; -webkit-tap-highlight-color: transparent; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.3s ease forwards; }
    .mobile-container { transform: translate(0); }
  </style>
</head>
<body class="flex justify-center min-h-screen">
  
  <div id="root" class="w-full max-w-md bg-gray-50 min-h-screen relative overflow-x-hidden shadow-2xl mobile-container">
    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background-color:#fefce8; color:#dc2626; font-family:sans-serif;">
      <h1 style="font-size:3rem; font-weight:900; margin:0; letter-spacing:-2px;">BOKALIA</h1>
      <p style="font-weight:bold; margin-top:10px; opacity:0.7;">Conectando...</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const TIEMPO_LIMITE_MINUTOS = 120; // 2 Horas

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) return (
            <div className="p-8 flex flex-col items-center justify-center min-h-screen bg-red-50 text-center">
              <div className="text-6xl mb-4">🚨</div>
              <h1 className="text-2xl font-black text-red-600 mb-2">Error Crítico</h1>
              <p className="text-gray-700 text-sm mb-6">{this.state.error.toString()}</p>
              <button onClick={() => window.location.reload()} className="bg-red-600 text-white font-bold py-3 px-6 rounded-xl">Recargar App</button>
            </div>
        );
        return this.props.children;
      }
    }

    const supabase = window.supabase.createClient(
      'https://bswlriuzeintgjioywtz.supabase.co',
      'sb_publishable_oIWpn-mNPUZaQPdf7HNU_Q_Lc7R6UOB',
      { auth: { persistSession: true, storage: window.localStorage, autoRefreshToken: true } }
    );

    const MENU_EMERGENCIA = [
      { id: '11111111-1111-1111-1111-111111111111', nombre: 'Bokata Clásico', precio: 5.50, imagen_url: 'https://images.unsplash.com/photo-1619881589316-56c7f9e6b587?w=500', categoria: 'Bocadillos' },
      { id: '22222222-2222-2222-2222-222222222222', nombre: 'Burger Doble', precio: 8.90, imagen_url: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500', categoria: 'Hamburguesas' }
    ];

    function MainApp() {
      const [vistaActual, setVistaActual] = useState('mesa');
      const [mesaParam, setMesaParam] = useState(null);
      const [user, setUser] = useState(null);
      const [userProfile, setUserProfile] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      
      const [productos, setProductos] = useState([]);
      const [sesionActiva, setSesionActiva] = useState(null);
      const [mesaBloqueada, setMesaBloqueada] = useState(false);
      const [hostName, setHostName] = useState('');
      
      const [rondas, setRondas] = useState([]);
      const [historial, setHistorial] = useState([]);
      const [carrito, setCarrito] = useState([]);
      const [ultimoPedido, setUltimoPedido] = useState(null);
      const [ultimaActividad, setUltimaActividad] = useState(Date.now());
      
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login'); 
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      
      const [showModoMesa, setShowModoMesa] = useState(false);
      const [showJoinPrompt, setShowJoinPrompt] = useState(false);
      const [showReviewModal, setShowReviewModal] = useState(false);
      const [showTimeoutModal, setShowTimeoutModal] = useState(false);
      
      const [notifPerm, setNotifPerm] = useState('default');
      const [toastMsg, setToastMsg] = useState('');
      const [broadcastMsg, setBroadcastMsg] = useState('');

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const mesa = urlParams.get('mesa');
        if (mesa) setMesaParam(parseInt(mesa));
        if ('Notification' in window) setNotifPerm(Notification.permission);

        cargarMenu();

        supabase.auth.getSession().then(({ data }) => {
          if (data?.session?.user) procesarUsuario(data.session.user);
          else setAuthLoading(false);
        }).catch(() => setAuthLoading(false));

        const { data: authListener } = supabase.auth.onAuthStateChange((_, session) => {
          if(session?.user) procesarUsuario(session.user);
          else { setUser(null); setUserProfile(null); setUltimoPedido(null); setHistorial([]); setAuthLoading(false); }
        });

        return () => { if (authListener?.subscription) authListener.subscription.unsubscribe(); };
      }, []);

      useEffect(() => {
        if (!mesaParam || authLoading) return;
        verificarSesionMesa();

        const globalChannel = supabase.channel(`vigilante_mesa_${mesaParam}`)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'sesiones_mesa' }, (payload) => {
             if ((payload.new && payload.new.num_mesa === mesaParam) || (payload.old && payload.old.num_mesa === mesaParam)) {
                verificarSesionMesa();
             }
          }).subscribe();

        return () => supabase.removeChannel(globalChannel);
      }, [mesaParam, user, authLoading]);

      useEffect(() => {
        if (sesionActiva) {
          cargarRondasMesa(sesionActiva.id);
          const channel = supabase.channel(`mesa_sync_${sesionActiva.id}`)
            .on('broadcast', { event: 'add_to_cart' }, (payload) => {
               if (user && payload.payload.userId === user.id) return; 
               mostrarBroadcast(`👀 ${payload.payload.userName} va a pedir: ${payload.payload.productName}`);
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos_rondas', filter: `sesion_id=eq.${sesionActiva.id}` }, () => {
              cargarRondasMesa(sesionActiva.id);
              setUltimaActividad(Date.now());
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sesiones_mesa', filter: `id=eq.${sesionActiva.id}` }, (payload) => {
              if (payload.new.estado === 'pagada') setTimeout(() => setShowReviewModal(true), 2000);
            }).subscribe();
          return () => supabase.removeChannel(channel);
        }
      }, [sesionActiva, user]);

      useEffect(() => {
        if (vistaActual === 'historial') cargarHistorial();
      }, [vistaActual, user]);

      const procesarUsuario = async (authUser) => {
        setUser(authUser);
        try {
          let { data } = await supabase.from('usuarios').select('*').eq('id', authUser.id).single();
          if (!data) {
            const { data: newUser } = await supabase.from('usuarios').insert([{ id: authUser.id, email: authUser.email, puntos: 50 }]).select().single();
            data = newUser || { puntos: 50, email: authUser.email, acepta_notificaciones: false }; 
          }
          setUserProfile(data);
          buscarUltimoPedido(authUser.id);
          cargarHistorial();
        } catch(e) { setUserProfile({ puntos: 0, email: authUser.email, acepta_notificaciones: false }); }
        setAuthLoading(false);
      };

      // 🍏 GESTIÓN DE NOTIFICACIONES INTELIGENTE PARA iPHONE
      const pedirNotificaciones = async () => {
        if (!('Notification' in window)) {
          alert("🍏 APPLE LO BLOQUEA: Para usar notificaciones en iPhone, pulsa el botón 'Compartir' (el cuadrado con la flecha arriba) y dale a 'Añadir a la pantalla de inicio'. Entra desde ahí y funcionará.");
          return;
        }
        try {
          const permission = await Notification.requestPermission();
          setNotifPerm(permission);
          
          if (permission === 'granted' && user) {
            await supabase.from('usuarios').update({ acepta_notificaciones: true }).eq('id', user.id);
            mostrarToast("¡Avisos activados! 🔔");
          } else if (permission === 'denied') {
            alert("Has bloqueado las notificaciones. Para activarlas, ve a los Ajustes de tu móvil > Notificaciones.");
          }
        } catch (error) {
          alert("Añade esta web a tu pantalla de inicio como una App para poder recibir notificaciones.");
        }
      };

      const cargarMenu = async () => {
        const { data, error } = await supabase.from('productos').select('*').eq('activo', true);
        if (error || !data || data.length === 0) setProductos(MENU_EMERGENCIA);
        else setProductos(data);
      };

      const cargarHistorial = async () => {
        if (!user) return;
        const { data } = await supabase.from('pedidos_rondas')
          .select('id, fecha, items:items_pedido(cantidad, precio_unitario, producto:productos(nombre))')
          .eq('usuario_id', user.id).eq('oculto_usuario', false).order('fecha', { ascending: false });
        if (data) setHistorial(data);
      };

      const borrarHistorial = async () => {
        if (!user || historial.length === 0) return;
        if (window.confirm("¿Seguro que quieres borrar tu historial visual?")) {
           const { error } = await supabase.from('pedidos_rondas').update({ oculto_usuario: true }).eq('usuario_id', user.id);
           if (!error) {
             setHistorial([]);
             mostrarToast("Historial limpiado 🧹");
           }
        }
      };

      const buscarUltimoPedido = async (userId) => {
        const { data: ultimas } = await supabase.from('pedidos_rondas').select('id').eq('usuario_id', userId).order('fecha', { ascending: false }).limit(1);
        if (ultimas && ultimas.length > 0) {
          const { data: items } = await supabase.from('items_pedido').select('producto_id, producto:productos(*)').eq('ronda_id', ultimas[0].id).limit(1);
          if (items && items.length > 0 && items[0].producto) setUltimoPedido(items[0].producto);
        }
      };

      const verificarSesionMesa = async () => {
        const { data } = await supabase.from('sesiones_mesa').select('*, host:usuarios(nombre, email)').eq('num_mesa', mesaParam).neq('estado', 'pagada').maybeSingle();
        if (data) {
          if (!user || data.host_id !== user?.id) {
            if (data.compartida === false) {
              setMesaBloqueada(true); 
              setShowJoinPrompt(false);
            } else {
              setHostName(data.host?.nombre || data.host?.email?.split('@')[0] || 'Alguien');
              setShowJoinPrompt(true); 
              setMesaBloqueada(false);
            }
          } else {
            setMesaBloqueada(false);
            setShowJoinPrompt(false);
          }
          setSesionActiva(data);
        } else {
          setSesionActiva(null);
          setMesaBloqueada(false);
          setShowJoinPrompt(false);
        }
      };

      const cargarRondasMesa = async (idSesion) => {
        const { data } = await supabase.from('pedidos_rondas').select('*, items:items_pedido(id, cantidad, precio_unitario, producto_id, producto:productos(nombre, precio))').eq('sesion_id', idSesion);
        if (data) setRondas(data);
      };

      const handleAuth = async () => {
        setAuthLoading(true);
        const { error } = authMode === 'register' ? await supabase.auth.signUp({ email, password }) : await supabase.auth.signInWithPassword({ email, password });
        if (error) { setAuthLoading(false); alert("Error: " + error.message); }
        else setShowAuthModal(false);
      };

      const añadirAlCarrito = (producto) => {
        if (!user) { setAuthMode('register'); return setShowAuthModal(true); }
        setCarrito([...carrito, { ...producto, idUnico: Math.random() }]);
        
        if (sesionActiva) {
           supabase.channel(`mesa_sync_${sesionActiva.id}`).send({
              type: 'broadcast', event: 'add_to_cart',
              payload: { userId: user.id, userName: userProfile?.nombre || userProfile?.email?.split('@')[0] || 'Un amigo', productName: producto.nombre }
           });
        }
      };

      // 🍔 AQUÍ EVALUAMOS SI PREGUNTA LO DE LA MESA (SOLO CUANDO NO HAY SESIÓN)
      const intentarEnviarPedido = () => {
        if (!user) {
           setAuthMode('register'); 
           setShowAuthModal(true);
           return;
        }
        
        // Si NO hay sesión activa, preguntamos. Si YA hay, pedimos directo.
        if (!sesionActiva) {
           setShowModoMesa(true);
        } else {
           procesarEnvio(sesionActiva.compartida);
        }
      };

      const procesarEnvio = async (esCompartida) => {
        try {
          setShowModoMesa(false);
          let idDeSesion = sesionActiva?.id;

          if (!idDeSesion) {
            const { data } = await supabase.from('sesiones_mesa').insert([{ num_mesa: mesaParam, host_id: user.id, estado: 'activa', compartida: esCompartida }]).select().single();
            idDeSesion = data.id;
            setSesionActiva(data);
          }

          const { data: ronda } = await supabase.from('pedidos_rondas').insert([{ sesion_id: idDeSesion, usuario_id: user.id }]).select().single();

          if (ronda) {
            const conteo = {};
            carrito.forEach(p => { conteo[p.id] = (conteo[p.id] || 0) + 1; });
            const itemsInsert = Object.keys(conteo).map(id => ({
              ronda_id: ronda.id, producto_id: id, cantidad: conteo[id], precio_unitario: carrito.find(p => p.id === id).precio
            }));
            await supabase.from('items_pedido').insert(itemsInsert);
            
            setCarrito([]);
            setUltimaActividad(Date.now());
            cargarRondasMesa(idDeSesion);
            mostrarToast("¡Orden enviada a cocina! 🚀");
          }
        } catch (error) { console.error(error); }
      };

      const pedirCuenta = async () => {
        if (!sesionActiva) return;
        await supabase.from('sesiones_mesa').update({ estado: 'pagando' }).eq('id', sesionActiva.id);
        mostrarToast("Cuenta solicitada. ¡Tus puntos se sumarán al cerrar!");
        setTimeout(async () => {
          await supabase.from('sesiones_mesa').update({ estado: 'pagada' }).eq('id', sesionActiva.id);
          const { data: rondasUsuario } = await supabase.from('pedidos_rondas').select('id').eq('sesion_id', sesionActiva.id).eq('usuario_id', user.id);
          if (rondasUsuario && rondasUsuario.length > 0) {
             const rondasIds = rondasUsuario.map(r => r.id);
             const { data: items } = await supabase.from('items_pedido').select('cantidad, precio_unitario').in('ronda_id', rondasIds);
             let totalGastado = 0;
             if (items) items.forEach(item => totalGastado += (item.precio_unitario * item.cantidad));
             const puntos = Math.floor(totalGastado * 20);
             if (puntos > 0) {
                await supabase.from('usuarios').update({ puntos: (userProfile?.puntos || 0) + puntos }).eq('id', user.id);
                procesarUsuario(user); 
             }
          }
        }, 5000); 
      };

      const formatMoney = (num) => Number(num).toFixed(2);
      const formatDate = (dateStr) => {
        const d = new Date(dateStr);
        return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} a las ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
      };

      const mostrarToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 4000); };
      const mostrarBroadcast = (msg) => { setBroadcastMsg(msg); setTimeout(() => setBroadcastMsg(''), 5000); };

      // ==========================================
      // UI Y VISTAS
      // ==========================================

      if (authLoading) return (
        <div className="h-screen flex items-center justify-center bg-yellow-50 flex-col">
           <div className="w-16 h-16 border-8 border-red-200 border-t-red-600 rounded-full animate-spin mb-6"></div>
           <h2 className="text-2xl font-black text-red-600 tracking-tighter animate-pulse">Cargando Bokalia...</h2>
        </div>
      );

      if (mesaBloqueada) {
        return (
          <div className="min-h-screen bg-gray-900 flex flex-col justify-center items-center p-8 text-center text-white">
            <div className="text-8xl mb-8">🔒</div>
            <h1 className="text-4xl font-black mb-4">Mesa Ocupada</h1>
            <p className="text-gray-300 font-medium text-lg leading-relaxed mb-12">Alguien ya está pidiendo en esta mesa con modo <b className="text-yellow-400">Cuenta Única</b>.</p>
            <button onClick={() => window.location.search=''} className="w-full bg-red-600 active:bg-red-700 text-white font-black py-5 rounded-2xl shadow-xl text-xl">Cambiar de mesa</button>
          </div>
        );
      }

      if (!mesaParam) return (
        <div className="min-h-screen bg-yellow-50 flex flex-col justify-center items-center p-6 text-center">
          <div className="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full">
            <h1 className="text-5xl font-black text-red-600 mb-2 tracking-tighter">BOKALIA</h1>
            <p className="text-gray-500 mb-8 font-bold text-lg">¿En qué mesa te sientas?</p>
            <input type="number" id="inputMesa" className="text-center text-6xl font-black w-full p-4 rounded-[2rem] bg-gray-50 border-4 border-gray-200 mb-6 outline-none focus:border-red-500" placeholder="0" />
            <button onClick={() => {
                const num = document.getElementById('inputMesa').value;
                if(num) window.location.search = `?mesa=${num}`;
              }} className="w-full bg-red-600 active:bg-red-700 text-white font-black py-5 rounded-[2rem] text-2xl shadow-xl">
              Empezar
            </button>
          </div>
        </div>
      );

      return (
        <div className="pb-36 bg-gray-50 min-h-screen relative flex flex-col">
          
          {toastMsg && (
            <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-[60] animate-fade-in w-11/12 max-w-sm">
              <div className="bg-green-500 text-white font-black px-6 py-4 rounded-2xl shadow-xl flex items-center justify-between">
                <span>{toastMsg}</span>
              </div>
            </div>
          )}

          {broadcastMsg && (
            <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-[60] animate-fade-in w-11/12 max-w-sm">
              <div className="bg-white border-2 border-orange-400 text-orange-900 font-bold px-5 py-4 rounded-2xl shadow-2xl flex items-center gap-3">
                <span className="animate-bounce">🛒</span>
                <span className="text-sm leading-tight">{broadcastMsg}</span>
              </div>
            </div>
          )}

          {showJoinPrompt && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-[2.5rem] p-8 w-full max-w-md text-center shadow-2xl">
                <div className="text-6xl mb-4">👋</div>
                <h3 className="text-3xl font-black text-gray-800 mb-2">Mesa de {hostName}</h3>
                <p className="text-gray-500 font-medium text-lg mb-8">Esta mesa ya está abierta. ¿Sois del mismo grupo?</p>
                <button onClick={() => setShowJoinPrompt(false)} className="w-full bg-yellow-400 text-yellow-900 font-black py-5 rounded-2xl shadow-lg text-xl mb-4 active:scale-95 transition-transform">Sí, unirme a la mesa</button>
                <button onClick={() => window.location.search=''} className="w-full bg-gray-100 text-gray-600 font-black py-4 rounded-2xl">No, me he equivocado</button>
              </div>
            </div>
          )}

          {/* CABECERA */}
          <header className="bg-red-600 text-white p-4 sticky top-0 z-30 shadow-md">
            <div className="flex justify-between items-center">
              <h1 className="font-black text-2xl text-yellow-400 tracking-tighter">BOKALIA</h1>
              {user ? (
                 <button onClick={async () => await supabase.auth.signOut()} className="text-xs font-bold bg-red-800 px-3 py-2 rounded-xl">Cerrar Sesión</button> 
              ) : (
                 <button onClick={() => { setAuthMode('login'); setShowAuthModal(true); }} className="text-sm font-black bg-yellow-400 text-red-900 px-5 py-2 rounded-xl shadow-sm">Entrar</button>
              )}
            </div>
            {/* TABS HEADER */}
            <div className="flex gap-3 border-t border-red-500 pt-3 mt-3 overflow-x-auto">
              <button onClick={() => setVistaActual('mesa')} className={`font-bold pb-2 border-b-2 whitespace-nowrap px-1 ${vistaActual==='mesa' ? 'border-white text-white' : 'border-transparent text-red-200'}`}>Mesa {mesaParam}</button>
              <button onClick={() => setVistaActual('historial')} className={`font-bold pb-2 border-b-2 whitespace-nowrap px-1 ${vistaActual==='historial' ? 'border-white text-white' : 'border-transparent text-red-200'}`}>Historial</button>
              <button onClick={() => setVistaActual('reservas')} className={`font-bold pb-2 border-b-2 whitespace-nowrap px-1 ${vistaActual==='reservas' ? 'border-white text-white' : 'border-transparent text-red-200'}`}>Reservas</button>
            </div>
          </header>

          {/* BANNERS */}
          {!user && (
             <div onClick={() => { setAuthMode('register'); setShowAuthModal(true); }} className="bg-gradient-to-r from-orange-500 to-red-500 text-white p-4 flex justify-between items-center cursor-pointer shadow-sm">
                <div>
                   <p className="text-sm font-black mb-1">🎁 ¡Comida Gratis!</p>
                   <p className="text-xs font-medium opacity-90">Crea tu cuenta ahora y suma puntos.</p>
                </div>
                <button className="bg-white text-red-600 text-xs font-black px-4 py-2 rounded-xl shadow-sm">Regístrate</button>
             </div>
          )}
          
          {user && notifPerm !== 'granted' && (
             <div className="bg-blue-600 text-white p-4 flex justify-between items-center shadow-sm">
                <div>
                   <p className="text-sm font-black mb-1">🔔 ¡Ofertas exclusivas!</p>
                   <p className="text-[10px] font-medium opacity-90 leading-tight">Activa los avisos en tu dispositivo.</p>
                </div>
                <button onClick={pedirNotificaciones} className="bg-white text-blue-600 text-xs font-black px-4 py-2 rounded-xl shadow-sm ml-2">Activar</button>
             </div>
          )}

          {/* VISTA RESERVAS */}
          {vistaActual === 'reservas' && (
            <div className="p-8 text-center mt-20 animate-fade-in flex-grow">
              <div className="text-6xl mb-6">📅</div>
              <h2 className="text-3xl font-black text-gray-800 mb-4">Próximamente</h2>
              <p className="text-gray-500 font-medium text-lg">Estamos preparando el sistema de reservas.</p>
            </div>
          )}

          {/* VISTA HISTORIAL */}
          {vistaActual === 'historial' && (
            <div className="p-4 animate-fade-in flex-grow">
              <h2 className="text-2xl font-black text-gray-800 mb-4 tracking-tight">Tus Pedidos</h2>
              
              {!user && (
                <div className="bg-white p-6 rounded-3xl text-center border-2 border-dashed border-gray-200 mt-10">
                  <p className="text-gray-500 font-bold mb-4">Inicia sesión para ver tu historial y volver a pedir tus favoritos.</p>
                  <button onClick={() => setShowAuthModal(true)} className="bg-red-600 text-white px-6 py-3 rounded-xl font-black">Entrar ahora</button>
                </div>
              )}
              
              {user && historial.length === 0 && (
                <div className="text-center text-gray-400 mt-20">
                  <div className="text-5xl mb-4">🍽️</div>
                  <p className="font-bold">Aún no hay pedidos en tu historial.</p>
                </div>
              )}

              {user && historial.length > 0 && (
                <div className="space-y-4">
                  {historial.map((h, i) => {
                     const total = h.items.reduce((acc, item) => acc + (item.cantidad * item.precio_unitario), 0);
                     return (
                        <div key={h.id} className="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                          <div className="flex justify-between items-center border-b border-gray-100 pb-3 mb-3">
                            <span className="text-xs font-bold text-gray-400">{formatDate(h.fecha)}</span>
                            <span className="text-lg font-black text-green-500">{formatMoney(total)}€</span>
                          </div>
                          <ul className="text-sm text-gray-700 space-y-2">
                            {h.items.map((item, idx) => (
                              <li key={idx} className="flex gap-2 font-medium">
                                 <span className="text-red-500 font-black">{item.cantidad}x</span>
                                 {item.producto?.nombre}
                              </li>
                            ))}
                          </ul>
                        </div>
                     );
                  })}
                  
                  <button onClick={borrarHistorial} className="w-full mt-8 bg-gray-100 text-gray-500 font-bold py-4 rounded-2xl active:bg-gray-200 transition-colors">
                    Limpiar mi historial
                  </button>
                </div>
              )}
            </div>
          )}

          {/* VISTA MESA */}
          {vistaActual === 'mesa' && (
            <div className="animate-fade-in flex-grow relative">
              
              <div className="m-4">
                {!user ? (
                  <div className="relative overflow-hidden rounded-[2rem] p-6 shadow-lg bg-gradient-to-br from-gray-700 to-gray-900 text-white cursor-pointer" onClick={() => { setAuthMode('register'); setShowAuthModal(true); }}>
                    <div className="absolute inset-0 bg-black/40 z-10 flex flex-col items-center justify-center text-center p-4 backdrop-blur-[2px]">
                        <h3 className="font-black text-xl text-yellow-400 mb-1">Activa tu Wallet</h3>
                        <p className="text-xs font-medium text-white/90">Regístrate para ganar puntos universales y premios.</p>
                        <button className="mt-4 bg-red-600 px-8 py-3 rounded-full font-black text-sm shadow-lg">Crear cuenta</button>
                    </div>
                    <div className="opacity-20 blur-sm pointer-events-none">
                        <p className="text-[10px] font-bold uppercase mb-1">Bokalia Wallet</p>
                        <p className="text-3xl font-black mb-4">0 pts</p>
                        <div className="h-3 w-full bg-white/20 rounded-full"></div>
                    </div>
                  </div>
                ) : (
                  <div className="relative overflow-hidden rounded-[2rem] p-6 shadow-xl bg-gradient-to-br from-yellow-400 to-yellow-500 text-yellow-900">
                    <div className="absolute -right-10 -top-10 w-40 h-40 rounded-full bg-white opacity-20"></div>
                    <div className="relative z-10 flex justify-between items-start mb-6">
                      <div>
                        <p className="text-[10px] font-black uppercase tracking-widest mb-1 opacity-80">Bokalia Wallet</p>
                        <p className="text-4xl font-black tracking-tighter">{userProfile?.puntos || 0} <span className="text-lg font-bold opacity-80">pts</span></p>
                      </div>
                      <div className="bg-white/40 backdrop-blur-md px-3 py-1.5 rounded-xl text-xs font-black uppercase shadow-sm border border-white/50">
                        {(userProfile?.puntos||0) > 500 ? 'VIP ORO' : 'VIP BRONCE'}
                      </div>
                    </div>
                    <div className="relative z-10">
                      <div className="flex justify-between text-xs font-black opacity-80 mb-2">
                        <span>Meta: Burger Gratis</span>
                        <span>{userProfile?.puntos || 0} / 1500</span>
                      </div>
                      <div className="h-3 w-full bg-black/10 rounded-full overflow-hidden shadow-inner">
                        <div className="h-full bg-white rounded-full transition-all duration-1000" style={{ width: `${Math.min(((userProfile?.puntos||0)/1500)*100, 100)}%` }}></div>
                      </div>
                    </div>
                  </div>
                )}
              </div>

              <div className="p-4">
                {ultimoPedido && (
                  <div className="bg-gradient-to-r from-orange-500 to-red-500 p-1.5 rounded-[2rem] shadow-lg mb-8">
                    <div className="bg-white/10 backdrop-blur-sm rounded-[1.6rem] p-4 flex items-center justify-between border border-white/20">
                      <div>
                        <span className="bg-yellow-400 text-yellow-900 text-[10px] font-black px-2 py-1 rounded-lg uppercase shadow-sm tracking-widest">Pídelo de nuevo</span>
                        <p className="text-white font-black text-xl mt-1 leading-tight">{ultimoPedido.nombre}</p>
                      </div>
                      <button onClick={() => añadirAlCarrito(ultimoPedido)} className="bg-white text-red-600 font-black py-3 px-5 rounded-2xl shadow-lg active:scale-95 transition-transform text-sm">
                        + Añadir
                      </button>
                    </div>
                  </div>
                )}

                <h2 className="text-2xl font-black text-gray-800 mb-4 ml-1 tracking-tight">La Carta</h2>
                
                <div className="grid grid-cols-2 gap-4 mb-8">
                  {productos.map(p => (
                    <div key={p.id} className="bg-white rounded-3xl overflow-hidden shadow-md border border-gray-100 flex flex-col">
                      <div className="h-32 bg-gray-200"><img src={p.imagen_url} className="w-full h-full object-cover" /></div>
                      <div className="p-4 flex flex-col flex-grow">
                        <h3 className="font-black text-gray-800 text-sm leading-tight">{p.nombre}</h3>
                        <p className="text-orange-500 font-black mt-1 mb-4 text-xl">{p.precio}€</p>
                        <button onClick={() => añadirAlCarrito(p)} className="mt-auto w-full bg-red-50 text-red-600 font-black py-3 rounded-2xl text-sm active:bg-red-600 active:text-white transition-colors">Añadir</button>
                      </div>
                    </div>
                  ))}
                </div>

                {/* CESTA DE LA MESA */}
                {rondas.length > 0 && (
                  <div className="mb-8">
                    <div className="flex justify-between items-center mb-4 ml-1">
                      <h2 className="text-xl font-black text-gray-800 flex items-center gap-2">
                        <div className="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.8)]"></div>
                        Mesa en directo
                      </h2>
                      {sesionActiva.estado === 'activa' && (
                        <button onClick={pedirCuenta} className="bg-gray-900 text-white text-xs font-black px-5 py-3 rounded-2xl shadow-lg active:bg-black transition-colors">Pedir Cuenta</button>
                      )}
                    </div>
                    {rondas.map((ronda, i) => (
                      <div key={ronda.id} className="bg-white p-5 rounded-[2rem] shadow-sm border border-gray-100 mb-4">
                        <div className="flex justify-between items-center border-b border-gray-100 pb-3 mb-3">
                          <p className="font-black text-gray-400 text-sm uppercase tracking-widest">Ronda #{i+1}</p>
                          <span className="text-[10px] font-black text-orange-600 bg-orange-100 px-3 py-1 rounded-full uppercase tracking-widest">{ronda.estado}</span>
                        </div>
                        <ul className="text-sm text-gray-800 space-y-3">
                          {ronda.items?.map((item, idx) => (
                            <li key={idx} className="flex gap-3 font-bold items-center text-base">
                               <span className="bg-gray-100 text-red-600 w-8 h-8 flex items-center justify-center rounded-xl">{item.cantidad}x</span>
                               {item.producto?.nombre} 
                               <span className="text-gray-400 text-xs ml-auto">{item.precio_unitario}€</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* CARRITO FLOTANTE */}
          {carrito.length > 0 && vistaActual === 'mesa' && !mesaBloqueada && (
            <div className="fixed bottom-0 left-0 w-full bg-white p-5 shadow-[0_-15px_40px_-5px_rgba(0,0,0,0.15)] z-20 animate-slide-up rounded-t-[2.5rem]">
              <div className="flex justify-between items-center max-w-md mx-auto">
                <div>
                  <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Tu pedido</p>
                  <p className="text-3xl font-black text-gray-800 tracking-tighter">{carrito.length} <span className="text-base font-bold text-gray-500">ítems</span></p>
                </div>
                <button onClick={intentarEnviarPedido} className="bg-green-500 text-white font-black py-4 px-6 rounded-2xl shadow-[0_8px_20px_rgba(34,197,94,0.4)] text-lg flex items-center gap-2 active:scale-95 transition-transform">
                  Enviar a cocina
                </button>
              </div>
            </div>
          )}

          {/* MODALES ABSOLUTES */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in">
              <div className="bg-white rounded-t-[2.5rem] sm:rounded-[2.5rem] p-8 w-full max-w-md relative shadow-2xl animate-slide-up">
                <button onClick={() => setShowAuthModal(false)} className="absolute top-6 right-6 text-gray-400 font-black text-xl bg-gray-100 w-10 h-10 rounded-full flex items-center justify-center">✕</button>
                
                <h3 className="text-4xl font-black mb-1 text-gray-800 tracking-tighter">{authMode === 'login' ? 'Hola' : 'Únete'}</h3>
                <p className="text-gray-500 mb-8 font-medium text-sm">{authMode === 'login' ? 'Entra a tu cuenta.' : 'Crea tu cuenta para ganar puntos.'}</p>
                <input type="email" placeholder="Correo electrónico" value={email} onChange={e => setEmail(e.target.value)} className="w-full mb-4 p-5 bg-gray-50 border-2 border-gray-100 rounded-2xl outline-none font-bold focus:border-red-500" />
                <input type="password" placeholder="Contraseña" value={password} onChange={e => setPassword(e.target.value)} className="w-full mb-6 p-5 bg-gray-50 border-2 border-gray-100 rounded-2xl outline-none font-bold focus:border-red-500" />
                
                <button onClick={handleAuth} className={`w-full text-white font-black py-5 rounded-2xl text-xl active:scale-95 transition-transform mb-4 shadow-lg ${authMode === 'login' ? 'bg-red-600 shadow-red-600/30' : 'bg-yellow-400 text-yellow-900 shadow-yellow-400/50'}`}>
                   {authMode === 'login' ? 'Entrar' : 'Registrarme'}
                </button>
                <button onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')} className="w-full text-gray-500 font-bold py-3">
                   {authMode === 'login' ? 'No tengo cuenta, crear una' : 'Ya tengo cuenta, iniciar sesión'}
                </button>
              </div>
            </div>
          )}

          {showModoMesa && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-[2.5rem] p-8 w-full max-w-md relative shadow-2xl animate-slide-up text-center">
                <button onClick={() => setShowModoMesa(false)} className="absolute top-6 right-6 text-gray-400 font-black text-xl bg-gray-100 w-10 h-10 rounded-full flex items-center justify-center">✕</button>
                <div className="text-6xl mb-6 mt-4">🍕</div>
                <h3 className="text-3xl font-black text-gray-800 mb-2 tracking-tighter">¿Cómo vais a pedir?</h3>
                <p className="text-gray-500 text-sm font-medium mb-10">Elige la configuración para esta mesa.</p>
                <div className="flex flex-col gap-4">
                  <button onClick={() => procesarEnvio(true)} className="w-full bg-yellow-400 text-yellow-900 font-black py-6 px-4 rounded-3xl shadow-xl shadow-yellow-400/30 active:scale-95 transition-transform flex flex-col items-center">
                    <span className="text-xl">Con Amigos</span>
                    <span className="text-xs font-bold opacity-70 mt-1 uppercase tracking-widest">Cuentas Separadas</span>
                  </button>
                  <button onClick={() => procesarEnvio(false)} className="w-full bg-white text-gray-800 font-black py-6 px-4 rounded-3xl border-[3px] border-gray-200 active:scale-95 transition-transform flex flex-col items-center">
                    <span className="text-xl">Yo Solo</span>
                    <span className="text-xs font-bold opacity-50 mt-1 uppercase tracking-widest">Mesa Exclusiva</span>
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><MainApp /></ErrorBoundary>);
  </script>
</body>
</html>
