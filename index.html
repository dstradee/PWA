<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bokalia - Pide desde tu mesa</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Sistema de captura de errores críticos -->
  <script>
    window.addEventListener('error', function(e) {
      if(e.message.includes("Anonymous")) return; // Ignoramos el aviso de supabase
      document.body.innerHTML += `<div style="position:fixed; top:0; left:0; right:0; background:red; color:white; padding:10px; z-index:9999;">Error: ${e.message}</div>`;
    });
  </script>
  <style> body { font-family: system-ui, sans-serif; background: #f9fafb; margin: 0; } </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- CONFIGURACIÓN SUPABASE ---
    const supabase = window.supabase.createClient(
      'https://bswlriuzeintgjioywtz.supabase.co',
      'sb_publishable_oIWpn-mNPUZaQPdf7HNU_Q_Lc7R6UOB'
    );

    function App() {
      // Estados principales
      const [mesaParam, setMesaParam] = useState(null);
      const [user, setUser] = useState(null);
      const [productos, setProductos] = useState([]);
      const [sesionActiva, setSesionActiva] = useState(null);
      const [rondas, setRondas] = useState([]);
      const [carrito, setCarrito] = useState([]);
      
      // Estado de UI
      const [loading, setLoading] = useState(true);
      const [showAuthModal, setShowAuthModal] = useState(false);
      
      // Estados para Login
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [authLoading, setAuthLoading] = useState(false);

      useEffect(() => {
        // 1. Mirar si viene de un QR (?mesa=X)
        const urlParams = new URLSearchParams(window.location.search);
        const mesa = urlParams.get('mesa');
        if (mesa) setMesaParam(parseInt(mesa));

        // 2. Cargar menú público (No requiere registro)
        cargarMenu();

        // 3. Revisar si hay un usuario logueado en la caché
        supabase.auth.getSession().then(({ data }) => {
          if (data?.session?.user) setUser(data.session.user);
          setLoading(false);
        }).catch(() => setLoading(false));

        // Escuchar si el usuario inicia/cierra sesión
        const { data: authListener } = supabase.auth.onAuthStateChange((_, session) => {
          setUser(session?.user || null);
        });

        return () => { if (authListener?.subscription) authListener.subscription.unsubscribe(); };
      }, []);

      // Cada vez que sabemos la mesa o cambia el usuario, comprobamos si hay una sesión de mesa
      useEffect(() => {
        if (mesaParam) verificarSesionMesa();
      }, [mesaParam, user]);

      // Suscripción en tiempo real cuando hay una sesión activa
      useEffect(() => {
        if (sesionActiva) {
          cargarRondasMesa(sesionActiva.id);
          const channel = supabase.channel(`mesa_${sesionActiva.id}`)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos_rondas' }, () => {
              cargarRondasMesa(sesionActiva.id);
            }).subscribe();
          return () => supabase.removeChannel(channel);
        }
      }, [sesionActiva]);

      // --- FUNCIONES DE BASE DE DATOS ---
      const cargarMenu = async () => {
        const { data, error } = await supabase.from('productos').select('*');
        if (data) setProductos(data);
      };

      const verificarSesionMesa = async () => {
        const { data } = await supabase
          .from('sesiones_mesa')
          .select('*')
          .eq('num_mesa', mesaParam)
          .eq('estado', 'activa')
          .limit(1)
          .maybeSingle();
        if (data) setSesionActiva(data);
      };

      const cargarRondasMesa = async (idSesion) => {
        const { data } = await supabase
          .from('pedidos_rondas')
          .select('*, items:items_pedido(*, producto:productos(nombre))')
          .eq('sesion_id', idSesion);
        if (data) setRondas(data);
      };

      // --- FUNCIONES DEL USUARIO ---
      const handleLogin = async (esRegistro) => {
        setAuthLoading(true);
        const { data, error } = esRegistro
          ? await supabase.auth.signUp({ email, password })
          : await supabase.auth.signInWithPassword({ email, password });
          
        setAuthLoading(false);
        if (error) {
          alert("Error: " + error.message);
        } else {
          setShowAuthModal(false); // Cierra el pop-up si tuvo éxito
        }
      };

      const intentarAñadirAlCarrito = (producto) => {
        // SI NO ESTÁ LOGUEADO, LE PEDIMOS QUE LO HAGA
        if (!user) {
          setShowAuthModal(true);
          return;
        }
        // SI ESTÁ LOGUEADO, LO AÑADE
        setCarrito([...carrito, { ...producto, idUnico: Math.random() }]);
      };

      const enviarPedido = async () => {
        if (carrito.length === 0) return;
        
        let idDeSesion = sesionActiva?.id;

        // Si no hay sesión, este usuario es el primero en pedir, así que la creamos (Host)
        if (!idDeSesion) {
          const { data: nuevaSesion } = await supabase
            .from('sesiones_mesa')
            .insert([{ num_mesa: mesaParam, host_id: user.id, estado: 'activa' }])
            .select().single();
          if (nuevaSesion) {
            idDeSesion = nuevaSesion.id;
            setSesionActiva(nuevaSesion);
          } else {
            return alert("Error al abrir la mesa. Asegúrate de que las Políticas RLS están desactivadas.");
          }
        }

        // Crear la ronda de pedido
        const { data: ronda } = await supabase
          .from('pedidos_rondas')
          .insert([{ sesion_id: idDeSesion, usuario_id: user.id }])
          .select().single();

        if (ronda) {
          // Agrupar productos repetidos para la base de datos
          const conteo = {};
          carrito.forEach(p => { conteo[p.id] = (conteo[p.id] || 0) + 1; });
          
          const itemsInsert = Object.keys(conteo).map(id => ({
            ronda_id: ronda.id,
            producto_id: id,
            cantidad: conteo[id],
            precio_unitario: carrito.find(p => p.id === id).precio
          }));

          await supabase.from('items_pedido').insert(itemsInsert);
          setCarrito([]); // Vaciamos carrito
          cargarRondasMesa(idDeSesion); // Refrescamos vista
          alert("¡Pedido enviado a cocina!");
        }
      };

      // --- RENDERIZADO (INTERFAZ) ---

      if (loading) return <div className="h-screen flex items-center justify-center font-bold text-red-600">Cargando Bokalia...</div>;

      // PANTALLA 1: PEDIR NÚMERO DE MESA SI NO HAY QR
      if (!mesaParam) return (
        <div className="min-h-screen bg-yellow-50 flex flex-col justify-center items-center p-6 text-center">
          <div className="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full border-2 border-red-100">
            <h1 className="text-4xl font-black text-red-600 mb-2">BOKALIA</h1>
            <p className="mb-8 text-gray-500 font-medium">¿En qué mesa estás sentado?</p>
            
            <input 
              type="number" id="inputMesa" 
              className="text-center text-5xl font-black w-full p-4 rounded-2xl bg-gray-50 border-4 border-gray-200 focus:border-red-500 outline-none mb-6 transition-all" 
              placeholder="Ej: 5" 
            />
            
            <button 
              onClick={() => {
                const val = document.getElementById('inputMesa').value;
                if(val) window.location.search = `?mesa=${val}`;
              }} 
              className="w-full bg-red-600 hover:bg-red-700 text-white font-black py-4 rounded-2xl text-xl shadow-lg transition-transform active:scale-95"
            >
              Ver la carta
            </button>
          </div>
        </div>
      );

      // PANTALLA 2: EL MENÚ PRINCIPAL (PÚBLICO)
      return (
        <div className="pb-32 bg-gray-50 min-h-screen relative">
          
          {/* HEADER FAST FOOD */}
          <header className="bg-red-600 text-white p-4 sticky top-0 z-10 shadow-md flex justify-between items-center">
            <div>
              <h1 className="font-black text-2xl text-yellow-400 leading-none">BOKALIA</h1>
              <span className="text-xs font-medium text-red-200">Mesa {mesaParam}</span>
            </div>
            
            {user ? (
              <button onClick={() => supabase.auth.signOut()} className="text-xs font-bold bg-red-700 px-3 py-2 rounded-lg hover:bg-red-800">
                Salir
              </button>
            ) : (
              <button onClick={() => setShowAuthModal(true)} className="text-sm font-bold bg-yellow-400 text-red-900 px-4 py-2 rounded-lg hover:bg-yellow-500 shadow-sm">
                Entrar
              </button>
            )}
          </header>

          <div className="p-4 max-w-2xl mx-auto">
            
            <div className="flex justify-between items-end mb-4">
              <h2 className="text-2xl font-black text-gray-800">Nuestra Carta</h2>
            </div>
            
            {/* LISTA DE PRODUCTOS */}
            <div className="grid grid-cols-2 gap-4 mb-8">
              {productos.length === 0 ? <p className="col-span-2 text-center py-10 text-gray-400 bg-white rounded-2xl border-2 border-dashed">No hay productos. Ejecuta el SQL.</p> : null}
              {productos.map(p => (
                <div key={p.id} className="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col">
                  <div className="h-32 bg-gray-200 relative">
                    {p.imagen_url ? <img src={p.imagen_url} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-gray-400">Sin foto</div>}
                  </div>
                  <div className="p-3 flex flex-col flex-grow">
                    <h3 className="font-bold text-gray-800 text-sm leading-tight">{p.nombre}</h3>
                    <p className="text-orange-500 font-black mt-1 mb-3 text-lg">{p.precio}€</p>
                    <button 
                      onClick={() => intentarAñadirAlCarrito(p)} 
                      className="mt-auto w-full bg-red-50 hover:bg-red-600 text-red-600 hover:text-white font-bold py-2.5 rounded-xl text-sm transition-colors"
                    >
                      Añadir
                    </button>
                  </div>
                </div>
              ))}
            </div>

            {/* PEDIDOS DE LA MESA (Si hay sesión activa) */}
            {rondas.length > 0 && (
              <div className="mb-8">
                <h2 className="text-xl font-black text-gray-800 mb-4 flex items-center gap-2">
                  <span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                  Pedidos de esta mesa
                </h2>
                {rondas.map((ronda, i) => (
                  <div key={ronda.id} className="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-yellow-400 mb-3">
                    <div className="flex justify-between items-center border-b border-gray-100 pb-2 mb-2">
                      <p className="font-black text-gray-700">Ronda #{i+1}</p>
                      <span className="bg-orange-100 text-orange-700 text-xs font-bold px-2 py-1 rounded uppercase">{ronda.estado}</span>
                    </div>
                    <ul className="text-sm text-gray-600 space-y-1">
                      {ronda.items?.map(item => (
                        <li key={item.id} className="flex gap-2">
                          <span className="font-black text-red-500">{item.cantidad}x</span> 
                          <span>{item.producto?.nombre}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* BOTÓN FLOTANTE DEL CARRITO */}
          {carrito.length > 0 && (
            <div className="fixed bottom-0 left-0 w-full bg-white p-4 shadow-[0_-15px_30px_-5px_rgba(0,0,0,0.15)] z-20 border-t border-gray-100">
              <div className="flex justify-between items-center max-w-2xl mx-auto">
                <div>
                  <p className="text-xs font-bold text-gray-400 uppercase tracking-wider">Tu pedido</p>
                  <p className="text-2xl font-black text-gray-800">{carrito.length} <span className="text-base font-medium text-gray-500">productos</span></p>
                </div>
                <button 
                  onClick={enviarPedido} 
                  className="bg-green-500 hover:bg-green-600 text-white font-black py-4 px-8 rounded-2xl shadow-xl text-lg flex items-center gap-2 transform active:scale-95 transition-all"
                >
                  Pedir ya
                </button>
              </div>
            </div>
          )}

          {/* MODAL DE LOGIN (Solo sale si intentas pedir y no estás logueado) */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex justify-center items-center p-4">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm relative shadow-2xl">
                <button onClick={() => setShowAuthModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                
                <h3 className="text-2xl font-black text-gray-800 mb-1">¡Casi listo!</h3>
                <p className="text-gray-500 text-sm mb-6">Inicia sesión o regístrate en segundos para mandar tu pedido a cocina.</p>
                
                <input type="email" placeholder="Correo electrónico" value={email} onChange={e => setEmail(e.target.value)} className="w-full mb-3 p-4 bg-gray-100 rounded-xl outline-none focus:ring-2 focus:ring-orange-500" />
                <input type="password" placeholder="Contraseña" value={password} onChange={e => setPassword(e.target.value)} className="w-full mb-6 p-4 bg-gray-100 rounded-xl outline-none focus:ring-2 focus:ring-orange-500" />
                
                <div className="flex gap-3">
                  <button onClick={() => handleLogin(false)} disabled={authLoading} className="flex-1 bg-orange-500 text-white font-bold py-3 rounded-xl disabled:opacity-50">
                    Entrar
                  </button>
                  <button onClick={() => handleLogin(true)} disabled={authLoading} className="flex-1 bg-yellow-400 text-red-900 font-bold py-3 rounded-xl disabled:opacity-50">
                    Registrarme
                  </button>
                </div>
              </div>
            </div>
          )}
          
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
