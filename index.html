<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bokalia - Pide desde tu mesa</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; -webkit-tap-highlight-color: transparent; }
    /* Animaciones suaves para modales */
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.3s ease forwards; }
  </style>
</head>
<body class="flex justify-center bg-gray-900">
  <!-- Contenedor formato móvil -->
  <div id="root" class="w-full max-w-md bg-gray-50 min-h-screen relative overflow-x-hidden shadow-2xl"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const supabase = window.supabase.createClient(
      'https://bswlriuzeintgjioywtz.supabase.co',
      'sb_publishable_oIWpn-mNPUZaQPdf7HNU_Q_Lc7R6UOB'
    );

    const MENU_EMERGENCIA = [
      { id: 'prod_1', nombre: 'Bokata Clásico', precio: 5.50, imagen_url: 'https://images.unsplash.com/photo-1619881589316-56c7f9e6b587?w=500', categoria: 'Bocadillos' },
      { id: 'prod_2', nombre: 'Burger Doble', precio: 8.90, imagen_url: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500', categoria: 'Hamburguesas' },
      { id: 'prod_3', nombre: 'Patatas Bravas', precio: 4.50, imagen_url: 'https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?w=500', categoria: 'Entrantes' }
    ];

    function App() {
      // ESTADOS PRINCIPALES
      const [vistaActual, setVistaActual] = useState('mesa');
      const [mesaParam, setMesaParam] = useState(null);
      const [user, setUser] = useState(null);
      const [userProfile, setUserProfile] = useState(null);
      const [productos, setProductos] = useState([]);
      
      const [sesionActiva, setSesionActiva] = useState(null);
      const [mesaBloqueada, setMesaBloqueada] = useState(false);
      const [hostName, setHostName] = useState('');
      
      const [rondas, setRondas] = useState([]);
      const [carrito, setCarrito] = useState([]);
      
      const [ultimoPedido, setUltimoPedido] = useState(null);
      
      // ESTADOS UI (MODALES)
      const [loading, setLoading] = useState(true);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register'
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      
      const [showModoMesa, setShowModoMesa] = useState(false); // Modal para separar cuenta
      const [showJoinPrompt, setShowJoinPrompt] = useState(false);
      const [showReviewModal, setShowReviewModal] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const mesa = urlParams.get('mesa');
        if (mesa) setMesaParam(parseInt(mesa));

        cargarMenu();

        supabase.auth.getSession().then(({ data }) => {
          if (data?.session?.user) procesarUsuario(data.session.user);
          else setLoading(false);
        });

        const { data: authListener } = supabase.auth.onAuthStateChange((_, session) => {
          if(session?.user) procesarUsuario(session.user);
          else { setUser(null); setUserProfile(null); setUltimoPedido(null); }
        });

        return () => { if (authListener?.subscription) authListener.subscription.unsubscribe(); };
      }, []);

      useEffect(() => {
        if (mesaParam) verificarSesionMesa();
      }, [mesaParam, user]);

      useEffect(() => {
        if (sesionActiva) {
          cargarRondasMesa(sesionActiva.id);
          const channel = supabase.channel(`mesa_${sesionActiva.id}`)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos_rondas' }, () => {
              cargarRondasMesa(sesionActiva.id);
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sesiones_mesa', filter: `id=eq.${sesionActiva.id}` }, (payload) => {
              if (payload.new.estado === 'pagada') setTimeout(() => setShowReviewModal(true), 4000);
            })
            .subscribe();
          return () => supabase.removeChannel(channel);
        }
      }, [sesionActiva]);

      // --- LOGICA DE DATOS ---

      const procesarUsuario = async (authUser) => {
        setUser(authUser);
        let { data } = await supabase.from('usuarios').select('*').eq('id', authUser.id).single();
        if (!data) {
          const { data: newUser } = await supabase.from('usuarios').insert([{ id: authUser.id, email: authUser.email, puntos: 50 }]).select().single();
          data = newUser;
        }
        setUserProfile(data);
        buscarUltimoPedido(authUser.id);
        setLoading(false);
      };

      const cargarMenu = async () => {
        const { data, error } = await supabase.from('productos').select('*').eq('activo', true);
        if (error || !data || data.length === 0) setProductos(MENU_EMERGENCIA);
        else setProductos(data);
      };

      const buscarUltimoPedido = async (userId) => {
        const { data: ultimasRondas } = await supabase.from('pedidos_rondas').select('id').eq('usuario_id', userId).order('fecha', { ascending: false }).limit(1);
        if (ultimasRondas && ultimasRondas.length > 0) {
          const { data: items } = await supabase.from('items_pedido').select('producto_id, producto:productos(*)').eq('ronda_id', ultimasRondas[0].id).limit(1);
          if (items && items.length > 0 && items[0].producto) setUltimoPedido(items[0].producto);
        }
      };

      const verificarSesionMesa = async () => {
        const { data } = await supabase.from('sesiones_mesa')
          .select('*, host:usuarios(nombre, email)').eq('num_mesa', mesaParam).neq('estado', 'pagada').maybeSingle();
        
        if (data) {
          if (user && data.host_id !== user.id) {
            if (data.compartida === false) {
              // Mesa bloqueada por el Host (Yo Solo)
              setMesaBloqueada(true);
            } else {
              // Mesa Tricount (Con Amigos)
              setHostName(data.host?.nombre || data.host?.email || 'Un amigo');
              setShowJoinPrompt(true);
            }
          }
          if (!mesaBloqueada) setSesionActiva(data);
        }
      };

      const cargarRondasMesa = async (idSesion) => {
        const { data } = await supabase.from('pedidos_rondas')
          .select('*, items:items_pedido(id, cantidad, producto_id, producto:productos(nombre, precio))').eq('sesion_id', idSesion);
        if (data) setRondas(data);
      };

      // --- LOGICA DE AUTH ---
      
      const handleAuth = async () => {
        setLoading(true);
        const { data, error } = authMode === 'register'
          ? await supabase.auth.signUp({ email, password })
          : await supabase.auth.signInWithPassword({ email, password });
          
        setLoading(false);
        if (error) {
          alert("Error: " + error.message);
        } else {
          setShowAuthModal(false);
          // procesarUsuario se llama automáticamente por el AuthListener
        }
      };

      // --- LOGICA DE PEDIDOS ---

      const intentarEnviarPedido = () => {
        if (!user) return setShowAuthModal(true);
        
        // Si no hay sesión, es el primer pedido de la mesa. Preguntamos el modo.
        if (!sesionActiva) {
          setShowModoMesa(true);
        } else {
          procesarEnvio(sesionActiva.compartida);
        }
      };

      const procesarEnvio = async (esCompartida) => {
        setShowModoMesa(false);
        let idDeSesion = sesionActiva?.id;

        // 1. Crear sesión si es el primer pedido
        if (!idDeSesion) {
          const { data } = await supabase.from('sesiones_mesa')
            .insert([{ num_mesa: mesaParam, host_id: user.id, estado: 'activa', compartida: esCompartida }])
            .select().single();
          idDeSesion = data.id;
          setSesionActiva(data);
        }

        // 2. Crear Ronda
        const { data: ronda } = await supabase.from('pedidos_rondas')
          .insert([{ sesion_id: idDeSesion, usuario_id: user.id }]).select().single();

        if (ronda) {
          // 3. Agrupar carrito
          const conteo = {};
          carrito.forEach(p => { conteo[p.id] = (conteo[p.id] || 0) + 1; });
          
          const itemsInsert = Object.keys(conteo).map(id => ({
            ronda_id: ronda.id, producto_id: id, cantidad: conteo[id], precio_unitario: carrito.find(p => p.id === id).precio
          }));
          
          await supabase.from('items_pedido').insert(itemsInsert);
          
          // 4. Sumar puntos
          const totalGastado = carrito.reduce((sum, p) => sum + p.precio, 0);
          const puntosGanados = Math.floor(totalGastado * 20); 
          await supabase.from('usuarios').update({ puntos: (userProfile?.puntos || 0) + puntosGanados }).eq('id', user.id);
          procesarUsuario(user);
          
          // 5. Éxito
          setCarrito([]);
          cargarRondasMesa(idDeSesion);
          mostrarToast("¡Orden enviada a cocina! 🚀");
        }
      };

      const mostrarToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const pedirCuenta = async () => {
        if (!sesionActiva) return;
        await supabase.from('sesiones_mesa').update({ estado: 'pagando' }).eq('id', sesionActiva.id);
        mostrarToast("Cuenta solicitada al camarero 💸");
        setTimeout(async () => {
          await supabase.from('sesiones_mesa').update({ estado: 'pagada' }).eq('id', sesionActiva.id);
        }, 5000); 
      };

      // ==========================================
      // COMPONENTES UI
      // ==========================================

      const Toast = () => {
        if (!toastMsg) return null;
        return (
          <div className="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 animate-fade-in w-11/12 max-w-sm">
            <div className="bg-green-500 text-white font-black px-6 py-4 rounded-2xl shadow-xl flex items-center justify-between">
              <span>{toastMsg}</span>
              <span>✅</span>
            </div>
          </div>
        );
      };

      // --- MESA BLOQUEADA ---
      if (mesaBloqueada) {
        return (
          <div className="min-h-screen bg-gray-50 flex flex-col justify-center items-center p-6 text-center">
            <div className="text-6xl mb-4">🔒</div>
            <h1 className="text-3xl font-black text-gray-800 mb-2">Mesa Cerrada</h1>
            <p className="text-gray-500 font-medium">Esta mesa está ocupada y configurada como "Cuenta Única". No admite más comensales en la app.</p>
            <button onClick={() => window.location.search=''} className="mt-8 text-red-600 font-bold">Cambiar de mesa</button>
          </div>
        );
      }

      // --- PANTALLA INICIAL ---
      if (!mesaParam) return (
        <div className="min-h-screen bg-yellow-50 flex flex-col justify-center items-center p-6 text-center">
          <div className="bg-white p-8 rounded-[2rem] shadow-xl w-full">
            <h1 className="text-5xl font-black text-red-600 mb-2 tracking-tighter">BOKALIA</h1>
            <p className="text-gray-500 mb-8 font-bold text-lg">¿En qué mesa te sientas?</p>
            <input type="number" id="inputMesa" className="text-center text-6xl font-black w-full p-4 rounded-2xl bg-gray-50 border-2 border-gray-200 mb-6 outline-none focus:border-red-500" placeholder="0" />
            <button onClick={() => window.location.search = `?mesa=${document.getElementById('inputMesa').value}`} className="w-full bg-red-600 active:bg-red-700 text-white font-black py-5 rounded-2xl text-2xl shadow-lg transition-all">Empezar a pedir</button>
          </div>
        </div>
      );

      // --- RENDER PRINCIPAL ---
      return (
        <div className="pb-32 bg-gray-50 min-h-screen relative">
          <Toast />

          {/* CABECERA ROJA */}
          <header className="bg-red-600 text-white p-4 sticky top-0 z-30 shadow-md">
            <div className="flex justify-between items-center">
              <h1 className="font-black text-2xl text-yellow-400 tracking-tighter">BOKALIA</h1>
              {userProfile ? (
                 <div className="flex items-center gap-2">
                    <span className="text-xs font-bold text-red-100">{userProfile.email.split('@')[0]}</span>
                    <button onClick={() => supabase.auth.signOut()} className="text-xs font-bold bg-red-800 px-3 py-2 rounded-xl">Salir</button> 
                 </div>
              ) : (
                 <button onClick={() => { setAuthMode('login'); setShowAuthModal(true); }} className="text-sm font-black bg-yellow-400 text-red-900 px-5 py-2 rounded-xl shadow-sm">Entrar</button>
              )}
            </div>
            {/* Navegación */}
            <div className="flex gap-4 border-t border-red-500 pt-3 mt-3">
              <button onClick={() => setVistaActual('mesa')} className={`font-bold pb-2 border-b-2 ${vistaActual==='mesa' ? 'border-white text-white' : 'border-transparent text-red-200'}`}>Mesa {mesaParam}</button>
              <button onClick={() => setVistaActual('reservas')} className={`font-bold pb-2 border-b-2 ${vistaActual==='reservas' ? 'border-white text-white' : 'border-transparent text-red-200'}`}>Reservas</button>
            </div>
          </header>

          {/* RESERVAS VISTA */}
          {vistaActual === 'reservas' && (
            <div className="p-8 text-center mt-20 animate-fade-in">
              <div className="text-6xl mb-6">📅</div>
              <h2 className="text-3xl font-black text-gray-800 mb-4">Próximamente</h2>
              <p className="text-gray-500 font-medium text-lg">Estamos preparando el mejor sistema de reservas.</p>
            </div>
          )}

          {/* MESA VISTA */}
          {vistaActual === 'mesa' && (
            <div className="animate-fade-in">
              
              {/* TARJETA FIDELIZACIÓN (BANCO) */}
              <div className="m-4">
                {!userProfile ? (
                  <div className="relative overflow-hidden rounded-3xl p-6 shadow-md bg-gradient-to-br from-gray-700 to-gray-900 text-white cursor-pointer" onClick={() => { setAuthMode('register'); setShowAuthModal(true); }}>
                    <div className="absolute inset-0 bg-black/40 z-10 flex flex-col items-center justify-center text-center p-4 backdrop-blur-[2px]">
                        <h3 className="font-black text-xl text-yellow-400 mb-1">Activa tu Wallet</h3>
                        <p className="text-xs font-medium text-white/90">Regístrate para ganar puntos y conseguir comida gratis.</p>
                        <button className="mt-3 bg-red-600 px-6 py-2 rounded-full font-bold text-sm">Crear cuenta</button>
                    </div>
                    <div className="opacity-30 blur-sm pointer-events-none">
                        <p className="text-[10px] font-bold uppercase mb-1">Bokalia Wallet</p>
                        <p className="text-3xl font-black mb-4">0 pts</p>
                        <div className="h-2 w-full bg-white/20 rounded-full"></div>
                    </div>
                  </div>
                ) : (
                  <div className="relative overflow-hidden rounded-3xl p-6 shadow-xl bg-gradient-to-br from-yellow-400 to-yellow-600 text-yellow-900">
                    <div className="absolute -right-6 -top-6 w-32 h-32 rounded-full bg-white opacity-20"></div>
                    <div className="relative z-10 flex justify-between items-start mb-6">
                      <div>
                        <p className="text-[10px] font-black uppercase tracking-widest mb-1 opacity-80">Bokalia Wallet</p>
                        <p className="text-4xl font-black tracking-tighter">{userProfile.puntos || 0} <span className="text-lg font-medium opacity-80">pts</span></p>
                      </div>
                      <div className="bg-white/30 px-3 py-1 rounded-full text-xs font-black uppercase shadow-sm">
                        {(userProfile.puntos||0) > 500 ? 'VIP ORO' : 'VIP BRONCE'}
                      </div>
                    </div>
                    <div className="relative z-10">
                      <div className="flex justify-between text-xs font-black opacity-80 mb-2">
                        <span>Próximo Goal: Burger Gratis</span>
                        <span>{userProfile.puntos || 0} / 1500</span>
                      </div>
                      <div className="h-3 w-full bg-black/10 rounded-full overflow-hidden shadow-inner">
                        <div className="h-full bg-white rounded-full transition-all duration-1000" style={{ width: `${Math.min(((userProfile.puntos||0)/1500)*100, 100)}%` }}></div>
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {/* MESA COMPARTIDA AVISO (TRICOUNT) */}
              {showJoinPrompt && (
                <div className="bg-yellow-400 p-5 mx-4 mt-2 mb-6 rounded-3xl shadow-lg text-center">
                  <h3 className="font-black text-2xl text-red-900 mb-1">¡Mesa Ocupada!</h3>
                  <p className="text-sm text-red-800 mb-4 font-bold">Abierta por <b>{hostName}</b>. ¿Es tu grupo?</p>
                  <button onClick={() => setShowJoinPrompt(false)} className="w-full bg-white text-red-900 font-black py-4 rounded-2xl shadow-sm text-lg active:scale-95 transition-transform">Sí, unirme a su cuenta</button>
                </div>
              )}

              <div className="p-4">
                {/* UPSELLING */}
                {ultimoPedido && (
                  <div className="bg-gradient-to-r from-orange-500 to-red-500 p-1.5 rounded-[2rem] shadow-lg mb-8">
                    <div className="bg-white/10 backdrop-blur-sm rounded-[1.7rem] p-4 flex items-center justify-between border border-white/20">
                      <div>
                        <span className="bg-yellow-400 text-yellow-900 text-[10px] font-black px-2 py-1 rounded uppercase shadow-sm">Pídelo de nuevo</span>
                        <p className="text-white font-black text-xl mt-1 leading-tight">{ultimoPedido.nombre}</p>
                      </div>
                      <button onClick={() => setCarrito([...carrito, { ...ultimoPedido, idUnico: Math.random() }])} className="bg-white text-red-600 font-black py-3 px-5 rounded-xl shadow-lg active:scale-95 transition-transform text-sm">
                        + Añadir
                      </button>
                    </div>
                  </div>
                )}

                <h2 className="text-2xl font-black text-gray-800 mb-4 ml-1">La Carta</h2>
                
                {/* PRODUCTOS */}
                <div className="grid grid-cols-2 gap-3 mb-8">
                  {productos.map(p => (
                    <div key={p.id} className="bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100 flex flex-col">
                      <div className="h-32 bg-gray-200"><img src={p.imagen_url} className="w-full h-full object-cover" /></div>
                      <div className="p-4 flex flex-col flex-grow">
                        <h3 className="font-black text-gray-800 text-sm leading-tight">{p.nombre}</h3>
                        <p className="text-orange-500 font-black mt-1 mb-3 text-lg">{p.precio}€</p>
                        <button onClick={() => setCarrito([...carrito, { ...p, idUnico: Math.random() }])} className="mt-auto w-full bg-red-50 text-red-600 font-black py-3 rounded-xl text-sm active:bg-red-600 active:text-white transition-colors">Añadir</button>
                      </div>
                    </div>
                  ))}
                </div>

                {/* CESTA GRUPAL */}
                {rondas.length > 0 && (
                  <div className="mb-8">
                    <div className="flex justify-between items-center mb-4 ml-1">
                      <h2 className="text-xl font-black text-gray-800 flex items-center gap-2">
                        <div className="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.8)]"></div>
                        Mesa en directo
                      </h2>
                      {sesionActiva.estado === 'activa' && (
                        <button onClick={pedirCuenta} className="bg-gray-900 text-white text-xs font-black px-4 py-3 rounded-xl shadow-lg active:bg-black">Pedir Cuenta</button>
                      )}
                    </div>
                    {rondas.map((ronda, i) => (
                      <div key={ronda.id} className="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 mb-3">
                        <div className="flex justify-between items-center border-b border-gray-100 pb-3 mb-3">
                          <p className="font-black text-gray-400 text-sm uppercase">Ronda #{i+1}</p>
                          <span className="text-[10px] font-black text-orange-600 bg-orange-100 px-2 py-1 rounded uppercase tracking-widest">{ronda.estado}</span>
                        </div>
                        <ul className="text-sm text-gray-700 space-y-3">
                          {ronda.items?.map((item, idx) => (
                            <li key={idx} className="flex gap-3 font-bold items-center text-base"><span className="bg-gray-100 text-red-600 w-8 h-8 flex items-center justify-center rounded-lg">{item.cantidad}x</span>{item.producto?.nombre}</li>
                          ))}
                        </ul>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* CARRITO INDIVIDUAL FLOTANTE */}
          {carrito.length > 0 && vistaActual === 'mesa' && (
            <div className="fixed bottom-0 left-0 w-full bg-
