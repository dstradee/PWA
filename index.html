<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bokalia - Pide desde tu mesa</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style> body { font-family: system-ui, sans-serif; background: #f9fafb; margin: 0; } </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- CREDENCIALES ---
    const supabase = window.supabase.createClient(
      'https://bswlriuzeintgjioywtz.supabase.co',
      'sb_publishable_oIWpn-mNPUZaQPdf7HNU_Q_Lc7R6UOB'
    );

    function App() {
      const [vistaActual, setVistaActual] = useState('mesa'); // 'mesa' | 'reservas'
      const [mesaParam, setMesaParam] = useState(null);
      const [user, setUser] = useState(null);
      const [userProfile, setUserProfile] = useState(null);
      const [productos, setProductos] = useState([]);
      const [sesionActiva, setSesionActiva] = useState(null);
      const [hostName, setHostName] = useState('');
      const [rondas, setRondas] = useState([]);
      const [carrito, setCarrito] = useState([]);
      
      // Nuevos Features
      const [ultimoPedido, setUltimoPedido] = useState(null);
      const [showReviewModal, setShowReviewModal] = useState(false);
      const [showJoinPrompt, setShowJoinPrompt] = useState(false);
      
      // Estado UI general
      const [loading, setLoading] = useState(true);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const mesa = urlParams.get('mesa');
        if (mesa) setMesaParam(parseInt(mesa));

        cargarMenu();

        supabase.auth.getSession().then(({ data }) => {
          if (data?.session?.user) procesarUsuario(data.session.user);
          else setLoading(false);
        });

        const { data: authListener } = supabase.auth.onAuthStateChange((_, session) => {
          if(session?.user) procesarUsuario(session.user);
          else { setUser(null); setUserProfile(null); }
        });

        return () => { if (authListener?.subscription) authListener.subscription.unsubscribe(); };
      }, []);

      useEffect(() => {
        if (mesaParam) verificarSesionMesa();
      }, [mesaParam, user]);

      // REALTIME: Escuchar cambios en la mesa y rondas
      useEffect(() => {
        if (sesionActiva) {
          cargarRondasMesa(sesionActiva.id);
          
          const channel = supabase.channel(`mesa_${sesionActiva.id}`)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos_rondas' }, () => {
              cargarRondasMesa(sesionActiva.id);
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sesiones_mesa', filter: `id=eq.${sesionActiva.id}` }, (payload) => {
              // EL SECUESTRADOR DE RESEÑAS: Si el estado cambia a pagada, esperamos 5 seg y lanzamos modal
              if (payload.new.estado === 'pagada') {
                setTimeout(() => setShowReviewModal(true), 5000); 
              }
            })
            .subscribe();
          return () => supabase.removeChannel(channel);
        }
      }, [sesionActiva]);

      // --- LOGICA DE BASE DE DATOS ---

      const procesarUsuario = async (authUser) => {
        setUser(authUser);
        // Comprobar si existe en tabla usuarios para los puntos, si no, lo creamos
        let { data } = await supabase.from('usuarios').select('*').eq('id', authUser.id).single();
        if (!data) {
          const { data: newUser } = await supabase.from('usuarios')
            .insert([{ id: authUser.id, email: authUser.email, puntos: 50 }]) // Regalamos 50 pts de bienvenida
            .select().single();
          data = newUser;
        }
        setUserProfile(data);
        buscarUltimoPedido(authUser.id);
        setLoading(false);
      };

      const cargarMenu = async () => {
        const { data } = await supabase.from('productos').select('*').eq('activo', true);
        if (data) setProductos(data);
      };

      const buscarUltimoPedido = async (userId) => {
        // Buscamos la última ronda de este usuario
        const { data: ultimasRondas } = await supabase.from('pedidos_rondas')
          .select('id').eq('usuario_id', userId).order('fecha', { ascending: false }).limit(1);
        
        if (ultimasRondas && ultimasRondas.length > 0) {
          const { data: items } = await supabase.from('items_pedido')
            .select('producto_id, producto:productos(*)').eq('ronda_id', ultimasRondas[0].id).limit(1);
          if (items && items.length > 0) setUltimoPedido(items[0].producto);
        }
      };

      const verificarSesionMesa = async () => {
        const { data } = await supabase.from('sesiones_mesa')
          .select('*, host:usuarios(nombre, email)').eq('num_mesa', mesaParam).neq('estado', 'pagada').maybeSingle();
        
        if (data) {
          if (user && data.host_id !== user.id) {
            // Ya hay mesa creada y yo no soy el host
            setHostName(data.host?.nombre || data.host?.email || 'Un amigo');
            setShowJoinPrompt(true);
            setSesionActiva(data);
          } else {
            // Soy el host o no estoy logueado (puedo ver los pedidos)
            setSesionActiva(data);
          }
        }
      };

      const cargarRondasMesa = async (idSesion) => {
        const { data } = await supabase.from('pedidos_rondas')
          .select('*, items:items_pedido(*, producto:productos(nombre))').eq('sesion_id', idSesion);
        if (data) setRondas(data);
      };

      const handleLogin = async (esRegistro) => {
        const { error } = esRegistro
          ? await supabase.auth.signUp({ email, password })
          : await supabase.auth.signInWithPassword({ email, password });
        if (error) alert(error.message);
        else setShowAuthModal(false);
      };

      const añadirAlCarrito = (producto) => {
        if (!user) return setShowAuthModal(true);
        setCarrito([...carrito, { ...producto, idUnico: Math.random() }]);
      };

      const enviarPedido = async () => {
        if (carrito.length === 0) return;
        let idDeSesion = sesionActiva?.id;

        if (!idDeSesion) {
          const { data: nuevaSesion } = await supabase.from('sesiones_mesa')
            .insert([{ num_mesa: mesaParam, host_id: user.id, estado: 'activa' }]).select().single();
          idDeSesion = nuevaSesion.id;
          setSesionActiva(nuevaSesion);
        }

        const { data: ronda } = await supabase.from('pedidos_rondas')
          .insert([{ sesion_id: idDeSesion, usuario_id: user.id }]).select().single();

        if (ronda) {
          const conteo = {};
          carrito.forEach(p => { conteo[p.id] = (conteo[p.id] || 0) + 1; });
          const itemsInsert = Object.keys(conteo).map(id => ({
            ronda_id: ronda.id, producto_id: id, cantidad: conteo[id], precio_unitario: carrito.find(p => p.id === id).precio
          }));
          await supabase.from('items_pedido').insert(itemsInsert);
          
          // Sumar puntos de fidelización
          const totalGastado = carrito.reduce((sum, p) => sum + p.precio, 0);
          const puntosGanados = Math.floor(totalGastado * 2); // 2 puntos por Euro
          await supabase.from('usuarios').update({ puntos: (userProfile?.puntos || 0) + puntosGanados }).eq('id', user.id);
          procesarUsuario(user); // refrescar perfil local
          
          setCarrito([]);
          cargarRondasMesa(idDeSesion);
        }
      };

      const pedirCuenta = async () => {
        if (!sesionActiva) return;
        await supabase.from('sesiones_mesa').update({ estado: 'pagando' }).eq('id', sesionActiva.id);
        alert("El camarero ha sido notificado y trae la cuenta.");
        // Simulamos que el camarero cobra y cierra la mesa tras 10 seg
        setTimeout(async () => {
          await supabase.from('sesiones_mesa').update({ estado: 'pagada' }).eq('id', sesionActiva.id);
        }, 5000); 
      };

      // --- COMPONENTES AUXILIARES ---

      const UserHeader = () => {
        if (!userProfile) return null;
        let vipLvl = "Bronce"; let color = "bg-orange-600";
        if (userProfile.puntos > 100) { vipLvl = "Plata"; color = "bg-gray-400"; }
        if (userProfile.puntos > 500) { vipLvl = "Oro"; color = "bg-yellow-400 text-yellow-900"; }

        return (
          <div className="bg-white p-3 mx-4 mt-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
            <div>
              <p className="text-sm font-bold text-gray-800">Hola, {userProfile.nombre || user.email.split('@')[0]}</p>
              <p className="text-xs text-gray-500">{userProfile.puntos} puntos acumulados</p>
            </div>
            <div className={`${color} text-white text-xs font-black px-3 py-1.5 rounded-full uppercase tracking-wider`}>
              VIP {vipLvl}
            </div>
          </div>
        );
      };

      const ReviewModal = () => {
        const [rating, setRating] = useState(0);
        const [msg, setMsg] = useState('');
        const [submitted, setSubmitted] = useState(false);

        const handleReview = async () => {
          if (rating <= 3) {
            await supabase.from('resenas_internas').insert([{ usuario_id: user?.id, puntuacion: rating, mensaje_privado: msg }]);
            setSubmitted(true);
            setTimeout(() => setShowReviewModal(false), 2000);
          } else {
            // Es 4 o 5, lo mandamos a Google Maps
            window.open('https://maps.google.com', '_blank');
            setShowReviewModal(false);
          }
        };

        if (!showReviewModal) return null;

        return (
          <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl p-6 w-full max-w-sm text-center">
              {submitted ? (
                <div>
                  <h3 className="text-2xl font-black text-green-500 mb-2">¡Gracias!</h3>
                  <p className="text-gray-600">Tomaremos nota para mejorar.</p>
                </div>
              ) : (
                <div>
                  <h3 className="text-2xl font-black text-gray-800 mb-2">¿Qué tal tu comida?</h3>
                  <p className="text-sm text-gray-500 mb-6">Valora tu experiencia en Bokalia</p>
                  <div className="flex justify-center gap-2 mb-6">
                    {[1,2,3,4,5].map(star => (
                      <button key={star} onClick={() => setRating(star)} className={`text-4xl ${rating >= star ? 'text-yellow-400' : 'text-gray-200'}`}>★</button>
                    ))}
                  </div>
                  
                  {rating > 0 && rating <= 3 && (
                    <textarea 
                      placeholder="¿Qué podemos mejorar? (Tu opinión nos ayuda mucho)" 
                      value={msg} onChange={e => setMsg(e.target.value)}
                      className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm mb-4 h-24 outline-none"
                    />
                  )}

                  {rating > 0 && (
                    <button onClick={handleReview} className="w-full bg-red-600 text-white font-black py-3 rounded-xl">
                      {rating >= 4 ? "¡Dejar reseña en Google!" : "Enviar feedback confidencial"}
                    </button>
                  )}
                  <button onClick={() => setShowReviewModal(false)} className="mt-4 text-xs font-bold text-gray-400">Saltar por ahora</button>
                </div>
              )}
            </div>
          </div>
        );
      };

      // --- VISTA: RESERVAS ---
      if (vistaActual === 'reservas') {
        return (
          <div className="min-h-screen bg-gray-50">
            <header className="bg-red-600 text-white p-4 flex gap-4">
              <button onClick={() => setVistaActual('mesa')} className="font-bold text-red-200 hover:text-white">← Volver al Menú</button>
              <h1 className="font-black text-yellow-400">BOKALIA RESERVAS</h1>
            </header>
            <div className="p-8 text-center mt-12">
              <div className="text-5xl mb-4">📅</div>
              <h2 className="text-2xl font-black text-gray-800 mb-2">Módulo de reservas en construcción</h2>
              <p className="text-gray-500">Pronto podrás reservar tu mesa favorita directamente desde aquí.</p>
              {/* TODO: Insertar aquí código del sistema externo */}
            </div>
          </div>
        );
      }

      // --- VISTA PRINCIPAL (MESA) ---

      if (loading) return <div className="h-screen flex items-center justify-center font-bold text-red-600">Cargando...</div>;

      if (!mesaParam) return (
        <div className="min-h-screen bg-yellow-50 flex flex-col justify-center items-center p-6 text-center">
          <div className="bg-white p-8 rounded-3xl shadow-xl w-full">
            <h1 className="text-4xl font-black text-red-600 mb-6">BOKALIA</h1>
            <input type="number" id="inputMesa" className="text-center text-4xl font-black w-full p-4 rounded-2xl border-4 border-red-200 mb-6 outline-none focus:border-red-500" placeholder="Mesa nº" />
            <button onClick={() => window.location.search = `?mesa=${document.getElementById('inputMesa').value}`} className="w-full bg-red-600 text-white font-black py-4 rounded-2xl text-xl">Entrar a la mesa</button>
          </div>
        </div>
      );

      return (
        <div className="pb-32 bg-gray-50 min-h-screen">
          <header className="bg-red-600 text-white p-4 sticky top-0 z-10 shadow-md">
            <div className="flex justify-between items-center mb-3">
              <h1 className="font-black text-2xl text-yellow-400">BOKALIA</h1>
              {user ? <button onClick={() => supabase.auth.signOut()} className="text-xs bg-red-800 px-2 py-1 rounded">Salir</button> 
                    : <button onClick={() => setShowAuthModal(true)} className="text-sm font-bold bg-yellow-400 text-red-900 px-3 py-1 rounded">Entrar</button>}
            </div>
            {/* Navegación de Pestañas */}
            <div className="flex gap-4 border-t border-red-500 pt-3">
              <button className="font-bold text-white border-b-2 border-white pb-1">Mesa {mesaParam}</button>
              <button onClick={() => setVistaActual('reservas')} className="font-bold text-red-200 hover:text-white pb-1">Reservas</button>
            </div>
          </header>

          <UserHeader />

          {/* Modal para Unirse a la mesa (Tricount style) */}
          {showJoinPrompt && (
            <div className="bg-yellow-400 p-4 m-4 rounded-2xl text-red-900 shadow-md border-2 border-yellow-500">
              <h3 className="font-black mb-1">¡Mesa Ocupada!</h3>
              <p className="text-sm mb-3">Esta mesa fue abierta por <b>{hostName}</b>. ¿Es tu grupo?</p>
              <button onClick={() => setShowJoinPrompt(false)} className="w-full bg-white text-red-900 font-bold py-2 rounded-xl">Sí, unirme a esta mesa</button>
            </div>
          )}

          <div className="p-4 max-w-2xl mx-auto">
            
            {/* UPSELLING INTELIGENTE */}
            {ultimoPedido && (
              <div className="bg-orange-500 p-4 rounded-2xl shadow-lg mb-6 flex items-center justify-between border-2 border-orange-400">
                <div>
                  <p className="text-white text-xs font-bold uppercase tracking-wider mb-1">¡Pídelo de nuevo!</p>
                  <p className="text-white font-black text-lg">{ultimoPedido.nombre}</p>
                </div>
                <button onClick={() => añadirAlCarrito(ultimoPedido)} className="bg-yellow-400 text-orange-900 font-black py-2 px-4 rounded-xl shadow-sm hover:scale-105 transition-transform">
                  + {ultimoPedido.precio}€
                </button>
              </div>
            )}

            <h2 className="text-2xl font-black text-gray-800 mb-4">La Carta</h2>
            
            {productos.length === 0 && <p className="text-red-500 font-bold">No hay productos. (Comprueba el RLS en Supabase).</p>}
            
            <div className="grid grid-cols-2 gap-4 mb-8">
              {productos.map(p => (
                <div key={p.id} className="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col">
                  <div className="h-32 bg-gray-200"><img src={p.imagen_url} className="w-full h-full object-cover" /></div>
                  <div className="p-3 flex flex-col flex-grow">
                    <h3 className="font-bold text-gray-800 text-sm leading-tight">{p.nombre}</h3>
                    <p className="text-orange-500 font-black mt-1 mb-3">{p.precio}€</p>
                    <button onClick={() => añadirAlCarrito(p)} className="mt-auto w-full bg-red-50 text-red-600 font-bold py-2 rounded-xl text-sm">Añadir</button>
                  </div>
                </div>
              ))}
            </div>

            {/* CESTA GRUPAL (MESA COMPARTIDA) */}
            {rondas.length > 0 && (
              <div className="mb-8">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-xl font-black text-gray-800">Consumo de la mesa</h2>
                  {sesionActiva.estado === 'activa' && (
                    <button onClick={pedirCuenta} className="bg-gray-800 text-white text-xs font-bold px-3 py-2 rounded-lg">Pedir Cuenta</button>
                  )}
                </div>
                {rondas.map((ronda, i) => (
                  <div key={ronda.id} className="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-yellow-400 mb-3">
                    <div className="flex justify-between border-b border-gray-100 pb-2 mb-2">
                      <p className="font-black text-gray-700">Ronda #{i+1}</p>
                      <span className="text-xs font-bold text-orange-600 bg-orange-100 px-2 py-1 rounded uppercase">{ronda.estado}</span>
                    </div>
                    <ul className="text-sm text-gray-600 space-y-1">
                      {ronda.items?.map(item => (
                        <li key={item.id}><span className="font-black text-red-500 mr-2">{item.cantidad}x</span>{item.producto?.nombre}</li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* CARRITO INDIVIDUAL FLOTANTE */}
          {carrito.length > 0 && (
            <div className="fixed bottom-0 left-0 w-full bg-white p-4 shadow-[0_-15px_30px_-5px_rgba(0,0,0,0.15)] z-20">
              <div className="flex justify-between items-center max-w-2xl mx-auto">
                <div>
                  <p className="text-xs font-bold text-gray-400 uppercase tracking-wider">Tu pedido</p>
                  <p className="text-2xl font-black text-gray-800">{carrito.length} prod.</p>
                </div>
                <button onClick={enviarPedido} className="bg-green-500 text-white font-black py-4 px-8 rounded-2xl shadow-xl text-lg flex items-center gap-2">
                  Enviar a Cocina
                </button>
              </div>
            </div>
          )}

          {/* MODAL AUTH */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex justify-center items-center p-4">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm relative">
                <button onClick={() => setShowAuthModal(false)} className="absolute top-4 right-4 text-gray-400">✕</button>
                <h3 className="text-2xl font-black mb-4">Inicia sesión</h3>
                <input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full mb-3 p-4 bg-gray-100 rounded-xl outline-none" />
                <input type="password" placeholder="Contraseña" value={password} onChange={e => setPassword(e.target.value)} className="w-full mb-6 p-4 bg-gray-100 rounded-xl outline-none" />
                <div className="flex gap-2">
                  <button onClick={() => handleLogin(false)} className="flex-1 bg-orange-500 text-white font-bold py-3 rounded-xl">Entrar</button>
                  <button onClick={() => handleLogin(true)} className="flex-1 bg-yellow-400 text-red-900 font-bold py-3 rounded-xl">Registro</button>
                </div>
              </div>
            </div>
          )}
          
          <ReviewModal />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
