<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bokalia - Pide desde tu mesa</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 🔥 IDENTIDAD VISUAL BOKALIA 🔥 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bokalia: {
              coral: '#e25e4c',  
              cream: '#fdfbf7',  
              beige: '#f4ede5',  
              dark: '#302b28'    
            }
          },
          boxShadow: {
            'elegant': '0 8px 30px rgba(0, 0, 0, 0.04)',
            'elegant-lg': '0 15px 40px rgba(0, 0, 0, 0.06)',
          }
        }
      }
    }
  </script>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #f4ede5; margin: 0; -webkit-tap-highlight-color: transparent; }
    @keyframes slideUp { from { transform: translate3d(0, 100%, 0); } to { transform: translate3d(0, 0, 0); } }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translate3d(0, -10px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
    .animate-fade-in { animation: fadeIn 0.2s ease forwards; }
    .mobile-container { transform: translate(0); }
    
    .bg-texture {
       background-color: #fdfbf7;
       background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23e25e4c' fill-opacity='0.02' fill-rule='evenodd'%3E%3Ccircle cx='3' cy='3' r='1'/%3E%3Ccircle cx='13' cy='13' r='1'/%3E%3C/g%3E%3C/svg%3E");
    }
  </style>
</head>
<body class="flex justify-center min-h-screen">
  
  <div id="root" class="w-full max-w-md bg-texture min-h-screen relative overflow-x-hidden shadow-2xl mobile-container pb-40">
    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; color:#e25e4c;">
      <h1 style="font-size:3rem; font-weight:900; margin:0; letter-spacing:-2px;">BOKALIA</h1>
      <p style="font-weight:bold; margin-top:10px; opacity:0.7;">Conectando a tu mesa...</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const RESTAURANTE_ID = 'a5f65b60-0a06-4ed3-9c40-fbbf5f85901a';

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) return (
            <div className="p-8 flex flex-col items-center justify-center min-h-screen bg-bokalia-cream text-center">
              <div className="text-6xl mb-4">🚨</div>
              <h1 className="text-2xl font-black text-bokalia-coral mb-2">Error Crítico</h1>
              <p className="text-bokalia-dark text-sm mb-6">{this.state.error.toString()}</p>
              <button onClick={() => window.location.reload()} className="bg-bokalia-coral text-white font-bold py-3 px-6 rounded-xl">Recargar App</button>
            </div>
        );
        return this.props.children;
      }
    }

    const supabase = window.supabase.createClient(
      'https://bswlriuzeintgjioywtz.supabase.co',
      'sb_publishable_oIWpn-mNPUZaQPdf7HNU_Q_Lc7R6UOB',
      { auth: { persistSession: true, storage: window.localStorage, autoRefreshToken: true } }
    );

    function MainApp() {
      // ESTADOS EXACTAMENTE IGUALES AL CÓDIGO ORIGINAL
      const [mesaParam, setMesaParam] = useState(null);
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      
      const [productos, setProductos] = useState([]);
      const [sesionActiva, setSesionActiva] = useState(null);
      const [mesaBloqueada, setMesaBloqueada] = useState(false);
      const [hostName, setHostName] = useState('');
      
      const [rondasBorrador, setRondasBorrador] = useState([]); 
      const [rondasEnviadas, setRondasEnviadas] = useState([]); 
      const [productoPendiente, setProductoPendiente] = useState(null);
      
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login'); 
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      
      const [showModoMesa, setShowModoMesa] = useState(false);
      const [showJoinPrompt, setShowJoinPrompt] = useState(false);
      const [showReviewModal, setShowReviewModal] = useState(false);
      const [showTicketModal, setShowTicketModal] = useState(false);
      
      const [datosTicket, setDatosTicket] = useState({ subtotal: 0, puntosGanados: 0, items: [] });
      const [toastMsg, setToastMsg] = useState('');

      const channelRef = useRef(null);
      const ticketProcesadoRef = useRef(false);

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const mesa = urlParams.get('mesa');
        if (mesa) setMesaParam(parseInt(mesa));

        cargarMenu();

        supabase.auth.getSession().then(({ data }) => {
          if (data?.session?.user) procesarUsuario(data.session.user);
          else setAuthLoading(false);
        }).catch(() => setAuthLoading(false));

        const { data: authListener } = supabase.auth.onAuthStateChange((_, session) => {
          if(session?.user) procesarUsuario(session.user);
          else { setUser(null); setAuthLoading(false); }
        });

        return () => { if (authListener?.subscription) authListener.subscription.unsubscribe(); };
      }, []);

      useEffect(() => {
        if (!mesaParam || authLoading) return;
        verificarSesionMesa();

        const globalChannel = supabase.channel(`vigilante_mesa_${mesaParam}`)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'sesiones_mesa' }, () => {
             verificarSesionMesa();
          }).subscribe();

        return () => supabase.removeChannel(globalChannel);
      }, [mesaParam, user, authLoading, sesionActiva]);

      useEffect(() => {
        if (sesionActiva) {
          cargarRondasMesa(sesionActiva.id);
          
          channelRef.current = supabase.channel(`db_sync_mesa_${sesionActiva.id}`)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos_rondas', filter: `sesion_id=eq.${sesionActiva.id}` }, () => {
               cargarRondasMesa(sesionActiva.id);
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'items_pedido' }, () => {
               cargarRondasMesa(sesionActiva.id);
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sesiones_mesa', filter: `id=eq.${sesionActiva.id}` }, async (payload) => {
               // 🔥 EL SABUESO ORIGINAL (Funciona perfecto)
               const { data: checkMesa } = await supabase.from('sesiones_mesa').select('estado').eq('id', sesionActiva.id).single();
               if (checkMesa && checkMesa.estado === 'pagada') {
                  cargarTicketFinal(sesionActiva.id);
               }
            })
            .subscribe();

          return () => { if (channelRef.current) supabase.removeChannel(channelRef.current); };
        }
      }, [sesionActiva, user]);

      useEffect(() => {
         if (user && productoPendiente && !authLoading) {
            if (!sesionActiva) {
               setShowModoMesa(true);
            } else {
               ejecutarAñadirDB(sesionActiva.id, productoPendiente);
               setProductoPendiente(null);
            }
         }
      }, [user, productoPendiente, authLoading, sesionActiva]);

      const procesarUsuario = async (authUser) => {
        setUser(authUser);
        try {
          let { data: userDb } = await supabase.from('usuarios').select('id').eq('id', authUser.id).maybeSingle();
          if (!userDb) await supabase.from('usuarios').insert([{ id: authUser.id, email: authUser.email }]);
        } catch(e) { console.warn(e); }
        setAuthLoading(false);
      };

      const cargarMenu = async () => {
        const { data, error } = await supabase.from('productos')
            .select('*').eq('restaurante_id', RESTAURANTE_ID).eq('activo', true);
        if (data) setProductos(data);
      };

      // 🔥 LÓGICA VIGILANTE ORIGINAL Y ESTABLE 🔥
      const verificarSesionMesa = async () => {
        const { data } = await supabase.from('sesiones_mesa')
          .select('*, host:usuarios(nombre, email)').eq('num_mesa', mesaParam).eq('restaurante_id', RESTAURANTE_ID).neq('estado', 'pagada').maybeSingle();
        
        if (data) {
          if (!user || data.host_id !== user?.id) {
            if (data.compartida === false) {
              setMesaBloqueada(true); setShowJoinPrompt(false);
            } else {
              const yaAcepto = window.sessionStorage.getItem(`unido_mesa_${mesaParam}`);
              if (!yaAcepto) {
                setHostName(data.host?.nombre || data.host?.email?.split('@')[0] || 'Alguien');
                setShowJoinPrompt(true); setMesaBloqueada(false);
              } else {
                setSesionActiva(data); setShowJoinPrompt(false); setMesaBloqueada(false);
              }
            }
          } else {
            setMesaBloqueada(false); setShowJoinPrompt(false); setSesionActiva(data);
          }
        } else {
          setSesionActiva(null); setMesaBloqueada(false); setShowJoinPrompt(false);
        }
      };

      const aceptarUnirse = () => {
         window.sessionStorage.setItem(`unido_mesa_${mesaParam}`, 'true');
         setShowJoinPrompt(false);
         verificarSesionMesa();
      };

      const cargarRondasMesa = async (idSesion) => {
        const { data } = await supabase.from('pedidos_rondas')
          .select('*, items:items_pedido(id, cantidad, precio_unitario, producto_id, producto:productos(nombre, precio)), usuario:usuarios(nombre, email)')
          .eq('sesion_id', idSesion).order('fecha', { ascending: true });
          
        if (data) {
           const borradores = data.filter(r => (r.estado === 'pendiente' || r.estado === 'listo') && r.items.length > 0);
           setRondasBorrador(borradores);
           const enviados = data.filter(r => r.estado === 'enviado' || r.estado === 'preparando' || r.estado === 'servido');
           setRondasEnviadas(enviados);
        }
      };

      const handleAuth = async () => {
        setAuthLoading(true);
        const { error } = authMode === 'register' ? await supabase.auth.signUp({ email, password }) : await supabase.auth.signInWithPassword({ email, password });
        if (error) { setAuthLoading(false); alert("Error: " + error.message); }
        else setShowAuthModal(false); 
      };

      const intentarAñadirAlCarrito = (producto) => {
        if (!user) { 
           setProductoPendiente(producto);
           setAuthMode('register'); 
           return setShowAuthModal(true); 
        }
        if (!sesionActiva) {
           setProductoPendiente(producto);
           return setShowModoMesa(true);
        }
        ejecutarAñadirDB(sesionActiva.id, producto);
      };

      const ejecutarAñadirDB = async (idSesion, producto) => {
         try {
            let { data: ronda, error: errRonda } = await supabase.from('pedidos_rondas')
               .select('id, estado').eq('sesion_id', idSesion).eq('usuario_id', user.id).in('estado', ['pendiente', 'listo']).maybeSingle();

            if (errRonda) throw new Error("Error buscando ronda: " + errRonda.message);

            if (!ronda) {
               const { data: newRonda, error: errNew } = await supabase.from('pedidos_rondas')
                  .insert([{ sesion_id: idSesion, usuario_id: user.id, estado: 'pendiente' }]).select().single();
               if(errNew) throw new Error("Error creando ronda: " + errNew.message);
               ronda = newRonda;
            } else if (ronda.estado === 'listo') {
               await supabase.from('pedidos_rondas').update({ estado: 'pendiente' }).eq('id', ronda.id);
            }
            
            const { error: errItem } = await supabase.from('items_pedido').insert([{
               ronda_id: ronda.id, producto_id: producto.id, cantidad: 1, precio_unitario: producto.precio
            }]);
            if(errItem) throw new Error("Error insertando item: " + errItem.message);
            
            cargarRondasMesa(idSesion); 
            mostrarToast(`Añadido: ${producto.nombre} 🛒`);
         } catch(e) { alert(e.message); }
      };

      const eliminarItemBorrador = async (itemId) => {
         await supabase.from('items_pedido').delete().eq('id', itemId);
         if(sesionActiva) cargarRondasMesa(sesionActiva.id);
      };

      const procesarCrearMesaYPedir = async (esCompartida) => {
        setShowModoMesa(false);
        try {
           const { data, error } = await supabase.from('sesiones_mesa').insert([{ 
              restaurante_id: RESTAURANTE_ID, num_mesa: mesaParam, host_id: user.id, estado: 'activa', compartida: esCompartida 
           }]).select().single();
           if(error) throw new Error("Fallo creando mesa: " + error.message);
           setSesionActiva(data);
        } catch(e) { alert(e.message); }
      };

      const enviarACocinaDB = async () => {
         if (!sesionActiva || !user) return;
         const miRonda = rondasBorrador.find(r => r.usuario_id === user.id);
         if (!miRonda) return;

         try {
            const { error } = await supabase.from('pedidos_rondas')
               .update({estado: 'enviado', fecha: new Date().toISOString()})
               .eq('id', miRonda.id);
               
            if(error) throw new Error(error.message);
            mostrarToast("¡Enviado a cocina! 🚀");
            cargarRondasMesa(sesionActiva.id);
         } catch(e) { alert("Error al mandar a cocina: " + e.message); }
      };

      const pedirCuenta = async () => {
        if (!sesionActiva) return;
        await supabase.from('sesiones_mesa').update({ estado: 'pagando' }).eq('id', sesionActiva.id);
        mostrarToast("El camarero trae la cuenta. ¡Avisado! 💸");
      };

      // 🔥 CARGA ORIGINAL DEL TICKET (Funciona perfecto)
      const cargarTicketFinal = async (idSesion) => {
         if (ticketProcesadoRef.current) return;
         ticketProcesadoRef.current = true;

         try {
            if (!user) return finalizarYSalir();

            const { data: misRondas } = await supabase.from('pedidos_rondas').select('id').eq('sesion_id', idSesion).eq('usuario_id', user.id).in('estado', ['enviado', 'preparando', 'servido']);
            let totalGastado = 0;
            let misItems = [];
            
            if (misRondas && misRondas.length > 0) {
               const rondasIds = misRondas.map(r => r.id);
               const { data: items } = await supabase.from('items_pedido').select('cantidad, precio_unitario, producto:productos(nombre)').in('ronda_id', rondasIds);
               if (items) {
                  misItems = items;
                  items.forEach(i => { totalGastado += (parseFloat(i.precio_unitario || 0) * parseInt(i.cantidad || 1)); });
               }
            }
            
            const puntosGanadosVisuales = Math.floor(totalGastado * 100);
            setDatosTicket({ subtotal: totalGastado, puntosGanados: puntosGanadosVisuales, items: misItems });
            setShowTicketModal(true);
         } catch (e) {
            console.error(e);
            setShowReviewModal(true); 
         }
      };

      // 🔥 LA SALIDA DIRECTA ORIGINAL
      const finalizarYSalir = () => {
         window.location.href = 'perfil.html'; 
      };

      const formatMoney = (num) => Number(num).toFixed(2);
      const formatDate = (dateStr) => {
        const d = new Date(dateStr);
        return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
      };
      
      const mostrarToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 4000); };

      // ==========================================
      // UI Y VISTAS (DISEÑO BOKALIA APLICADO)
      // ==========================================

      if (authLoading) return (
        <div className="h-screen flex items-center justify-center bg-texture flex-col">
           <div className="w-16 h-16 border-4 border-bokalia-beige border-t-bokalia-coral rounded-full animate-spin mb-6"></div>
           <h2 className="text-xl font-bold text-bokalia-coral tracking-tight animate-pulse">Cargando Bokalia...</h2>
        </div>
      );

      if (mesaBloqueada && mesaParam) {
        return (
          <div className="min-h-screen bg-bokalia-dark flex flex-col justify-center items-center p-8 text-center text-white animate-fade-in z-50 absolute w-full h-full">
            <div className="text-8xl mb-8 opacity-80">🔒</div>
            <h1 className="text-3xl font-black mb-4">Mesa Cerrada</h1>
            <p className="text-gray-400 font-medium text-sm leading-relaxed mb-12">El host de esta mesa ha seleccionado <b className="text-white">Cuenta Única</b>. No se admiten más móviles conectados a esta mesa.</p>
            <button onClick={() => window.location.href='perfil.html'} className="w-full bg-white text-bokalia-dark font-bold py-4 rounded-2xl shadow-xl">Ir a mi Perfil</button>
          </div>
        );
      }

      if (!mesaParam) return (
        <div className="min-h-screen bg-texture flex flex-col justify-center items-center p-6 text-center">
          <div className="bg-white p-10 rounded-[2.5rem] shadow-elegant-lg border border-bokalia-beige w-full">
            <h1 className="text-4xl font-black text-bokalia-coral mb-2 tracking-tighter">BOKALIA</h1>
            <p className="text-gray-500 mb-8 font-medium text-sm">¿En qué mesa te sientas?</p>
            <input type="number" id="inputMesa" className="text-center text-5xl font-black w-full p-4 rounded-2xl bg-bokalia-cream border border-bokalia-beige mb-6 outline-none focus:border-bokalia-coral transition-colors" placeholder="0" />
            <button onClick={() => {
                const num = document.getElementById('inputMesa').value;
                if(num) window.location.search = `?mesa=${num}`;
              }} className="w-full bg-bokalia-coral active:bg-opacity-90 text-white font-bold py-4 rounded-2xl text-lg shadow-lg">
              Empezar
            </button>
            <button onClick={() => window.location.href='perfil.html'} className="mt-8 text-gray-400 font-bold text-sm tracking-widest uppercase">Ir a mi Perfil</button>
          </div>
        </div>
      );

      const miRondaBorrador = rondasBorrador.find(r => r.usuario_id === user?.id);
      const totalItemsMesaPendiente = rondasBorrador.reduce((acc, r) => acc + r.items.length, 0);
      const totalMesaEnviada = rondasEnviadas.reduce((acc, r) => {
         return acc + r.items.reduce((sum, item) => sum + (parseFloat(item.precio_unitario) * parseInt(item.cantidad)), 0);
      }, 0);

      return (
        <div className="pb-36 min-h-screen relative flex flex-col">
          
          {/* 🔥 TOAST ESTILO ORIGINAL, PERO QUE NO BLOQUEA CLICKS 🔥 */}
          {toastMsg && (
            <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-[60] w-11/12 max-w-sm pointer-events-none animate-fade-in flex justify-center">
              <div className="bg-bokalia-dark text-white font-bold px-6 py-4 rounded-2xl shadow-elegant-lg text-center w-full">
                <span>{toastMsg}</span>
              </div>
            </div>
          )}

          {showJoinPrompt && (
            <div className="fixed inset-0 bg-bokalia-dark/80 backdrop-blur-md z-[100] flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-[2.5rem] p-8 w-full max-w-md text-center shadow-2xl animate-slide-up border border-bokalia-beige">
                <div className="text-6xl mb-4">👋</div>
                <h3 className="text-2xl font-black text-bokalia-dark mb-2 tracking-tight">Mesa de {hostName}</h3>
                <p className="text-gray-500 font-medium text-sm mb-8">Esta mesa ya está abierta. ¿Estás en su grupo?</p>
                <button onClick={aceptarUnirse} className="w-full bg-bokalia-coral text-white font-bold py-4 rounded-2xl shadow-lg mb-4 active:scale-95 transition-transform">Sí, unirme a la mesa</button>
                <button onClick={() => window.location.href='perfil.html'} className="w-full bg-bokalia-cream text-bokalia-dark font-bold py-4 rounded-2xl border border-bokalia-beige">No, me he equivocado</button>
              </div>
            </div>
          )}

          <header className="bg-white text-bokalia-dark border-b border-bokalia-beige p-5 sticky top-0 z-30 shadow-sm flex justify-between items-center rounded-b-[2rem]">
            <div>
               <h1 className="font-black text-2xl text-bokalia-coral tracking-tighter">BOKALIA</h1>
               <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-0.5">MESA {mesaParam}</p>
            </div>
            {user ? (
               <button onClick={() => window.location.href='perfil.html'} className="text-[10px] font-bold bg-bokalia-cream border border-bokalia-beige text-gray-500 px-4 py-2.5 rounded-xl shadow-sm active:scale-95 transition-transform uppercase tracking-widest">Mi Perfil</button> 
            ) : (
               <button onClick={() => { setAuthMode('login'); setShowAuthModal(true); }} className="text-sm font-bold bg-bokalia-coral text-white px-5 py-2 rounded-xl shadow-md">Entrar</button>
            )}
          </header>

          <div className="p-5">
            
            {rondasBorrador.length > 0 && (
              <div className="mb-10 bg-white p-6 rounded-[2rem] border border-bokalia-beige shadow-sm animate-fade-in">
                <h2 className="text-lg font-bold text-bokalia-dark mb-4 flex items-center gap-2">
                  <span className="w-2.5 h-2.5 bg-bokalia-coral rounded-full animate-ping"></span>
                  Borrador de la Mesa
                </h2>
                
                {rondasBorrador.map(ronda => (
                   <div key={ronda.id} className={`mb-4 last:mb-0 ${ronda.usuario_id !== user?.id ? 'opacity-70' : ''}`}>
                     <div className="flex justify-between items-end border-b border-bokalia-beige pb-2 mb-3">
                        <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                           {ronda.usuario_id === user?.id ? 'Tú vas a pedir:' : `${ronda.usuario?.nombre || ronda.usuario?.email?.split('@')[0]} va a pedir:`}
                        </p>
                     </div>
                     <ul className="space-y-3">
                        {ronda.items.map(item => (
                           <li key={item.id} className="flex justify-between items-center">
                              <div className="flex gap-3 items-center text-sm font-medium text-bokalia-dark">
                                 <span className="bg-bokalia-cream border border-bokalia-beige text-bokalia-dark px-2 py-0.5 rounded-lg text-xs font-bold">{item.cantidad}x</span>
                                 {item.producto?.nombre}
                              </div>
                              {ronda.usuario_id === user?.id && (
                                 <button onClick={() => eliminarItemBorrador(item.id)} className="bg-red-50 text-red-500 px-3 py-1.5 rounded-lg font-bold text-[10px] uppercase tracking-widest active:scale-95 transition-all">Quitar</button>
                              )}
                           </li>
                        ))}
                     </ul>
                   </div>
                ))}
              </div>
            )}

            <h2 className="text-xl font-bold text-bokalia-dark mb-4 tracking-tight">La Carta</h2>
            {productos.length === 0 && <p className="text-gray-500 text-sm font-medium">Menú no disponible.</p>}
            
            <div className="grid grid-cols-2 gap-4 mb-8">
              {productos.map(p => (
                <div key={p.id} className="bg-white rounded-3xl overflow-hidden shadow-elegant border border-bokalia-beige flex flex-col active:scale-[0.98] transition-transform">
                  <div className="h-32 bg-bokalia-cream"><img src={p.imagen_url} className="w-full h-full object-cover" /></div>
                  <div className="p-4 flex flex-col flex-grow">
                        <h3 className="font-bold text-bokalia-dark text-sm leading-tight">{p.nombre}</h3>
                        <p className="text-bokalia-coral font-black mt-1 mb-4 text-lg">{p.precio}€</p>
                        <button onClick={() => intentarAñadirAlCarrito(p)} className="mt-auto w-full bg-bokalia-cream border border-bokalia-beige text-bokalia-dark font-bold py-2.5 rounded-xl text-xs uppercase tracking-widest active:bg-bokalia-coral active:text-white transition-colors">Añadir</button>
                  </div>
                </div>
              ))}
            </div>

            {rondasEnviadas.length > 0 && (
              <div className="mb-8">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-xl font-bold text-bokalia-dark flex items-center gap-2">
                    <div className="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_8px_rgba(34,197,94,0.8)]"></div>
                    La Cuenta
                  </h2>
                  {sesionActiva?.estado === 'activa' && (
                    <button onClick={pedirCuenta} className="bg-bokalia-dark text-white text-[10px] uppercase tracking-widest font-bold px-4 py-2.5 rounded-xl shadow-md active:scale-95 transition-transform">Pedir Cuenta</button>
                  )}
                </div>
                
                <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-bokalia-beige mb-4">
                   <div className="text-center mb-6">
                     <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Total a Pagar</p>
                     <p className="text-4xl font-black text-bokalia-coral">{formatMoney(totalMesaEnviada)}€</p>
                   </div>
                   
                   {rondasEnviadas.map((ronda, i) => (
                     <div key={ronda.id} className="border-t border-bokalia-beige pt-4 mt-4 first:border-0 first:pt-0 first:mt-0">
                       <div className="flex justify-between items-center mb-3">
                         <p className="font-bold text-gray-400 text-[10px] uppercase tracking-widest">{formatDate(ronda.fecha)}</p>
                         <span className="text-[9px] font-bold text-gray-500 bg-gray-100 px-2 py-1 rounded-md uppercase tracking-widest">{ronda.estado}</span>
                       </div>
                       <ul className="text-sm text-bokalia-dark space-y-3">
                         {ronda.items?.map((item, idx) => (
                           <li key={idx} className="flex gap-3 font-medium items-center text-sm">
                              <span className="bg-bokalia-cream border border-bokalia-beige text-bokalia-dark px-2 py-0.5 rounded-lg text-xs font-bold">{item.cantidad}x</span>
                              {item.producto?.nombre} 
                              <span className="text-gray-400 text-xs ml-auto text-right leading-tight">
                                 {item.precio_unitario}€<br/>
                                 <span className="text-[9px] uppercase tracking-widest font-bold" style={{color: ronda.usuario_id === user?.id ? '#e25e4c' : '#9ca3af'}}>
                                    {ronda.usuario_id === user?.id ? 'Tú' : ronda.usuario?.nombre || 'Amigo'}
                                 </span>
                              </span>
                           </li>
                         ))}
                       </ul>
                     </div>
                   ))}
                </div>
              </div>
            )}
          </div>

          {totalItemsMesaPendiente > 0 && !mesaBloqueada && (
            <div className="fixed bottom-0 left-0 w-full bg-white p-6 shadow-elegant-lg z-20 animate-slide-up rounded-t-[2.5rem] border-t border-bokalia-beige">
              <div className="flex justify-between items-center max-w-md mx-auto">
                <div>
                  <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Mesa pendiente</p>
                  <p className="text-3xl font-black text-bokalia-dark tracking-tighter">{totalItemsMesaPendiente} <span className="text-sm font-medium text-gray-500">ítems</span></p>
                </div>
                <button 
                  onClick={enviarACocinaDB} 
                  className="bg-bokalia-coral text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-bokalia-coral/30 flex items-center gap-2 active:scale-95 transition-transform text-sm uppercase tracking-widest">
                  Mandar a cocina
                </button>
              </div>
            </div>
          )}

          {/* 🔥 MODALES ORIGINALES 🔥 */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-bokalia-dark/60 backdrop-blur-sm z-[200] flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in">
              <div className="bg-white rounded-t-[2.5rem] sm:rounded-[2.5rem] p-8 w-full max-w-md relative shadow-2xl animate-slide-up border border-bokalia-beige">
                <button onClick={() => { setShowAuthModal(false); setProductoPendiente(null); }} className="absolute top-6 right-6 text-gray-400 font-bold text-xl bg-bokalia-cream w-10 h-10 rounded-full flex items-center justify-center border border-bokalia-beige">✕</button>
                <h3 className="text-3xl font-black mb-2 text-bokalia-dark tracking-tight">{authMode === 'login' ? 'Hola' : 'Únete al club'}</h3>
                <p className="text-gray-500 mb-8 font-medium text-sm">{authMode === 'login' ? 'Entra a tu cuenta.' : 'Crea tu cuenta para ganar puntos.'}</p>
                <input type="email" placeholder="Correo electrónico" value={email} onChange={e => setEmail(e.target.value)} className="w-full mb-4 p-4 bg-bokalia-cream border border-bokalia-beige rounded-2xl outline-none font-medium focus:border-bokalia-coral transition-colors" />
                <input type="password" placeholder="Contraseña" value={password} onChange={e => setPassword(e.target.value)} className="w-full mb-8 p-4 bg-bokalia-cream border border-bokalia-beige rounded-2xl outline-none font-medium focus:border-bokalia-coral transition-colors" />
                <button onClick={handleAuth} className="w-full text-white font-bold py-4 rounded-2xl text-lg active:scale-95 transition-transform mb-4 shadow-lg bg-bokalia-coral">
                   {authMode === 'login' ? 'Entrar' : 'Registrarme'}
                </button>
                <button onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')} className="w-full text-gray-500 font-medium py-2 text-sm">{authMode === 'login' ? 'No tengo cuenta, crear una' : 'Ya tengo cuenta, iniciar sesión'}</button>
              </div>
            </div>
          )}

          {showModoMesa && (
            <div className="fixed inset-0 bg-bokalia-dark/60 backdrop-blur-sm z-[110] flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-[2.5rem] p-8 w-full max-w-md relative shadow-2xl animate-slide-up text-center border border-bokalia-beige">
                <button onClick={() => { setShowModoMesa(false); setProductoPendiente(null); }} className="absolute top-6 right-6 text-gray-400 font-bold text-xl bg-bokalia-cream w-10 h-10 rounded-full flex items-center justify-center border border-bokalia-beige">✕</button>
                <div className="text-5xl mb-6 mt-4">🍕</div>
                <h3 className="text-2xl font-black text-bokalia-dark mb-2 tracking-tight">¿Cómo vais a pedir?</h3>
                <p className="text-gray-500 text-sm font-medium mb-10">Elige la configuración para tu mesa.</p>
                <div className="flex flex-col gap-4">
                  <button onClick={() => procesarCrearMesaYPedir(true)} className="w-full bg-bokalia-coral text-white font-bold py-5 px-4 rounded-2xl shadow-lg shadow-bokalia-coral/30 active:scale-95 transition-transform flex flex-col items-center">
                    <span className="text-lg">Con Amigos</span>
                    <span className="text-[10px] font-medium opacity-80 mt-1 uppercase tracking-widest text-center leading-tight">Cada uno suma puntos de sus platos<br/>y la cuenta se divide visualmente.</span>
                  </button>
                  <button onClick={() => procesarCrearMesaYPedir(false)} className="w-full bg-white text-bokalia-dark font-bold py-5 px-4 rounded-2xl border border-bokalia-beige active:scale-95 transition-transform flex flex-col items-center">
                    <span className="text-lg">Yo Solo</span>
                    <span className="text-[10px] font-medium text-gray-400 mt-1 uppercase tracking-widest text-center leading-tight">Mesa exclusiva. Tú pagas todo<br/>y te llevas todos los puntos.</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 🧾 TICKET FINAL ORIGINAL */}
          {showTicketModal && (
            <div className="fixed inset-0 bg-bokalia-dark/60 backdrop-blur-sm z-[120] flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-[2.5rem] p-8 w-full max-w-md text-center shadow-2xl animate-slide-up border border-bokalia-beige">
                <div className="text-5xl mb-4">🧾</div>
                <h3 className="text-2xl font-black text-bokalia-dark mb-2 tracking-tight">¡Cuenta Pagada!</h3>
                <p className="text-gray-500 font-medium text-sm mb-6">Gracias por comer con nosotros.</p>
                
                <div className="bg-bokalia-cream p-5 rounded-2xl mb-6 text-left border border-bokalia-beige max-h-48 overflow-y-auto">
                   <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3 border-b border-bokalia-beige pb-2">Tu parte de la cuenta</p>
                   {datosTicket.items.length === 0 ? <p className="text-sm font-medium text-gray-400 py-2">No tienes consumos propios.</p> : null}
                   {datosTicket.items.map((it, i) => (
                      <div key={i} className="flex justify-between text-sm font-medium text-bokalia-dark mb-2">
                         <span>{it.cantidad}x {it.producto?.nombre}</span>
                         <span className="font-bold">{(parseFloat(it.precio_unitario) * parseInt(it.cantidad)).toFixed(2)}€</span>
                      </div>
                   ))}
                   <div className="flex justify-between items-end mt-4 pt-3 border-t border-bokalia-beige">
                      <span className="text-gray-500 font-bold uppercase text-[10px] tracking-widest">Total Pagado</span>
                      <span className="text-xl font-black text-bokalia-coral">{datosTicket.subtotal.toFixed(2)}€</span>
                   </div>
                </div>

                <div className="bg-white border-2 border-bokalia-beige text-bokalia-dark p-5 rounded-2xl mb-8 shadow-sm">
                   <p className="font-black text-lg text-bokalia-coral">+{datosTicket.puntosGanados} Puntos VIP 👑</p>
                   <p className="text-[11px] font-medium text-gray-500 mt-1 uppercase tracking-widest">Se han sumado a tu Wallet</p>
                </div>

                <button onClick={() => {
                   setShowTicketModal(false);
                   setShowReviewModal(true);
                }} className="w-full bg-bokalia-coral text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-transform">
                   Continuar
                </button>
              </div>
            </div>
          )}
          
          {/* ⭐ ESTRELLITAS ORIGINALES */}
          {showReviewModal && (
            <div className="fixed inset-0 bg-bokalia-dark/60 backdrop-blur-sm z-[130] flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-[2.5rem] p-8 w-full max-w-md text-center animate-slide-up border border-bokalia-beige">
                <div className="text-5xl mb-4 mt-4">⭐</div>
                <h3 className="text-2xl font-black text-bokalia-dark mb-2 tracking-tight">¿Qué tal la comida?</h3>
                <p className="text-sm text-gray-500 mb-8 font-medium">Toca las estrellas para valorarnos.</p>
                <div className="flex justify-center gap-3 mb-10">
                  {[1,2,3,4,5].map(star => (
                    <button key={star} onClick={finalizarYSalir} className="text-5xl text-yellow-400 active:scale-75 transition-transform drop-shadow-sm">★</button>
                  ))}
                </div>
                <button onClick={finalizarYSalir} className="text-[10px] font-bold text-gray-400 uppercase tracking-widest pb-2">Saltar y Salir</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><MainApp /></ErrorBoundary>);
  </script>
</body>
</html>
