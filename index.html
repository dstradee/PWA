<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bokalia - Pide desde tu mesa</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: system-ui, sans-serif; background: #111827; margin: 0; -webkit-tap-highlight-color: transparent; }
    @keyframes slideUp { from { transform: translate3d(0, 100%, 0); } to { transform: translate3d(0, 0, 0); } }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translate3d(0, -10px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
    .animate-fade-in { animation: fadeIn 0.25s ease forwards; }
    .mobile-container { transform: translate(0); }
  </style>
</head>
<body class="flex justify-center min-h-screen bg-gray-900">
  
  <div id="root" class="w-full max-w-md bg-gray-50 min-h-screen relative overflow-x-hidden shadow-2xl mobile-container pb-40">
    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background-color:#fefce8; color:#dc2626;">
      <h1 style="font-size:3rem; font-weight:900; margin:0; letter-spacing:-2px;">BOKALIA</h1>
      <p style="font-weight:bold; margin-top:10px; opacity:0.7;">Conectando a tu mesa...</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const TIEMPO_LIMITE_MINUTOS = 120; // 2 Horas

    // 🔥 EL ID DE TU RESTAURANTE (Bokalia)
    const RESTAURANTE_ID = 'a5f65b60-0a06-4ed3-9c40-fbbf5f85901a';

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) return (
            <div className="p-8 flex flex-col items-center justify-center min-h-screen bg-red-50 text-center">
              <div className="text-6xl mb-4">🚨</div>
              <h1 className="text-2xl font-black text-red-600 mb-2">Error Crítico</h1>
              <p className="text-gray-700 text-sm mb-6">{this.state.error.toString()}</p>
              <button onClick={() => window.location.href='perfil.html'} className="bg-red-600 text-white font-bold py-3 px-6 rounded-xl">Volver al Inicio</button>
            </div>
        );
        return this.props.children;
      }
    }

    const supabase = window.supabase.createClient(
      'https://bswlriuzeintgjioywtz.supabase.co',
      'sb_publishable_oIWpn-mNPUZaQPdf7HNU_Q_Lc7R6UOB',
      { auth: { persistSession: true, storage: window.localStorage, autoRefreshToken: true } }
    );

    function MainApp() {
      const [mesaParam, setMesaParam] = useState(null);
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      
      const [productos, setProductos] = useState([]);
      const [sesionActiva, setSesionActiva] = useState(null);
      const [mesaBloqueada, setMesaBloqueada] = useState(false);
      const [hostName, setHostName] = useState('');
      
      const [carritosAmigos, setCarritosAmigos] = useState({}); 
      const [rondasBorrador, setRondasBorrador] = useState([]); 
      const [rondasEnviadas, setRondasEnviadas] = useState([]); 
      
      const [ultimoPedido, setUltimoPedido] = useState(null);
      const [ultimaActividad, setUltimaActividad] = useState(Date.now());
      const [productoPendiente, setProductoPendiente] = useState(null);
      
      // Modales
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login'); 
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      
      const [showModoMesa, setShowModoMesa] = useState(false);
      const [showJoinPrompt, setShowJoinPrompt] = useState(false);
      const [showReviewModal, setShowReviewModal] = useState(false);
      const [showTimeoutModal, setShowTimeoutModal] = useState(false);
      const [showTicketModal, setShowTicketModal] = useState(false);
      
      const [datosTicket, setDatosTicket] = useState({ subtotal: 0, puntosGanados: 0, items: [] });
      const [toastMsg, setToastMsg] = useState('');

      const channelRef = useRef(null);
      const ticketProcesadoRef = useRef(false);

      // INICIALIZACIÓN
      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const mesa = urlParams.get('mesa');
        if (mesa) setMesaParam(parseInt(mesa));

        cargarMenu();

        supabase.auth.getSession().then(({ data }) => {
          if (data?.session?.user) procesarUsuario(data.session.user);
          else setAuthLoading(false);
        }).catch(() => setAuthLoading(false));

        const { data: authListener } = supabase.auth.onAuthStateChange((_, session) => {
          if(session?.user) procesarUsuario(session.user);
          else { setUser(null); setUltimoPedido(null); setAuthLoading(false); }
        });

        return () => { if (authListener?.subscription) authListener.subscription.unsubscribe(); };
      }, []);

      // VIGILANTE MESA GLOBAL
      useEffect(() => {
        if (!mesaParam || authLoading) return;
        verificarSesionMesa();

        const globalChannel = supabase.channel(`vigilante_mesa_${mesaParam}`)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'sesiones_mesa' }, (payload) => {
             if ((payload.new && payload.new.num_mesa === mesaParam) || (payload.old && payload.old.num_mesa === mesaParam)) {
                verificarSesionMesa();
             }
          }).subscribe();

        return () => supabase.removeChannel(globalChannel);
      }, [mesaParam, user, authLoading, sesionActiva]);

      // VIGILANTE CARRITOS Y COBROS
      useEffect(() => {
        if (sesionActiva) {
          cargarRondasMesa(sesionActiva.id);
          
          channelRef.current = supabase.channel(`db_sync_mesa_${sesionActiva.id}`)
            .on('broadcast', { event: 'cart_sync' }, (payload) => {
               const data = payload.payload;
               if (user && data.userId !== user.id) {
                  setCarritosAmigos(prev => {
                     const newState = { ...prev, [data.userId]: data };
                     if (data.cart.length === 0) delete newState[data.userId];
                     return newState;
                  });
               }
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos_rondas', filter: `sesion_id=eq.${sesionActiva.id}` }, () => {
               cargarRondasMesa(sesionActiva.id);
               setUltimaActividad(Date.now());
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'items_pedido' }, () => {
               cargarRondasMesa(sesionActiva.id);
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sesiones_mesa', filter: `id=eq.${sesionActiva.id}` }, (payload) => {
               // 🔥 SI EL CAMARERO COBRA, ENSEÑAMOS EL TICKET
               if (payload.new.estado === 'pagada') {
                  cargarTicketFinal(sesionActiva.id);
               }
            })
            .subscribe();

          return () => { if (channelRef.current) supabase.removeChannel(channelRef.current); };
        }
      }, [sesionActiva, user]);

      // EFECTO MEMORIA TRAS REGISTRO
      useEffect(() => {
         if (user && productoPendiente && !authLoading) {
            if (!sesionActiva) {
               setShowModoMesa(true);
            } else {
               ejecutarAñadirDB(sesionActiva.id, productoPendiente);
               setProductoPendiente(null);
            }
         }
      }, [user, productoPendiente, authLoading, sesionActiva]);

      // RELOJ INACTIVIDAD
      useEffect(() => {
        if (!sesionActiva || sesionActiva.estado === 'pagada') return;
        const interval = setInterval(() => {
          const minutos = (Date.now() - ultimaActividad) / 60000;
          if (minutos >= TIEMPO_LIMITE_MINUTOS && !showTimeoutModal) {
             setShowTimeoutModal(true);
          }
        }, 60000);
        return () => clearInterval(interval);
      }, [sesionActiva, ultimaActividad, showTimeoutModal]);

      // --- FUNCIONES ---
      const procesarUsuario = async (authUser) => {
        setUser(authUser);
        try {
          let { data: userDb } = await supabase.from('usuarios').select('id').eq('id', authUser.id).maybeSingle();
          if (!userDb) await supabase.from('usuarios').insert([{ id: authUser.id, email: authUser.email }]);
          buscarUltimoPedido(authUser.id);
        } catch(e) { console.warn("Error leyendo usuario", e); }
        setAuthLoading(false);
      };

      const cargarMenu = async () => {
        // 🔥 Carga los productos reales de TU restaurante
        const { data, error } = await supabase.from('productos').select('*').eq('restaurante_id', RESTAURANTE_ID).eq('activo', true);
        if (data) setProductos(data);
      };

      const buscarUltimoPedido = async (userId) => {
        const { data: ultimas } = await supabase.from('pedidos_rondas').select('id').eq('usuario_id', userId).neq('estado', 'pendiente').order('fecha', { ascending: false }).limit(1);
        if (ultimas && ultimas.length > 0) {
          const { data: items } = await supabase.from('items_pedido').select('producto_id, producto:productos(*)').eq('ronda_id', ultimas[0].id).limit(1);
          if (items && items.length > 0 && items[0].producto) setUltimoPedido(items[0].producto);
        }
      };

      const verificarSesionMesa = async () => {
        const { data } = await supabase.from('sesiones_mesa')
          .select('*, host:usuarios(nombre, email)').eq('num_mesa', mesaParam).eq('restaurante_id', RESTAURANTE_ID).neq('estado', 'pagada').maybeSingle();
        if (data) {
          if (!user || data.host_id !== user?.id) {
            if (data.compartida === false) {
              setMesaBloqueada(true); 
              setShowJoinPrompt(false);
            } else {
              const yaAcepto = window.sessionStorage.getItem(`unido_mesa_${mesaParam}`);
              if (!yaAcepto) {
                setHostName(data.host?.nombre || data.host?.email?.split('@')[0] || 'Alguien');
                setShowJoinPrompt(true); 
                setMesaBloqueada(false);
              } else {
                setSesionActiva(data);
                setShowJoinPrompt(false);
                setMesaBloqueada(false);
              }
            }
          } else {
            setMesaBloqueada(false);
            setShowJoinPrompt(false);
            setSesionActiva(data);
          }
        } else {
          setSesionActiva(null);
          setMesaBloqueada(false);
          setShowJoinPrompt(false);
        }
      };

      const aceptarUnirse = () => {
         window.sessionStorage.setItem(`unido_mesa_${mesaParam}`, 'true');
         setShowJoinPrompt(false);
         verificarSesionMesa();
      };

      const cargarRondasMesa = async (idSesion) => {
        const { data, error } = await supabase.from('pedidos_rondas')
          .select('*, items:items_pedido(id, cantidad, precio_unitario, producto_id, producto:productos(nombre, precio)), usuario:usuarios(nombre, email)')
          .eq('sesion_id', idSesion).order('fecha', { ascending: true });
          
        if (data) {
           const borradores = data.filter(r => (r.estado === 'pendiente' || r.estado === 'listo') && r.items.length > 0);
           setRondasBorrador(borradores);
           const enviados = data.filter(r => r.estado === 'enviado' || r.estado === 'preparando' || r.estado === 'servido');
           setRondasEnviadas(enviados);
        }
      };

      const handleAuth = async () => {
        setAuthLoading(true);
        const { error } = authMode === 'register' ? await supabase.auth.signUp({ email, password }) : await supabase.auth.signInWithPassword({ email, password });
        if (error) { setAuthLoading(false); alert("Error: " + error.message); }
        else setShowAuthModal(false); 
      };

      // 🍔 AÑADIR A DB
      const intentarAñadirAlCarrito = (producto) => {
        if (!user) { 
           setProductoPendiente(producto);
           setAuthMode('register'); 
           return setShowAuthModal(true); 
        }
        if (!sesionActiva) {
           setProductoPendiente(producto);
           return setShowModoMesa(true);
        }
        ejecutarAñadirDB(sesionActiva.id, producto);
      };

      const ejecutarAñadirDB = async (idSesion, producto) => {
         try {
            let { data: ronda } = await supabase.from('pedidos_rondas')
               .select('id, estado').eq('sesion_id', idSesion).eq('usuario_id', user.id).in('estado', ['pendiente', 'listo']).maybeSingle();

            if (!ronda) {
               const { data: newRonda } = await supabase.from('pedidos_rondas')
                  .insert([{ sesion_id: idSesion, usuario_id: user.id, estado: 'pendiente' }]).select().single();
               ronda = newRonda;
            } else if (ronda.estado === 'listo') {
               await supabase.from('pedidos_rondas').update({ estado: 'pendiente' }).eq('id', ronda.id);
            }
            
            await supabase.from('items_pedido').insert([{
               ronda_id: ronda.id, producto_id: producto.id, cantidad: 1, precio_unitario: producto.precio
            }]);
            
            mostrarToast(`Añadido: ${producto.nombre} 🛒`);
         } catch(e) { console.error("Error al añadir:", e); }
      };

      const eliminarItemBorrador = async (itemId) => {
         await supabase.from('items_pedido').delete().eq('id', itemId);
      };

      const procesarCrearMesaYPedir = async (esCompartida) => {
        setShowModoMesa(false);
        try {
           const { data } = await supabase.from('sesiones_mesa').insert([{ 
              restaurante_id: RESTAURANTE_ID, num_mesa: mesaParam, host_id: user.id, estado: 'activa', compartida: esCompartida 
           }]).select().single();
           setSesionActiva(data);
        } catch(e) { console.error(e); }
      };

      const enviarACocinaDB = async () => {
         if (!sesionActiva || !user) return;
         const miRonda = rondasBorrador.find(r => r.usuario_id === user.id);
         if (!miRonda) return;

         try {
            await supabase.from('pedidos_rondas').update({estado: 'listo'}).eq('id', miRonda.id);
            const { data: pendientes } = await supabase.from('pedidos_rondas').select('id').eq('sesion_id', sesionActiva.id).eq('estado', 'pendiente');
               
            if (pendientes && pendientes.length > 0) {
               mostrarToast("¡Estás listo! Esperando a tus amigos... ⏳");
            } else {
               await supabase.from('pedidos_rondas').update({estado: 'enviado', fecha: new Date().toISOString()}).eq('sesion_id', sesionActiva.id).eq('estado', 'listo');
               mostrarToast("¡Ronda grupal a cocina! 🚀");
            }
         } catch(e) { console.error(e); }
      };

      const pedirCuenta = async () => {
        if (!sesionActiva) return;
        await supabase.from('sesiones_mesa').update({ estado: 'pagando' }).eq('id', sesionActiva.id);
        mostrarToast("El camarero trae la cuenta. ¡Avisado! 💸");
      };

      // 🧾 CARGAR TICKET FINAL (Solo lee datos visuales, los puntos reales los puso el Trigger SQL)
      const cargarTicketFinal = async (idSesion) => {
         if (ticketProcesadoRef.current) return;
         ticketProcesadoRef.current = true;

         try {
            if (!user) return finalizarYSalir();

            const { data: misRondas } = await supabase.from('pedidos_rondas').select('id').eq('sesion_id', idSesion).eq('usuario_id', user.id).in('estado', ['enviado', 'preparando', 'servido']);
            let totalGastado = 0;
            let misItems = [];
            
            if (misRondas && misRondas.length > 0) {
               const rondasIds = misRondas.map(r => r.id);
               const { data: items } = await supabase.from('items_pedido').select('cantidad, precio_unitario, producto:productos(nombre)').in('ronda_id', rondasIds);
               if (items) {
                  misItems = items;
                  items.forEach(i => {
                     totalGastado += (parseFloat(i.precio_unitario || 0) * parseInt(i.cantidad || 1));
                  });
               }
            }
            
            // Esto es solo para que el cliente lo vea en el ticket, los de verdad ya están en su cuenta.
            const puntosGanadosVisuales = Math.floor(totalGastado * 100);

            setDatosTicket({ subtotal: totalGastado, puntosGanados: puntosGanadosVisuales, items: misItems });
            setShowTicketModal(true);
         } catch (e) {
            setShowReviewModal(true); 
         }
      };

      // 🔥 REDIRECCIÓN INQUEBRANTABLE AL PERFIL AL TERMINAR
      const finalizarYSalir = () => {
         window.location.href = 'perfil.html'; 
      };

      const formatMoney = (num) => Number(num).toFixed(2);
      const formatDate = (dateStr) => {
        const d = new Date(dateStr);
        return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
      };
      const mostrarToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 4000); };

      // ==========================================
      // UI Y VISTAS
      // ==========================================

      if (authLoading) return (
        <div className="h-screen flex items-center justify-center bg-yellow-50 flex-col">
           <div className="w-16 h-16 border-8 border-red-200 border-t-red-600 rounded-full animate-spin mb-6"></div>
           <h2 className="text-2xl font-black text-red-600 tracking-tighter animate-pulse">Cargando Bokalia...</h2>
        </div>
      );

      if (mesaBloqueada && mesaParam) {
        return (
          <div className="min-h-screen bg-gray-900 flex flex-col justify-center items-center p-8 text-center text-white animate-fade-in z-50 absolute w-full h-full">
            <div className="text-8xl mb-8">🔒</div>
            <h1 className="text-4xl font-black mb-4">Mesa Cerrada</h1>
            <p className="text-gray-300 font-medium text-lg leading-relaxed mb-12">El host de esta mesa ha seleccionado <b className="text-yellow-400">Cuenta Única</b>. No se admiten más móviles conectados a esta mesa.</p>
            <button onClick={() => window.location.href='perfil.html'} className="w-full bg-red-600 active:bg-red-700 text-white font-black py-5 rounded-2xl shadow-xl text-xl">Ir a mi Perfil</button>
          </div>
        );
      }

      if (!mesaParam) return (
        <div className="min-h-screen bg-yellow-50 flex flex-col justify-center items-center p-6 text-center">
          <div className="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full">
            <h1 className="text-5xl font-black text-red-600 mb-2 tracking-tighter">BOKALIA</h1>
            <p className="text-gray-500 mb-8 font-bold text-lg">¿En qué mesa te sientas?</p>
            <input type="number" id="inputMesa" className="text-center text-6xl font-black w-full p-4 rounded-[2rem] bg-gray-50 border-4 border-gray-200 mb-6 outline-none focus:border-red-500 transition-colors" placeholder="0" />
            <button onClick={() => {
                const num = document.getElementById('inputMesa').value;
                if(num) window.location.search = `?mesa=${num}`;
              }} className="w-full bg-red-600 active:bg-red-700 text-white font-black py-5 rounded-[2rem] text-2xl shadow-xl">
              Empezar
            </button>
            <button onClick={() => window.location.href='perfil.html'} className="mt-8 text-gray-500 font-bold">Ir a mi Perfil</button>
          </div>
        </div>
      );

      const miRondaBorrador = rondasBorrador.find(r => r.usuario_id === user?.id);
      const totalItemsMesaPendiente = rondasBorrador.reduce((acc, r) => acc + r.items.length, 0);

      const totalMesaEnviada = rondasEnviadas.reduce((acc, r) => {
         return acc + r.items.reduce((sum, item) => sum + (parseFloat(item.precio_unitario) * parseInt(item.cantidad)), 0);
      }, 0);

      return (
        <div className="pb-36 bg-gray-50 min-h-screen relative flex flex-col">
          
          {toastMsg && (
            <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-[60] animate-fade-in w-11/12 max-w-sm">
              <div className="bg-green-500 text-white font-black px-6 py-4 rounded-2xl shadow-xl flex items-center justify-between">
                <span>{toastMsg}</span>
              </div>
            </div>
          )}

          {showJoinPrompt && (
            <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[100] flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-[2.5rem] p-8 w-full max-w-md text-center shadow-2xl animate-slide-up">
                <div className="text-6xl mb-4">👋</div>
                <h3 className="text-3xl font-black text-gray-800 mb-2">Mesa de {hostName}</h3>
                <p className="text-gray-500 font-medium text-lg mb-8">Esta mesa ya está abierta. ¿Estás en su grupo?</p>
                <button onClick={aceptarUnirse} className="w-full bg-yellow-400 text-yellow-900 font-black py-5 rounded-2xl shadow-lg text-xl mb-4 active:scale-95 transition-transform">Sí, unirme a la mesa</button>
                <button onClick={() => window.location.href='perfil.html'} className="w-full bg-gray-100 text-gray-600 font-black py-4 rounded-2xl">No, me he equivocado</button>
              </div>
            </div>
          )}

          <header className="bg-red-600 text-white p-5 sticky top-0 z-30 shadow-md flex justify-between items-center rounded-b-2xl">
            <div>
               <h1 className="font-black text-3xl text-yellow-400 tracking-tighter">BOKALIA</h1>
               <p className="text-xs font-bold text-red-200 uppercase tracking-widest">MESA {mesaParam}</p>
            </div>
            {user ? (
               <button onClick={() => window.location.href = 'perfil.html'} className="text-xs font-black bg-white text-red-600 px-4 py-2.5 rounded-xl shadow-sm active:scale-95 transition-transform">Mi Perfil</button> 
            ) : (
               <button onClick={() => { setAuthMode('login'); setShowAuthModal(true); }} className="text-sm font-black bg-yellow-400 text-red-900 px-5 py-2.5 rounded-xl shadow-sm">Entrar</button>
            )}
          </header>

          <div className="p-4">
            
            {rondasBorrador.length > 0 && (
              <div className="mb-10 bg-orange-50 p-5 rounded-[2rem] border-2 border-orange-200 shadow-md animate-fade-in">
                <h2 className="text-xl font-black text-orange-900 mb-4 flex items-center gap-2">
                  <span className="w-2.5 h-2.5 bg-orange-500 rounded-full animate-ping"></span>
                  Borrador de la Mesa
                </h2>
                
                {rondasBorrador.map(ronda => (
                   <div key={ronda.id} className={`mb-4 last:mb-0 ${ronda.usuario_id !== user?.id ? 'opacity-80' : ''}`}>
                     <div className="flex justify-between items-end border-b border-orange-200 pb-1 mb-2">
                        <p className="text-xs font-bold text-orange-700 uppercase tracking-widest">
                           {ronda.usuario_id === user?.id ? 'Tú vas a pedir:' : `${ronda.usuario?.nombre || ronda.usuario?.email?.split('@')[0]} va a pedir:`}
                        </p>
                        {ronda.estado === 'listo' && <span className="text-[10px] font-black bg-green-500 text-white px-2 py-0.5 rounded-full uppercase">¡Listo! ✅</span>}
                     </div>
                     <ul className="space-y-2">
                        {ronda.items.map(item => (
                           <li key={item.id} className="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm">
                              <div className="flex gap-3 items-center text-sm font-bold text-gray-800">
                                 <span className="bg-orange-100 text-orange-600 w-6 h-6 flex items-center justify-center rounded-md">{item.cantidad}x</span>
                                 {item.producto?.nombre}
                              </div>
                              {ronda.usuario_id === user?.id && ronda.estado === 'pendiente' && (
                                 <button onClick={() => eliminarItemBorrador(item.id)} className="bg-red-50 text-red-600 p-2 rounded-lg font-black text-xs active:scale-95 transition-all">QUITAR</button>
                              )}
                           </li>
                        ))}
                     </ul>
                   </div>
                ))}
              </div>
            )}

            {ultimoPedido && (
              <div className="bg-gradient-to-r from-orange-500 to-red-500 p-1.5 rounded-[2rem] shadow-lg mb-8">
                <div className="bg-white/10 backdrop-blur-sm rounded-[1.6rem] p-4 flex items-center justify-between border border-white/20">
                  <div>
                    <span className="bg-yellow-400 text-yellow-900 text-[10px] font-black px-2 py-1 rounded-lg uppercase shadow-sm tracking-widest">Pídelo de nuevo</span>
                    <p className="text-white font-black text-xl mt-1 leading-tight">{ultimoPedido.nombre}</p>
                  </div>
                  <button onClick={() => intentarAñadirAlCarrito(ultimoPedido)} className="bg-white text-red-600 font-black py-3 px-5 rounded-2xl shadow-lg active:scale-95 transition-transform text-sm">
                    + Añadir
                  </button>
                </div>
              </div>
            )}

            <h2 className="text-2xl font-black text-gray-800 mb-4 ml-1 tracking-tight">La Carta</h2>
            {productos.length === 0 && <p className="text-gray-500 text-sm font-bold ml-2">Menú no disponible.</p>}
            
            <div className="grid grid-cols-2 gap-4 mb-8">
              {productos.map(p => (
                <div key={p.id} className="bg-white rounded-3xl overflow-hidden shadow-md border border-gray-100 flex flex-col active:shadow-sm transition-all">
                  <div className="h-32 bg-gray-200"><img src={p.imagen_url} className="w-full h-full object-cover" /></div>
                  <div className="p-4 flex flex-col flex-grow">
                    <h3 className="font-black text-gray-800 text-sm leading-tight">{p.nombre}</h3>
                    <p className="text-orange-500 font-black mt-1 mb-4 text-xl">{p.precio}€</p>
                    <button onClick={() => intentarAñadirAlCarrito(p)} className="mt-auto w-full bg-red-50 text-red-600 font-black py-3 rounded-2xl text-sm active:bg-red-600 active:text-white transition-colors">Añadir</button>
                  </div>
                </div>
              ))}
            </div>

            {rondasEnviadas.length > 0 && (
              <div className="mb-8">
                <div className="flex justify-between items-center mb-4 ml-1">
                  <h2 className="text-xl font-black text-gray-800 flex items-center gap-2">
                    <div className="w-2.5 h-2.5 bg-green-500 rounded-full shadow-[0_0_8px_rgba(34,197,94,0.8)]"></div>
                    La Cuenta
                  </h2>
                  {sesionActiva?.estado === 'activa' && (
                    <button onClick={pedirCuenta} className="bg-gray-900 text-white text-xs font-black px-4 py-2.5 rounded-xl shadow-lg active:bg-black transition-colors">Pedir Cuenta</button>
                  )}
                </div>
                
                <div className="bg-white p-5 rounded-[2rem] shadow-md border-2 border-gray-100 mb-4">
                   <div className="text-center mb-6">
                     <p className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Total a Pagar</p>
                     <p className="text-4xl font-black text-gray-800">{formatMoney(totalMesaEnviada)}€</p>
                   </div>
                   
                   {rondasEnviadas.map((ronda, i) => (
                     <div key={ronda.id} className="border-t border-dashed border-gray-200 pt-4 mt-4 first:border-0 first:pt-0 first:mt-0">
                       <div className="flex justify-between items-center mb-3">
                         <p className="font-black text-gray-400 text-[10px] uppercase tracking-widest">{formatDate(ronda.fecha)}</p>
                         <span className="text-[10px] font-black text-green-700 bg-green-100 px-2 py-0.5 rounded-md uppercase tracking-widest">{ronda.estado}</span>
                       </div>
                       <ul className="text-sm text-gray-800 space-y-2">
                         {ronda.items?.map((item, idx) => (
                           <li key={idx} className="flex gap-3 font-bold items-center text-sm">
                              <span className="bg-gray-100 text-gray-600 w-6 h-6 flex items-center justify-center rounded-md">{item.cantidad}x</span>
                              {item.producto?.nombre} 
                              <span className="text-gray-400 text-xs ml-auto text-right leading-tight">
                                 {item.precio_unitario}€<br/>
                                 <span className="text-[9px] uppercase tracking-wider text-orange-400">{ronda.usuario_id === user?.id ? 'Tú' : ronda.usuario?.nombre || 'Amigo'}</span>
                              </span>
                           </li>
                         ))}
                       </ul>
                     </div>
                   ))}
                </div>
              </div>
            )}
          </div>

          {totalItemsMesaPendiente > 0 && !mesaBloqueada && (
            <div className="fixed bottom-0 left-0 w-full bg-white p-5 shadow-[0_-15px_40px_-5px_rgba(0,0,0,0.15)] z-20 animate-slide-up rounded-t-[2.5rem]">
              <div className="flex justify-between items-center max-w-md mx-auto">
                <div>
                  <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Mesa pendiente</p>
                  <p className="text-3xl font-black text-gray-800 tracking-tighter">{totalItemsMesaPendiente} <span className="text-base font-bold text-gray-500">ítems</span></p>
                </div>
                <button 
                  onClick={enviarACocinaDB} 
                  disabled={miRondaBorrador?.estado === 'listo'}
                  className={`font-black py-4 px-6 rounded-2xl shadow-[0_8px_20px_rgba(0,0,0,0.1)] text-lg flex items-center gap-2 transition-transform ${miRondaBorrador?.estado === 'listo' ? 'bg-gray-200 text-gray-500' : 'bg-green-500 text-white active:scale-95 shadow-green-500/40'}`}>
                  {miRondaBorrador?.estado === 'listo' ? 'Esperando amigos ⏳' : 'Mandar a cocina'}
                </button>
              </div>
            </div>
          )}

          {/* MODALES ABSOLUTES */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in">
              <div className="bg-white rounded-t-[2.5rem] sm:rounded-[2.5rem] p-8 w-full max-w-md relative shadow-2xl animate-slide-up">
                <button onClick={() => { setShowAuthModal(false); setProductoPendiente(null); }} className="absolute top-6 right-6 text-gray-400 font-black text-xl bg-gray-100 w-10 h-10 rounded-full flex items-center justify-center">✕</button>
                <h3 className="text-4xl font-black mb-1 text-gray-800 tracking-tighter">{authMode === 'login' ? 'Hola' : 'Únete'}</h3>
                <p className="text-gray-500 mb-8 font-medium text-sm">{authMode === 'login' ? 'Entra a tu cuenta.' : 'Crea tu cuenta para ganar puntos.'}</p>
                <input type="email" placeholder="Correo electrónico" value={email} onChange={e => setEmail(e.target.value)} className="w-full mb-4 p-5 bg-gray-50 border-2 border-gray-100 rounded-2xl outline-none font-bold focus:border-red-500" />
                <input type="password" placeholder="Contraseña" value={password} onChange={e => setPassword(e.target.value)} className="w-full mb-6 p-5 bg-gray-50 border-2 border-gray-100 rounded-2xl outline-none font-bold focus:border-red-500" />
                <button onClick={handleAuth} className={`w-full text-white font-black py-5 rounded-2xl text-xl active:scale-95 transition-transform mb-4 shadow-lg ${authMode === 'login' ? 'bg-red-600 shadow-red-600/30' : 'bg-yellow-400 text-yellow-900 shadow-yellow-400/50'}`}>
                   {authMode === 'login' ? 'Entrar' : 'Registrarme'}
                </button>
                <button onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')} className="w-full text-gray-500 font-bold py-3">{authMode === 'login' ? 'No tengo cuenta, crear una' : 'Ya tengo cuenta, iniciar sesión'}</button>
              </div>
            </div>
          )}

          {showModoMesa && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-[2.5rem] p-8 w-full max-w-md relative shadow-2xl animate-slide-up text-center">
                <button onClick={() => { setShowModoMesa(false); setProductoPendiente(null); }} className="absolute top-6 right-6 text-gray-400 font-black text-xl bg-gray-100 w-10 h-10 rounded-full flex items-center justify-center">✕</button>
                <div className="text-6xl mb-6 mt-4">🍕</div>
                <h3 className="text-3xl font-black text-gray-800 mb-2 tracking-tighter">¿Cómo vais a pedir?</h3>
                <p className="text-gray-500 text-sm font-medium mb-10">Elige la configuración para tu mesa. Se aplica al pedir la cuenta.</p>
                <div className="flex flex-col gap-4">
                  <button onClick={() => procesarCrearMesaYPedir(true)} className="w-full bg-yellow-400 text-yellow-900 font-black py-6 px-4 rounded-3xl shadow-xl shadow-yellow-400/30 active:scale-95 transition-transform flex flex-col items-center">
                    <span className="text-xl">Con Amigos</span>
                    <span className="text-xs font-bold opacity-70 mt-1 uppercase tracking-widest text-center leading-tight">Cada uno suma puntos de sus platos<br/>y la cuenta se divide visualmente.</span>
                  </button>
                  <button onClick={() => procesarCrearMesaYPedir(false)} className="w-full bg-white text-gray-800 font-black py-6 px-4 rounded-3xl border-[3px] border-gray-200 active:scale-95 transition-transform flex flex-col items-center">
                    <span className="text-xl">Yo Solo</span>
                    <span className="text-xs font-bold opacity-50 mt-1 uppercase tracking-widest text-center leading-tight">Mesa exclusiva. Tú pagas todo<br/>y te llevas todos los puntos.</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {showTicketModal && (
            <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[100] flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-[2.5rem] p-8 w-full max-w-md text-center shadow-2xl animate-slide-up">
                <div className="text-6xl mb-4">🧾</div>
                <h3 className="text-3xl font-black text-gray-800 mb-2 tracking-tighter">¡Cuenta Pagada!</h3>
                <p className="text-gray-500 font-medium text-lg mb-6">Gracias por comer con nosotros.</p>
                
                <div className="bg-gray-50 p-4 rounded-2xl mb-6 text-left border border-gray-200 max-h-48 overflow-y-auto">
                   <p className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 border-b border-gray-200 pb-2">Tu parte de la cuenta</p>
                   {datosTicket.items.length === 0 ? <p className="text-sm font-bold text-gray-400 py-2">No tienes consumos propios.</p> : null}
                   {datosTicket.items.map((it, i) => (
                      <div key={i} className="flex justify-between text-sm font-bold text-gray-700 mb-1">
                         <span>{it.cantidad}x {it.producto?.nombre}</span>
                         <span>{(parseFloat(it.precio_unitario) * parseInt(it.cantidad)).toFixed(2)}€</span>
                      </div>
                   ))}
                   <div className="flex justify-between items-end mt-4 pt-3 border-t border-gray-200">
                      <span className="text-gray-500 font-black uppercase text-xs">Total Pagado</span>
                      <span className="text-2xl font-black text-green-600">{datosTicket.subtotal.toFixed(2)}€</span>
                   </div>
                </div>

                <div className="bg-yellow-100 text-yellow-800 p-4 rounded-2xl mb-8 border border-yellow-200 shadow-sm">
                   <p className="font-black text-lg">+{datosTicket.puntosGanados} Puntos VIP 👑</p>
                   <p className="text-xs font-medium mt-1">Se han sumado a tu Wallet universal.</p>
                </div>

                <button onClick={() => {
                   setShowTicketModal(false);
                   setShowReviewModal(true);
                }} className="w-full bg-red-600 text-white font-black py-5 rounded-2xl shadow-lg text-xl active:scale-95 transition-transform">
                   Continuar
                </button>
              </div>
            </div>
          )}

          {showTimeoutModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[120] flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-[2.5rem] p-8 w-full max-w-md text-center animate-slide-up">
                <div className="text-6xl mb-4">👀</div>
                <h3 className="text-3xl font-black text-gray-800 mb-2 tracking-tighter">¿Sigues ahí?</h3>
                <p className="text-sm text-gray-500 mb-8 font-medium">Llevas un tiempo sin pedir nada en la mesa.</p>
                <button onClick={() => { setUltimaActividad(Date.now()); setShowTimeoutModal(false); }} className="w-full bg-green-500 text-white font-black py-5 rounded-2xl shadow-xl mb-4 text-xl">Sí, sigo aquí</button>
                <button onClick={finalizarYSalir} className="w-full bg-red-100 text-red-600 font-black py-5 rounded-2xl text-xl">No, ya me he ido</button>
              </div>
            </div>
          )}
          
          {showReviewModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[130] flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-[2.5rem] p-8 w-full max-w-md text-center animate-slide-up">
                <div className="text-5xl mb-4">⭐</div>
                <h3 className="text-3xl font-black text-gray-800 mb-2 tracking-tighter">¿Qué tal la comida?</h3>
                <p className="text-sm text-gray-500 mb-8 font-medium">Toca las estrellas para valorarnos.</p>
                <div className="flex justify-center gap-3 mb-10">
                  {[1,2,3,4,5].map(star => (
                    <button key={star} onClick={() => { window.open('https://maps.google.com', '_blank'); finalizarYSalir(); }} className="text-5xl text-yellow-400 active:scale-75 transition-transform">★</button>
                  ))}
                </div>
                <button onClick={finalizarYSalir} className="text-sm font-bold text-gray-400 uppercase tracking-widest">Saltar y Salir</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><MainApp /></ErrorBoundary>);
  </script>
</body>
</html>
