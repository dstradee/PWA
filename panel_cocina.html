<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocina Bokalia - KDS</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; user-select: none; overflow: hidden; }
    
    /* Animación de entrada de Ticket */
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.9) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    .ticket-enter { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    
    /* Animación de salida (Deslizar hacia arriba) */
    @keyframes slideOutUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(0.9); } }
    .ticket-exit { animation: slideOutUp 0.3s ease forwards; }

    /* Parpadeo urgente (Más de 15 min) */
    @keyframes urgentPulse { 
       0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 
       70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 
       100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } 
    }
    .ticket-urgente { animation: urgentPulse 1.5s infinite; border-color: #ef4444 !important; }

    /* SCROLLBAR ELEGANTE PARA EL TICKET */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  
  <div id="root">
     <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; color:#dc2626;">
       <h1 style="font-size:3rem; font-weight:900;">BOKALIA KDS</h1>
       <p style="font-weight:bold; margin-top:10px;">Iniciando panel de cocina...</p>
     </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 🔥 EL ID DE TU RESTAURANTE (Filtro Marca Blanca) 🔥
    const RESTAURANTE_ID = 'a5f65b60-0a06-4ed3-9c40-fbbf5f85901a';

    const supabase = window.supabase.createClient(
      'https://bswlriuzeintgjioywtz.supabase.co',
      'sb_publishable_oIWpn-mNPUZaQPdf7HNU_Q_Lc7R6UOB'
    );

    // ==========================================
    // COMPONENTE: TICKET DE COMANDA INDIVIDUAL
    // ==========================================
    const ComandaTicket = ({ ronda, onCompletar }) => {
      const [minutos, setMinutos] = useState(0);
      const [saliendo, setSaliendo] = useState(false);

      useEffect(() => {
        const calcularTiempo = () => {
           if (!ronda?.fecha) return;
           const diffMs = Date.now() - new Date(ronda.fecha).getTime();
           setMinutos(Math.floor(diffMs / 60000));
        };
        calcularTiempo();
        const intervalo = setInterval(calcularTiempo, 10000); 
        return () => clearInterval(intervalo);
      }, [ronda?.fecha]);

      const handleListo = () => {
         setSaliendo(true);
         setTimeout(() => onCompletar(ronda.id), 300); // Animación antes de borrar
      };

      let colorBorde = 'border-gray-300';
      let colorFondoCabecera = 'bg-gray-200 text-gray-800';
      let claseUrgencia = '';

      if (minutos >= 15) {
         colorBorde = 'border-red-500';
         colorFondoCabecera = 'bg-red-600 text-white';
         claseUrgencia = 'ticket-urgente';
      } else if (minutos >= 5) {
         colorBorde = 'border-amber-400';
         colorFondoCabecera = 'bg-amber-500 text-white';
      }

      const horaEntrada = ronda?.fecha ? new Date(ronda.fecha).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--';
      const numMesa = ronda?.sesion?.num_mesa || '?';
      const ticketId = ronda?.id ? ronda.id.split('-')[0] : '000';

      return (
         <div className={`bg-white rounded-2xl shadow-xl border-4 flex flex-col h-full max-h-full transition-colors ${colorBorde} ${saliendo ? 'ticket-exit' : 'ticket-enter'} ${claseUrgencia}`}>
            
            {/* CABECERA (Fija arriba) */}
            <div className={`px-5 py-4 flex justify-between items-center ${colorFondoCabecera} rounded-t-xl shrink-0`}>
               <div>
                  <h3 className="text-4xl font-black leading-none tracking-tighter">Mesa {numMesa}</h3>
                  <p className="text-xs font-bold uppercase tracking-widest opacity-90 mt-1">Ticket #{ticketId}</p>
               </div>
               <div className="text-right">
                  <p className="text-3xl font-black">{minutos}'</p>
                  <p className="text-xs font-bold opacity-80">{horaEntrada}</p>
               </div>
            </div>

            {/* COMIDA (Scrollable) */}
            <div className="p-5 flex-grow bg-[#fffdf8] overflow-y-auto min-h-0 custom-scrollbar">
               <ul className="space-y-4">
                  {ronda?.items?.map((item, idx) => (
                     <li key={idx} className="flex items-start gap-4 border-b border-gray-200 border-dashed pb-4 last:border-0 last:pb-0">
                        <span className="text-2xl font-black text-red-600 w-10 shrink-0 text-center bg-red-100 rounded-lg py-1">{item.cantidad}x</span>
                        <div className="flex-grow pt-1">
                           <span className="text-xl font-black text-gray-900 leading-tight block">{item.producto?.nombre || 'Producto'}</span>
                        </div>
                     </li>
                  ))}
               </ul>
            </div>

            {/* BOTÓN (Fijo abajo) */}
            <div className="p-4 bg-gray-50 border-t border-gray-200 rounded-b-xl shrink-0 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-10">
               <button onClick={handleListo} className="w-full bg-green-500 hover:bg-green-600 active:bg-green-700 text-white font-black text-2xl py-5 rounded-xl shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-3">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="4" d="M5 13l4 4L19 7"></path></svg>
                  MARCAR LISTO
               </button>
            </div>
         </div>
      );
    };

    // ==========================================
    // COMPONENTE PRINCIPAL: PANEL DE COCINA
    // ==========================================
    function CocinaPanel() {
      const [rondas, setRondas] = useState([]);
      const [conexionDb, setConexionDb] = useState('conectando');
      const [errorGlobal, setErrorGlobal] = useState(null);
      const [notifPerm, setNotifPerm] = useState('default');
      
      const rondasNotificadas = useRef(new Set());

      useEffect(() => {
         if ('Notification' in window) {
            setNotifPerm(Notification.permission);
         }
      }, []);

      const pedirNotificaciones = async () => {
         if (!('Notification' in window)) {
            alert("Tu tablet no soporta notificaciones nativas.");
            return;
         }
         try {
            const permission = await Notification.requestPermission();
            setNotifPerm(permission);
            if (permission === 'granted') alert("¡Notificaciones de Cocina activadas! 🔔");
         } catch (error) {
            console.error(error);
         }
      };

      const cargarComandas = async () => {
         try {
            // Buscamos solo las enviadas de NUESTRO restaurante
            const { data, error } = await supabase.from('pedidos_rondas')
               .select(`
                  id, fecha, estado,
                  sesion:sesiones_mesa!inner(num_mesa, restaurante_id),
                  items:items_pedido(cantidad, producto:productos(nombre))
               `)
               .eq('estado', 'enviado') 
               .eq('sesiones_mesa.restaurante_id', RESTAURANTE_ID)
               .order('fecha', { ascending: true }); 
               
            if (error) throw error;

            const rondasValidas = data.filter(r => r.items && r.items.length > 0 && r.sesion);
            setRondas(rondasValidas);
            setConexionDb('conectado');
            setErrorGlobal(null);
         } catch(e) {
            console.error("Error DB:", e);
            setConexionDb('desconectado');
         }
      };

      // WEBSOCKETS (Escuchar nuevos pedidos)
      useEffect(() => {
         cargarComandas();

         const canalCocina = supabase.channel('cocina_sync')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pedidos_rondas', filter: "estado=eq.enviado" }, async (payload) => {
               await cargarComandas();
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pedidos_rondas' }, (payload) => {
               if (payload.new.estado !== 'enviado') {
                  setRondas(prev => prev.filter(r => r.id !== payload.new.id));
               }
            })
            .subscribe((status) => {
               if (status === 'SUBSCRIBED') setConexionDb('conectado');
               else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') setConexionDb('desconectado');
            });

         // Inyección de Cafeína para que la pantalla no se duerma
         const pingInterval = setInterval(async () => {
            const { error } = await supabase.from('productos').select('id').limit(1);
            if (error) setConexionDb('desconectado');
            else if (conexionDb === 'desconectado') { setConexionDb('conectado'); cargarComandas(); }
         }, 15000);

         return () => {
            supabase.removeChannel(canalCocina);
            clearInterval(pingInterval);
         };
      }, [conexionDb]);

      // NOTIFICACIONES PUSH PARA COCINA
      useEffect(() => {
         rondas.forEach(ronda => {
            if (!rondasNotificadas.current.has(ronda.id)) {
               rondasNotificadas.current.add(ronda.id);
               if (notifPerm === 'granted') {
                  new Notification('👨‍🍳 ¡Nueva Comanda!', {
                     body: `La Mesa ${ronda.sesion?.num_mesa} acaba de enviar un pedido a cocina.`,
                     icon: 'https://cdn-icons-png.flaticon.com/512/3514/3514491.png'
                  });
               }
            }
         });
      }, [rondas, notifPerm]);

      // MARCAR COMO LISTO (Pasa a 'servido' en la base de datos)
      const handleCompletarComanda = async (rondaId) => {
         setRondas(prev => prev.filter(r => r.id !== rondaId));
         try {
            await supabase.from('pedidos_rondas').update({ estado: 'servido' }).eq('id', rondaId);
         } catch (error) {
            console.error("Error al completar ronda:", error);
            cargarComandas(); // Si falla, lo devuelve a la pantalla
         }
      };

      return (
         <div className="h-screen bg-gray-200 flex flex-col overflow-hidden">
            
            {/* CABECERA */}
            <header className="bg-white text-gray-900 p-5 shadow-sm flex justify-between items-center z-10 shrink-0">
               <div className="flex items-center gap-4">
                  <h1 className="text-3xl font-black tracking-widest text-red-600">BOKALIA <span className="text-gray-300">| COCINA</span></h1>
               </div>
               
               <div className="flex items-center gap-6">
                  {notifPerm !== 'granted' && (
                     <button onClick={pedirNotificaciones} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-sm transition-colors">
                        🔔 Activar Alertas
                     </button>
                  )}
                  
                  <div className="text-right border-r border-gray-300 pr-6 pl-4">
                     <p className="text-3xl font-black leading-none">{rondas.length}</p>
                     <p className="text-[10px] uppercase font-bold text-gray-500 tracking-widest">En Cola</p>
                  </div>
                  
                  <div className="flex items-center gap-3 bg-gray-100 px-5 py-2.5 rounded-full border border-gray-200 shadow-inner">
                     <span className={`w-4 h-4 rounded-full ${conexionDb === 'conectado' ? 'bg-green-500 shadow-[0_0_8px_#22c55e]' : 'bg-red-500 animate-pulse'}`}></span>
                     <span className="text-sm font-black text-gray-600 uppercase tracking-widest">
                        {conexionDb === 'conectado' ? 'SISTEMA ACTIVO' : 'RECONECTANDO...'}
                     </span>
                  </div>
               </div>
            </header>

            {/* CUADRÍCULA DE COMANDAS (Scroll horizontal) */}
            <main className="p-6 flex-grow overflow-x-auto overflow-y-hidden">
               {rondas.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center opacity-40">
                     <span className="text-9xl mb-6 grayscale">🍽️</span>
                     <p className="text-4xl font-black text-gray-500 tracking-tighter">Cocina despejada</p>
                     <p className="text-gray-400 font-bold mt-2">Esperando nuevas comandas...</p>
                  </div>
               ) : (
                  <div className="flex gap-6 h-full items-start" style={{ width: "max-content" }}>
                     {rondas.map(ronda => (
                        <div key={ronda.id} className="w-[22rem] shrink-0 h-full pb-4">
                           <ComandaTicket ronda={ronda} onCompletar={handleCompletarComanda} />
                        </div>
                     ))}
                  </div>
               )}
            </main>
         </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><CocinaPanel /></ErrorBoundary>);
  </script>
</body>
</html>
