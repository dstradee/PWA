<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocina Bokalia - KDS</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; margin: 0; user-select: none; }
    /* Animación de entrada de Ticket */
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
    .ticket-enter { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    
    /* Animación de salida (Deslizar hacia arriba) */
    @keyframes slideOutUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }
    .ticket-exit { animation: slideOutUp 0.3s ease forwards; }

    /* Parpadeo urgente (Más de 15 min) */
    @keyframes urgentPulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    .ticket-urgente { animation: urgentPulse 1.5s infinite; border-color: #ef4444 !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const supabase = window.supabase.createClient(
      'https://bswlriuzeintgjioywtz.supabase.co',
      'sb_publishable_oIWpn-mNPUZaQPdf7HNU_Q_Lc7R6UOB'
    );

    // COMPONENTE DE TICKET INDIVIDUAL
    const ComandaTicket = ({ ronda, onCompletar }) => {
      const [minutos, setMinutos] = useState(0);
      const [saliendo, setSaliendo] = useState(false);

      // Calculador de tiempo transcurrido
      useEffect(() => {
        const calcularTiempo = () => {
           const diffMs = Date.now() - new Date(ronda.fecha).getTime();
           setMinutos(Math.floor(diffMs / 60000));
        };
        calcularTiempo();
        const intervalo = setInterval(calcularTiempo, 10000); // Actualiza cada 10 seg
        return () => clearInterval(intervalo);
      }, [ronda.fecha]);

      const handleListo = () => {
         setSaliendo(true);
         setTimeout(() => onCompletar(ronda.id), 300); // Espera la animación antes de borrar
      };

      // Lógica de Urgencia (FIFO Visual)
      let colorBorde = 'border-gray-300';
      let colorFondoCabecera = 'bg-gray-100 text-gray-800';
      let claseUrgencia = '';

      if (minutos >= 15) {
         colorBorde = 'border-red-500';
         colorFondoCabecera = 'bg-red-600 text-white';
         claseUrgencia = 'ticket-urgente';
      } else if (minutos >= 5) {
         colorBorde = 'border-amber-400';
         colorFondoCabecera = 'bg-amber-500 text-white';
      }

      const horaEntrada = new Date(ronda.fecha).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

      return (
         <div className={`bg-white rounded-xl shadow-lg border-4 flex flex-col h-full transition-colors ${colorBorde} ${saliendo ? 'ticket-exit' : 'ticket-enter'} ${claseUrgencia}`}>
            
            {/* CABECERA */}
            <div className={`px-4 py-3 flex justify-between items-center ${colorFondoCabecera}`}>
               <div>
                  <h3 className="text-3xl font-black leading-none">Mesa {ronda.sesion?.num_mesa || '?'}</h3>
                  <p className="text-xs font-bold uppercase tracking-widest opacity-90 mt-1">Ticket #{ronda.id.split('-')[0]}</p>
               </div>
               <div className="text-right">
                  <p className="text-2xl font-black">{minutos}'</p>
                  <p className="text-xs font-bold opacity-80">{horaEntrada}</p>
               </div>
            </div>

            {/* CUERPO DEL TICKET (COMIDA) */}
            <div className="p-4 flex-grow bg-[#fffdf8]">
               <ul className="space-y-3">
                  {ronda.items?.map((item, idx) => (
                     <li key={idx} className="flex items-start gap-3 border-b border-gray-200 border-dashed pb-3 last:border-0 last:pb-0">
                        <span className="text-xl font-black text-red-600 w-8 text-center">{item.cantidad}x</span>
                        <div className="flex-grow">
                           <span className="text-lg font-bold text-gray-900 leading-tight">{item.producto?.nombre}</span>
                        </div>
                     </li>
                  ))}
               </ul>
            </div>

            {/* PIE DEL TICKET (ACCIÓN) */}
            <div className="p-3 bg-gray-50 border-t border-gray-200">
               <button onClick={handleListo} className="w-full bg-green-500 hover:bg-green-600 active:bg-green-700 text-white font-black text-2xl py-4 rounded-xl shadow-md transition-transform active:scale-95 flex items-center justify-center gap-2">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                  MARCAR LISTO
               </button>
            </div>
         </div>
      );
    };


    function CocinaPanel() {
      const [rondas, setRondas] = useState([]);
      const [audioUnlock, setAudioUnlock] = useState(false);
      const [conexionDb, setConexionDb] = useState('conectando');
      
      const audioCtxRef = useRef(null);

      // 1. ACTIVAR SONIDO AL ENTRAR (Bypassa restricciones de navegador)
      const inicializarCocina = () => {
         const AudioContext = window.AudioContext || window.webkitAudioContext;
         audioCtxRef.current = new AudioContext();
         const osc = audioCtxRef.current.createOscillator();
         osc.connect(audioCtxRef.current.destination);
         osc.start();
         osc.stop(audioCtxRef.current.currentTime + 0.01);
         setAudioUnlock(true);
      };

      // 2. TIMBRE DE COCINA (Web Audio API) - Sonido de "Campana de Servicio"
      const playCocinaBell = () => {
         if (!audioCtxRef.current || audioCtxRef.current.state !== 'running') return;
         
         const ctx = audioCtxRef.current;
         const t = ctx.currentTime;
         
         // Genera un 'Ding' doble muy limpio
         const ding = (timeOffset) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1046.50, t + timeOffset); // Nota C6
            gain.gain.setValueAtTime(0.5, t + timeOffset);
            gain.gain.exponentialRampToValueAtTime(0.01, t + timeOffset + 0.8);
            
            osc.start(t + timeOffset);
            osc.stop(t + timeOffset + 0.8);
         };

         ding(0);
         ding(0.15); // Doble ding
      };

      // 3. CARGAR COMANDAS PENDIENTES (FIFO - Más antiguas primero)
      const cargarComandas = async () => {
         try {
            const { data, error } = await supabase.from('pedidos_rondas')
               .select(`
                  id, fecha, estado,
                  sesion:sesiones_mesa(num_mesa),
                  items:items_pedido(cantidad, producto:productos(nombre))
               `)
               .eq('estado', 'enviado') // Solo las que mandó el cliente
               .order('fecha', { ascending: true }); // FIFO estricto
               
            if (error) throw error;
            setRondas(data.filter(r => r.items.length > 0 && r.sesion)); // Filtro de seguridad
            setConexionDb('conectado');
         } catch(e) {
            console.error("Error DB:", e);
            setConexionDb('desconectado');
         }
      };

      // 4. WEBSOCKETS (Escuchar nuevos pedidos)
      useEffect(() => {
         if (!audioUnlock) return;
         cargarComandas();

         const canalCocina = supabase.channel('cocina_sync')
            // Escucha cuando una ronda pasa a estado 'enviado' (Nueva Comanda)
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pedidos_rondas', filter: "estado=eq.enviado" }, async (payload) => {
               await cargarComandas();
               playCocinaBell(); // ¡SUENA LA CAMPANA!
            })
            // Escucha si algún compañero de cocina la borra/completa en otra pantalla
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pedidos_rondas' }, (payload) => {
               if (payload.new.estado !== 'enviado') {
                  setRondas(prev => prev.filter(r => r.id !== payload.new.id));
               }
            })
            .subscribe((status) => {
               if (status === 'SUBSCRIBED') setConexionDb('conectado');
               else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') setConexionDb('desconectado');
            });

         // Inyección de Cafeína para que la pantalla nunca se duerma
         const pingInterval = setInterval(async () => {
            const { error } = await supabase.from('productos').select('id').limit(1);
            if (error) setConexionDb('desconectado');
            else if (conexionDb === 'desconectado') { setConexionDb('conectado'); cargarComandas(); }
         }, 15000);

         return () => {
            supabase.removeChannel(canalCocina);
            clearInterval(pingInterval);
         };
      }, [audioUnlock, conexionDb]);

      // 5. ACCIÓN: MARCAR COMO LISTO (TERMINADO)
      const handleCompletarComanda = async (rondaId) => {
         // Eliminación optimista de la UI para mayor fluidez
         setRondas(prev => prev.filter(r => r.id !== rondaId));

         // Actualización silenciosa en la base de datos (Pasa a servido/listo)
         try {
            await supabase.from('pedidos_rondas').update({ estado: 'servido' }).eq('id', rondaId);
            // Al actualizar a 'servido', el móvil del cliente lo recibirá en su historial
         } catch (error) {
            console.error("Error al completar ronda:", error);
         }
      };

      // --- PANTALLA DE BLOQUEO AUDIO ---
      if (!audioUnlock) {
         return (
            <div className="h-screen bg-gray-900 flex flex-col items-center justify-center p-6 text-center text-white">
               <div className="text-8xl mb-8">👨‍🍳</div>
               <h1 className="text-5xl font-black mb-4 tracking-tighter">SISTEMA KDS BOKALIA</h1>
               <p className="text-gray-400 mb-12 text-xl max-w-lg font-medium">Toca el botón para inicializar la pantalla de cocina y activar el timbre de pedidos.</p>
               <button onClick={inicializarCocina} className="bg-green-500 hover:bg-green-600 active:scale-95 text-white font-black text-2xl py-6 px-16 rounded-[2rem] shadow-[0_10px_30px_rgba(34,197,94,0.4)] transition-all">
                  ACTIVAR COCINA
               </button>
            </div>
         );
      }

      // --- PANTALLA KDS PRINCIPAL ---
      return (
         <div className="min-h-screen bg-gray-900 flex flex-col overflow-hidden">
            
            {/* CABECERA OSCURA TIPO PANEL */}
            <header className="bg-black text-white p-4 flex justify-between items-center border-b border-gray-800">
               <div className="flex items-center gap-4">
                  <h1 className="text-3xl font-black tracking-widest text-red-600">BOKALIA <span className="text-white opacity-50">| KDS</span></h1>
               </div>
               
               <div className="flex items-center gap-6">
                  <div className="text-right">
                     <p className="text-2xl font-black leading-none">{rondas.length}</p>
                     <p className="text-[10px] uppercase font-bold text-gray-400 tracking-widest">En Cola</p>
                  </div>
                  
                  <div className="flex items-center gap-2 bg-gray-800 px-4 py-2 rounded-full border border-gray-700">
                     <span className={`w-3 h-3 rounded-full ${conexionDb === 'conectado' ? 'bg-green-500 shadow-[0_0_8px_#22c55e]' : 'bg-red-500 animate-pulse'}`}></span>
                     <span className="text-xs font-bold text-gray-300 uppercase tracking-widest">
                        {conexionDb === 'conectado' ? 'DB ACTIVA' : 'RECONECTANDO...'}
                     </span>
                  </div>
               </div>
            </header>

            {/* CUADRÍCULA DE COMANDAS (Hacia la derecha tipo Trello/Jira) */}
            <main className="p-6 flex-grow overflow-x-auto overflow-y-hidden">
               {rondas.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center opacity-30">
                     <span className="text-9xl mb-6">☕</span>
                     <p className="text-3xl font-black text-white">Cocina despejada</p>
                  </div>
               ) : (
                  <div className="flex gap-6 h-full items-start" style={{ width: "max-content" }}>
                     {rondas.map(ronda => (
                        <div key={ronda.id} className="w-80 shrink-0 h-full max-h-[85vh]">
                           <ComandaTicket ronda={ronda} onCompletar={handleCompletarComanda} />
                        </div>
                     ))}
                  </div>
               )}
            </main>
         </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><CocinaPanel /></ErrorBoundary>);
  </script>
</body>
</html>
