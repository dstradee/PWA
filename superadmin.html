<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bokalia SuperAdmin</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 🔥 IDENTIDAD VISUAL BOKALIA 🔥 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bokalia: {
              coral: '#e25e4c',  
              cream: '#fdfbf7',  
              beige: '#f4ede5',  
              dark: '#302b28'    
            }
          },
          boxShadow: {
            'elegant': '0 8px 30px rgba(0, 0, 0, 0.04)',
            'elegant-lg': '0 15px 40px rgba(0, 0, 0, 0.06)',
          }
        }
      }
    }
  </script>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #fdfbf7; margin: 0; }
    .animate-fade-in { animation: fadeIn 0.3s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    
    .bg-texture {
       background-color: #fdfbf7;
       background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23e25e4c' fill-opacity='0.02' fill-rule='evenodd'%3E%3Ccircle cx='3' cy='3' r='1'/%3E%3Ccircle cx='13' cy='13' r='1'/%3E%3C/g%3E%3C/svg%3E");
    }
  </style>
</head>
<body class="text-bokalia-dark bg-texture">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const supabase = window.supabase.createClient(
      'https://bswlriuzeintgjioywtz.supabase.co',
      'sb_publishable_oIWpn-mNPUZaQPdf7HNU_Q_Lc7R6UOB'
    );

    const CLOUDINARY_CLOUD_NAME = "nubfpnio";
    const CLOUDINARY_UPLOAD_PRESET = "ml_default"; 

    function SuperAdminApp() {
      // 🔥 ESTADOS DE SEGURIDAD 🔥
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [isVerifying, setIsVerifying] = useState(false);

      const [vista, setVista] = useState('dashboard'); 
      const [subVista, setSubVista] = useState('platos'); 
      
      const [restaurantes, setRestaurantes] = useState([]);
      const [restauranteActivo, setRestauranteActivo] = useState(null);
      
      const [productos, setProductos] = useState([]);
      const [recompensas, setRecompensas] = useState([]); 
      const [niveles, setNiveles] = useState([]); 
      const [notificaciones, setNotificaciones] = useState([]);

      const [loading, setLoading] = useState(true);

      const [nuevoRestNombre, setNuevoRestNombre] = useState('');
      const [nuevoRestColor, setNuevoRestColor] = useState('#e25e4c'); 

      // Formularios
      const [prodNombre, setProdNombre] = useState('');
      const [prodDesc, setProdDesc] = useState('');
      const [prodPrecio, setProdPrecio] = useState('');
      const [prodImg, setProdImg] = useState('');
      const [prodCat, setProdCat] = useState('Principal');

      const [recTitulo, setRecTitulo] = useState('');
      const [recDesc, setRecDesc] = useState('');
      const [recCoste, setRecCoste] = useState('');
      const [recImg, setRecImg] = useState('');

      const [nivNombre, setNivNombre] = useState('');
      const [nivPuntos, setNivPuntos] = useState('');
      const [nivColor, setNivColor] = useState('#eab308');

      const [notiTitulo, setNotiTitulo] = useState('');
      const [notiMensaje, setNotiMensaje] = useState('');
      const [notiDestino, setNotiDestino] = useState('global');

      useEffect(() => { 
         // Comprobar si ya estamos logueados en este ordenador
         if (localStorage.getItem('bokalia_admin_vip') === 'true') {
            setIsAuthenticated(true);
         }
         cargarRestaurantes(); 
      }, []);

      useEffect(() => {
         if (vista === 'notificaciones' && isAuthenticated) cargarNotificaciones();
      }, [vista, isAuthenticated]);

      // 🔥 LÓGICA DE SEGURIDAD (PIN)
      const verificarPin = async (e) => {
         e.preventDefault();
         setIsVerifying(true);
         const { data, error } = await supabase.rpc('validar_pin_superadmin', { pin_intento: pinInput });
         setIsVerifying(false);
         
         if (data === true) {
            localStorage.setItem('bokalia_admin_vip', 'true');
            setIsAuthenticated(true);
         } else {
            alert("❌ PIN Incorrecto o no autorizado.");
            setPinInput('');
         }
      };

      const cerrarSesionSegura = () => {
         localStorage.removeItem('bokalia_admin_vip');
         setIsAuthenticated(false);
         setPinInput('');
      };

      const cargarRestaurantes = async () => {
        setLoading(true);
        const { data } = await supabase.from('restaurantes').select('*').order('creado_en', { ascending: false });
        if (data) setRestaurantes(data);
        setLoading(false);
      };

      const crearRestaurante = async (e) => {
        e.preventDefault();
        if (!nuevoRestNombre) return;
        const { data, error } = await supabase.from('restaurantes').insert([{ nombre: nuevoRestNombre, color_tema: nuevoRestColor }]).select().single();
        if (data) {
           setRestaurantes([data, ...restaurantes]);
           setNuevoRestNombre(''); setNuevoRestColor('#e25e4c');
           alert("✅ Restaurante creado con éxito");
        } else alert("Error: " + error.message);
      };

      const borrarRestaurante = async (id, nombre) => {
         const confirmacion = window.prompt(`⚠️ PELIGRO EXTREMO: Vas a borrar el restaurante "${nombre}" y TODOS sus platos, recompensas y niveles.\n\nEscribe la palabra BORRAR (en mayúsculas) para confirmar:`);
         if (confirmacion !== 'BORRAR') return alert("Borrado cancelado. La palabra no coincide.");
         
         setLoading(true);
         try {
            await supabase.from('productos').delete().eq('restaurante_id', id);
            await supabase.from('recompensas').delete().eq('restaurante_id', id);
            await supabase.from('niveles_membresia').delete().eq('restaurante_id', id);
            await supabase.from('notificaciones').delete().eq('restaurante_id', id);
            
            const { error } = await supabase.from('restaurantes').delete().eq('id', id);
            if (error) throw error;

            setRestaurantes(restaurantes.filter(r => r.id !== id));
            if (restauranteActivo?.id === id) { setRestauranteActivo(null); setVista('dashboard'); }
            alert("🗑️ Restaurante eliminado por completo.");
         } catch(e) { alert("Error al borrar el restaurante: " + e.message); }
         setLoading(false);
      };

      const editarColor = async (id, colorNuevo) => {
         const { error } = await supabase.from('restaurantes').update({ color_tema: colorNuevo }).eq('id', id);
         if (!error) setRestaurantes(restaurantes.map(r => r.id === id ? { ...r, color_tema: colorNuevo } : r));
      };

      const abrirRestaurante = async (rest) => {
         setRestauranteActivo(rest);
         setVista('restaurante');
         setSubVista('platos'); 
         const { data: prods } = await supabase.from('productos').select('*').eq('restaurante_id', rest.id).order('categoria');
         if (prods) setProductos(prods);
         const { data: recs } = await supabase.from('recompensas').select('*').eq('restaurante_id', rest.id).order('coste_puntos');
         if (recs) setRecompensas(recs);
         const { data: nivs } = await supabase.from('niveles_membresia').select('*').eq('restaurante_id', rest.id).order('puntos_minimos');
         if (nivs) setNiveles(nivs);
      };

      const abrirCloudinary = (destino = 'producto') => {
         if (!window.cloudinary) return alert("El servicio de imágenes aún está cargando.");
         const widget = window.cloudinary.createUploadWidget({
            cloudName: CLOUDINARY_CLOUD_NAME, uploadPreset: CLOUDINARY_UPLOAD_PRESET,
            sources: ['local', 'url', 'camera'], multiple: false, clientAllowedFormats: ['image'], maxImageFileSize: 5000000 
         }, (error, result) => {
            if (!error && result && result.event === "success") {
               if (destino === 'recompensa') setRecImg(result.info.secure_url);
               else setProdImg(result.info.secure_url);
            }
         });
         widget.open();
      };

      const añadirProducto = async (e) => {
         e.preventDefault();
         if (!prodNombre || !prodPrecio) return;
         const nuevoProd = { restaurante_id: restauranteActivo.id, nombre: prodNombre, descripcion: prodDesc, precio: parseFloat(prodPrecio.replace(',','.')), imagen_url: prodImg || 'https://via.placeholder.com/500', categoria: prodCat, activo: true };
         const { data, error } = await supabase.from('productos').insert([nuevoProd]).select().single();
         if (data) {
            setProductos([...productos, data]);
            setProdNombre(''); setProdDesc(''); setProdPrecio(''); setProdImg('');
            alert("🍔 Producto añadido al menú");
         } else alert("Error: " + error.message);
      };
      const borrarProducto = async (id) => {
         if (window.confirm("¿Borrar este plato?")) {
            await supabase.from('productos').delete().eq('id', id);
            setProductos(productos.filter(p => p.id !== id));
         }
      };

      const añadirRecompensa = async (e) => {
         e.preventDefault();
         if (!recTitulo || !recCoste) return;
         const nuevaRec = { restaurante_id: restauranteActivo.id, titulo: recTitulo, descripcion: recDesc, coste_puntos: parseInt(recCoste), imagen_url: recImg || 'https://via.placeholder.com/500', activo: true };
         const { data, error } = await supabase.from('recompensas').insert([nuevaRec]).select().single();
         if (data) {
            setRecompensas([...recompensas, data].sort((a,b) => a.coste_puntos - b.coste_puntos));
            setRecTitulo(''); setRecDesc(''); setRecCoste(''); setRecImg('');
            alert("🎁 Recompensa añadida");
         } else alert("Error: " + error.message);
      };
      const borrarRecompensa = async (id) => {
         if (window.confirm("¿Borrar esta recompensa?")) {
            await supabase.from('recompensas').delete().eq('id', id);
            setRecompensas(recompensas.filter(r => r.id !== id));
         }
      };

      const añadirNivel = async (e) => {
         e.preventDefault();
         if (!nivNombre || !nivPuntos) return;
         const nuevoNivel = { restaurante_id: restauranteActivo.id, nombre: nivNombre, puntos_minimos: parseInt(nivPuntos), color: nivColor };
         const { data, error } = await supabase.from('niveles_membresia').insert([nuevoNivel]).select().single();
         if (data) {
            setNiveles([...niveles, data].sort((a,b) => a.puntos_minimos - b.puntos_minimos));
            setNivNombre(''); setNivPuntos(''); setNivColor('#eab308');
            alert("⭐ Rango VIP creado");
         } else alert("Error: " + error.message);
      };
      const borrarNivel = async (id) => {
         if (window.confirm("¿Borrar este rango VIP?")) {
            await supabase.from('niveles_membresia').delete().eq('id', id);
            setNiveles(niveles.filter(n => n.id !== id));
         }
      };

      const cargarNotificaciones = async () => {
         const hace24h = new Date(); hace24h.setHours(hace24h.getHours() - 24);
         await supabase.from('notificaciones').delete().lt('creado_en', hace24h.toISOString());
         const { data } = await supabase.from('notificaciones').select('*, restaurante:restaurantes(nombre)').order('creado_en', { ascending: false });
         if (data) setNotificaciones(data);
      };
      const enviarNotificacion = async (e) => {
         e.preventDefault();
         if (!notiTitulo || !notiMensaje) return;
         const esGlobal = notiDestino === 'global';
         const restId = esGlobal ? null : notiDestino;
         const nuevaNoti = { titulo: notiTitulo, mensaje: notiMensaje, es_global: esGlobal, restaurante_id: restId };
         const { data, error } = await supabase.from('notificaciones').insert([nuevaNoti]).select('*, restaurante:restaurantes(nombre)').single();
         if (data) {
            setNotificaciones([data, ...notificaciones]);
            setNotiTitulo(''); setNotiMensaje('');
            alert("📣 Notificación lanzada a la red con éxito.");
         } else alert("Error: " + error.message);
      };

      const copiarId = (id) => { navigator.clipboard.writeText(id); alert("🔑 ID Copiado:\n" + id); };
      const formatDate = (dateStr) => { const d = new Date(dateStr); return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; };

      if (loading) return (
         <div className="h-screen flex items-center justify-center flex-col bg-texture">
            <div className="w-16 h-16 border-4 border-bokalia-beige border-t-bokalia-coral rounded-full animate-spin mb-6"></div>
         </div>
      );

      // 🔥 PANTALLA DE BLOQUEO (SI NO ESTÁ AUTENTICADO)
      if (!isAuthenticated) {
         return (
            <div className="min-h-screen flex items-center justify-center p-4 bg-texture animate-fade-in">
               <div className="bg-white p-10 rounded-[2.5rem] shadow-elegant-lg max-w-sm w-full text-center border border-bokalia-beige">
                  <div className="text-4xl mb-4">🔒</div>
                  <h1 className="text-3xl font-black text-bokalia-coral mb-2 tracking-tighter">BOKALIA OS</h1>
                  <p className="text-gray-500 font-medium mb-8 text-sm">Acceso Restringido</p>
                  
                  <form onSubmit={verificarPin}>
                     <input 
                        type="password" 
                        value={pinInput} 
                        onChange={e => setPinInput(e.target.value)} 
                        placeholder="••••••" 
                        className="w-full bg-bokalia-cream border border-bokalia-beige p-4 rounded-2xl text-center text-3xl tracking-[0.5em] font-black text-bokalia-dark outline-none focus:border-bokalia-coral mb-6 transition-colors" 
                        autoFocus 
                     />
                     <button type="submit" disabled={isVerifying} className="w-full bg-bokalia-coral text-white font-bold py-4 rounded-2xl active:scale-95 transition-transform shadow-lg shadow-bokalia-coral/30">
                        {isVerifying ? 'Verificando...' : 'Desbloquear Panel'}
                     </button>
                  </form>
               </div>
            </div>
         );
      }

      // 🔥 PANEL SUPERADMIN (SI ESTÁ AUTENTICADO)
      return (
         <div className="min-h-screen flex flex-col md:flex-row bg-texture">
            
            {/* SIDEBAR CORPORATIVO */}
            <aside className="w-full md:w-64 bg-bokalia-dark text-white flex flex-col shadow-2xl z-10 shrink-0">
               <div className="p-8 border-b border-white/10 text-center md:text-left">
                  <h1 className="text-3xl font-black text-bokalia-cream tracking-tighter">BOKALIA</h1>
                  <p className="text-[10px] font-bold text-bokalia-coral uppercase tracking-widest mt-1">SuperAdmin OS</p>
               </div>
               <nav className="p-4 flex-grow space-y-2">
                  <button onClick={() => setVista('dashboard')} className={`w-full text-left px-5 py-4 rounded-2xl font-bold transition-all ${vista === 'dashboard' || vista === 'restaurante' ? 'bg-bokalia-coral text-white shadow-lg shadow-bokalia-coral/20' : 'text-gray-400 hover:bg-white/5'}`}>🏢 Mis Locales</button>
                  <button onClick={() => setVista('notificaciones')} className={`w-full text-left px-5 py-4 rounded-2xl font-bold transition-all flex items-center gap-2 ${vista === 'notificaciones' ? 'bg-bokalia-coral text-white shadow-lg shadow-bokalia-coral/20' : 'text-gray-400 hover:bg-white/5'}`}>📣 Avisos Push</button>
               </nav>
               
               {/* BOTÓN CERRAR SESIÓN SEGURA */}
               <div className="p-4 border-t border-white/10">
                  <button onClick={cerrarSesionSegura} className="w-full text-center px-4 py-3 rounded-xl font-bold text-gray-500 hover:text-white hover:bg-white/5 transition-colors text-sm">
                     Cerrar Sesión Segura
                  </button>
               </div>
            </aside>

            <main className="flex-grow p-6 md:p-10 overflow-y-auto animate-fade-in">
               
               {vista === 'dashboard' && (
                  <div className="max-w-5xl mx-auto animate-fade-in">
                     <h2 className="text-3xl font-black text-bokalia-dark mb-8 tracking-tight">Tus Restaurantes</h2>
                     
                     <form onSubmit={crearRestaurante} className="bg-white p-6 rounded-[2rem] shadow-elegant border border-bokalia-beige mb-10 flex flex-col md:flex-row gap-4 items-center">
                        <input type="text" placeholder="Nombre del nuevo local..." required value={nuevoRestNombre} onChange={e => setNuevoRestNombre(e.target.value)} className="flex-grow bg-bokalia-cream border border-bokalia-beige p-4 rounded-2xl font-bold outline-none focus:border-bokalia-coral w-full transition-colors" />
                        <div className="flex items-center gap-3 bg-bokalia-cream p-3 rounded-2xl border border-bokalia-beige w-full md:w-auto">
                           <label className="text-xs font-bold text-gray-500 uppercase tracking-widest">Color:</label>
                           <input type="color" value={nuevoRestColor} onChange={e => setNuevoRestColor(e.target.value)} className="w-10 h-10 rounded-xl cursor-pointer border-0 p-0" />
                        </div>
                        <button type="submit" className="bg-bokalia-dark hover:bg-black text-white font-bold px-8 py-4 rounded-2xl w-full md:w-auto active:scale-95 transition-transform shadow-lg">Crear Local</button>
                     </form>
                     
                     <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {restaurantes.map(r => (
                           <div key={r.id} className="bg-white p-8 rounded-[2rem] shadow-elegant border border-bokalia-beige relative group flex flex-col h-full">
                              
                              <button onClick={() => borrarRestaurante(r.id, r.nombre)} className="absolute top-6 right-6 text-gray-300 hover:text-red-500 transition-colors" title="Borrar Restaurante">
                                 <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                              </button>

                              <div className="flex justify-between items-start mb-6 pr-10">
                                 <div className="flex items-center gap-3">
                                    <div className="w-3 h-10 rounded-full" style={{ backgroundColor: r.color_tema || '#e25e4c' }}></div>
                                    <h3 className="text-2xl font-black text-bokalia-dark">{r.nombre}</h3>
                                 </div>
                                 <input type="color" defaultValue={r.color_tema || '#e25e4c'} onBlur={e => editarColor(r.id, e.target.value)} className="w-8 h-8 rounded-lg cursor-pointer opacity-50 hover:opacity-100 transition-opacity" title="Cambiar color" />
                              </div>

                              <div className="bg-bokalia-cream p-4 rounded-2xl border border-bokalia-beige mb-8 flex justify-between items-center cursor-pointer hover:bg-bokalia-beige transition-colors" onClick={() => copiarId(r.id)}>
                                 <div>
                                    <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">ID del Restaurante</p>
                                    <p className="text-sm font-mono text-gray-700 truncate max-w-[200px]">{r.id}</p>
                                 </div>
                                 <span className="text-xl opacity-50">📋</span>
                              </div>

                              <button onClick={() => abrirRestaurante(r)} className="mt-auto w-full bg-bokalia-coral text-white font-bold py-4 rounded-2xl active:scale-95 transition-transform shadow-lg shadow-bokalia-coral/20">Entrar al Panel →</button>
                           </div>
                        ))}
                     </div>
                  </div>
               )}

               {vista === 'restaurante' && restauranteActivo && (
                  <div className="max-w-5xl mx-auto animate-fade-in">
                     <button onClick={() => setVista('dashboard')} className="text-gray-400 font-bold hover:text-bokalia-dark mb-6 flex items-center gap-2 transition-colors">
                        ← Volver a locales
                     </button>
                     <div className="mb-8 flex flex-col md:flex-row md:items-end justify-between border-b border-bokalia-beige pb-6">
                        <div className="flex items-center gap-3">
                           <div className="w-4 h-12 rounded-full" style={{ backgroundColor: restauranteActivo.color_tema || '#e25e4c' }}></div>
                           <div>
                              <h2 className="text-4xl font-black text-bokalia-dark tracking-tight">{restauranteActivo.nombre}</h2>
                              <p className="text-gray-500 font-medium mt-1">Panel de Control</p>
                           </div>
                        </div>
                        <div className="flex gap-2 mt-6 md:mt-0 flex-wrap bg-white p-2 rounded-2xl shadow-sm border border-bokalia-beige">
                           <button onClick={() => setSubVista('platos')} className={`px-6 py-2.5 rounded-xl font-bold transition-colors ${subVista === 'platos' ? 'bg-bokalia-coral text-white shadow-md' : 'text-gray-500 hover:bg-bokalia-cream'}`}>🍽️ Menú</button>
                           <button onClick={() => setSubVista('recompensas')} className={`px-6 py-2.5 rounded-xl font-bold transition-colors ${subVista === 'recompensas' ? 'bg-bokalia-coral text-white shadow-md' : 'text-gray-500 hover:bg-bokalia-cream'}`}>🎁 Premios</button>
                           <button onClick={() => setSubVista('niveles')} className={`px-6 py-2.5 rounded-xl font-bold transition-colors ${subVista === 'niveles' ? 'bg-bokalia-coral text-white shadow-md' : 'text-gray-500 hover:bg-bokalia-cream'}`}>⭐ Rangos</button>
                        </div>
                     </div>

                     {/* VISTAS INTERNAS DEL LOCAL (El código funcional es idéntico, solo adaptamos las clases Tailwind) */}
                     {subVista === 'platos' && (
                        <div className="flex flex-col lg:flex-row gap-8 animate-fade-in">
                           <div className="lg:w-1/3">
                              <form onSubmit={añadirProducto} className="bg-white p-8 rounded-[2.5rem] shadow-elegant border border-bokalia-beige sticky top-6">
                                 <h3 className="text-xl font-black text-bokalia-dark mb-6 tracking-tight">Añadir Plato</h3>
                                 <div className="space-y-5">
                                    <div>
                                       <label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-2">Foto del plato</label>
                                       <div className="flex flex-col items-center justify-center p-6 border-2 border-dashed border-bokalia-beige rounded-2xl bg-bokalia-cream mb-2">
                                          {prodImg ? <img src={prodImg} className="h-32 w-full object-cover rounded-xl mb-4 shadow-sm border border-bokalia-beige"/> : <span className="text-4xl opacity-30 mb-4">📸</span>}
                                          <button type="button" onClick={() => abrirCloudinary('producto')} className="bg-white text-bokalia-dark border border-bokalia-beige text-xs font-bold px-5 py-2.5 rounded-xl shadow-sm hover:bg-gray-50">{prodImg ? 'Cambiar Foto' : 'Subir Imagen'}</button>
                                       </div>
                                       <input type="url" value={prodImg} onChange={e => setProdImg(e.target.value)} placeholder="O pega el enlace manual..." className="w-full text-xs text-gray-500 p-3 bg-bokalia-cream rounded-xl outline-none focus:border-bokalia-coral border border-transparent transition-colors" />
                                    </div>
                                    <div><label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">Nombre</label><input type="text" required value={prodNombre} onChange={e => setProdNombre(e.target.value)} className="w-full bg-bokalia-cream p-4 rounded-xl border border-bokalia-beige outline-none focus:border-bokalia-coral font-bold" /></div>
                                    <div className="flex gap-4">
                                       <div className="w-1/2"><label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">Precio (€)</label><input type="number" step="0.01" required value={prodPrecio} onChange={e => setProdPrecio(e.target.value)} className="w-full bg-bokalia-cream p-4 rounded-xl border border-bokalia-beige outline-none focus:border-bokalia-coral font-bold" /></div>
                                       <div className="w-1/2"><label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">Categoría</label>
                                          <select value={prodCat} onChange={e => setProdCat(e.target.value)} className="w-full bg-bokalia-cream p-4 rounded-xl border border-bokalia-beige outline-none focus:border-bokalia-coral font-bold text-sm"><option>Principal</option><option>Entrantes</option><option>Bebidas</option><option>Postres</option></select>
                                       </div>
                                    </div>
                                    <div><label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">Descripción</label><textarea value={prodDesc} onChange={e => setProdDesc(e.target.value)} className="w-full bg-bokalia-cream p-4 rounded-xl border border-bokalia-beige outline-none focus:border-bokalia-coral resize-none" rows="2"></textarea></div>
                                 </div>
                                 <button type="submit" className="w-full bg-bokalia-dark text-white font-bold py-4 rounded-2xl mt-8 shadow-lg active:scale-95 transition-transform">Guardar Plato</button>
                              </form>
                           </div>
                           <div className="lg:w-2/3 grid grid-cols-1 sm:grid-cols-2 gap-5">
                              {productos.map(p => (
                                 <div key={p.id} className="bg-white rounded-3xl shadow-elegant border border-bokalia-beige overflow-hidden flex flex-col relative group">
                                    <div className="h-48 bg-bokalia-cream relative">
                                       <img src={p.imagen_url} className="w-full h-full object-cover"/>
                                       <div className="absolute inset-0 bg-bokalia-dark/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-sm">
                                          <button onClick={() => borrarProducto(p.id)} className="bg-white text-red-500 px-6 py-3 rounded-xl font-bold shadow-lg active:scale-95">Eliminar Plato</button>
                                       </div>
                                    </div>
                                    <div className="p-5 flex flex-col flex-grow">
                                       <div className="flex justify-between items-start mb-2">
                                          <h4 className="font-bold text-bokalia-dark leading-tight pr-2 text-lg">{p.nombre}</h4>
                                          <span className="bg-bokalia-cream text-gray-500 text-[10px] font-bold px-2.5 py-1 rounded-md uppercase tracking-widest border border-bokalia-beige">{p.categoria}</span>
                                       </div>
                                       <p className="text-gray-500 text-sm font-medium mb-6 line-clamp-2 leading-relaxed">{p.descripcion || 'Sin descripción'}</p>
                                       <p className="text-2xl font-black text-bokalia-coral mt-auto">{p.precio}€</p>
                                    </div>
                                 </div>
                              ))}
                           </div>
                        </div>
                     )}

                     {subVista === 'recompensas' && (
                        <div className="flex flex-col lg:flex-row gap-8 animate-fade-in">
                           <div className="lg:w-1/3">
                              <form onSubmit={añadirRecompensa} className="bg-white p-8 rounded-[2.5rem] shadow-elegant border border-bokalia-beige sticky top-6">
                                 <h3 className="text-xl font-black text-bokalia-dark mb-6 tracking-tight">Añadir Premio VIP</h3>
                                 <div className="space-y-5">
                                    <div>
                                       <label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-2">Foto (Opcional)</label>
                                       <div className="flex flex-col items-center justify-center p-6 border-2 border-dashed border-bokalia-beige rounded-2xl bg-bokalia-cream mb-2">
                                          {recImg ? <img src={recImg} className="h-32 w-full object-cover rounded-xl mb-4 shadow-sm border border-bokalia-beige"/> : <span className="text-4xl opacity-30 mb-4">🎁</span>}
                                          <button type="button" onClick={() => abrirCloudinary('recompensa')} className="bg-white text-bokalia-dark border border-bokalia-beige text-xs font-bold px-5 py-2.5 rounded-xl shadow-sm hover:bg-gray-50">{recImg ? 'Cambiar Foto' : 'Subir Imagen'}</button>
                                       </div>
                                    </div>
                                    <div><label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">Título del Premio</label><input type="text" required value={recTitulo} onChange={e => setRecTitulo(e.target.value)} className="w-full bg-bokalia-cream p-4 rounded-xl border border-bokalia-beige outline-none focus:border-bokalia-coral font-bold" /></div>
                                    <div><label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">Coste en Puntos</label><input type="number" required value={recCoste} onChange={e => setRecCoste(e.target.value)} className="w-full bg-bokalia-cream p-4 rounded-xl border border-bokalia-beige outline-none focus:border-bokalia-coral font-black text-bokalia-coral text-xl" /></div>
                                    <div><label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">Descripción</label><textarea value={recDesc} onChange={e => setRecDesc(e.target.value)} className="w-full bg-bokalia-cream p-4 rounded-xl border border-bokalia-beige outline-none focus:border-bokalia-coral resize-none" rows="2"></textarea></div>
                                 </div>
                                 <button type="submit" className="w-full bg-bokalia-coral text-white font-bold py-4 rounded-2xl mt-8 shadow-lg shadow-bokalia-coral/30 active:scale-95 transition-transform">Guardar Premio</button>
                              </form>
                           </div>
                           <div className="lg:w-2/3">
                              {recompensas.length === 0 ? (
                                 <div className="bg-white rounded-[2.5rem] p-12 text-center border border-bokalia-beige shadow-sm"><div className="text-6xl mb-4 opacity-50">💎</div><h3 className="text-xl font-bold text-bokalia-dark">Sin premios creados</h3></div>
                              ) : (
                                 <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                    {recompensas.map(r => (
                                       <div key={r.id} className="bg-white rounded-3xl shadow-elegant border border-bokalia-beige overflow-hidden flex flex-col relative group">
                                          <div className="h-40 bg-bokalia-cream relative">
                                             <img src={r.imagen_url} className="w-full h-full object-cover"/>
                                             <div className="absolute inset-0 bg-bokalia-dark/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-sm z-10">
                                                <button onClick={() => borrarRecompensa(r.id)} className="bg-white text-red-500 px-6 py-3 rounded-xl font-bold shadow-lg active:scale-95">Eliminar</button>
                                             </div>
                                          </div>
                                          <div className="p-5 flex flex-col flex-grow">
                                             <h4 className="font-bold text-bokalia-dark leading-tight text-lg mb-2">{r.titulo}</h4>
                                             <p className="text-gray-500 text-sm font-medium mb-6 line-clamp-2 leading-relaxed">{r.descripcion || 'Sin condiciones.'}</p>
                                             <div className="mt-auto flex justify-between items-end border-t border-bokalia-beige pt-4">
                                                <span className="text-[10px] uppercase font-bold text-gray-400 tracking-widest">Coste VIP</span>
                                                <span className="text-2xl font-black text-bokalia-coral">{r.coste_puntos} <span className="text-sm">pts</span></span>
                                             </div>
                                          </div>
                                       </div>
                                    ))}
                                 </div>
                              )}
                           </div>
                        </div>
                     )}

                     {subVista === 'niveles' && (
                        <div className="flex flex-col lg:flex-row gap-8 animate-fade-in">
                           <div className="lg:w-1/3">
                              <form onSubmit={añadirNivel} className="bg-white p-8 rounded-[2.5rem] shadow-elegant border border-bokalia-beige sticky top-6">
                                 <h3 className="text-xl font-black text-bokalia-dark mb-6 tracking-tight">Nuevo Rango VIP</h3>
                                 <div className="space-y-5">
                                    <div><label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">Nombre del Rango</label><input type="text" required value={nivNombre} onChange={e => setNivNombre(e.target.value)} className="w-full bg-bokalia-cream p-4 rounded-xl border border-bokalia-beige outline-none focus:border-bokalia-coral font-bold" /></div>
                                    <div><label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">Puntos Mínimos</label><input type="number" required value={nivPuntos} onChange={e => setNivPuntos(e.target.value)} className="w-full bg-bokalia-cream p-4 rounded-xl border border-bokalia-beige outline-none focus:border-bokalia-coral font-bold" /></div>
                                    <div>
                                       <label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-2">Color Identificativo</label>
                                       <div className="flex items-center gap-4 bg-bokalia-cream p-3 rounded-2xl border border-bokalia-beige">
                                          <input type="color" value={nivColor} onChange={e => setNivColor(e.target.value)} className="w-12 h-12 rounded-xl cursor-pointer border-0 p-0 shadow-sm" />
                                          <span className="font-mono text-sm font-bold text-gray-600">{nivColor}</span>
                                       </div>
                                    </div>
                                 </div>
                                 <button type="submit" className="w-full bg-bokalia-dark text-white font-bold py-4 rounded-2xl mt-8 shadow-lg active:scale-95 transition-transform">Crear Rango</button>
                              </form>
                           </div>
                           <div className="lg:w-2/3">
                              {niveles.length === 0 ? (
                                 <div className="bg-white rounded-[2.5rem] p-12 text-center border border-bokalia-beige shadow-sm"><div className="text-6xl mb-4 opacity-50">⭐</div><h3 className="text-xl font-bold text-bokalia-dark">Sin rangos definidos</h3></div>
                              ) : (
                                 <div className="space-y-4">
                                    {niveles.map((n, idx) => (
                                       <div key={n.id} className="bg-white p-6 rounded-[2rem] shadow-elegant border border-bokalia-beige flex justify-between items-center group">
                                          <div className="flex items-center gap-5">
                                             <div className="w-14 h-14 rounded-2xl flex items-center justify-center font-black text-white text-2xl shadow-md" style={{ backgroundColor: n.color }}>{idx + 1}</div>
                                             <div>
                                                <h4 className="font-black text-bokalia-dark text-xl">{n.nombre}</h4>
                                                <p className="text-sm font-medium text-gray-500 mt-1">Desde <span className="font-bold" style={{ color: n.color }}>{n.puntos_minimos} pts</span></p>
                                             </div>
                                          </div>
                                          <button onClick={() => borrarNivel(n.id)} className="bg-gray-50 text-gray-400 font-bold px-5 py-3 rounded-xl hover:bg-red-50 hover:text-red-500 transition-colors border border-gray-100">Eliminar</button>
                                       </div>
                                    ))}
                                 </div>
                              )}
                           </div>
                        </div>
                     )}
                  </div>
               )}

               {/* ======================= VISTA NOTIFICACIONES PUSH ======================= */}
               {vista === 'notificaciones' && (
                  <div className="max-w-5xl mx-auto animate-fade-in">
                     <h2 className="text-4xl font-black text-bokalia-dark mb-3 tracking-tight">Centro de Avisos</h2>
                     <p className="text-gray-500 font-medium mb-10">Envía notificaciones push a tus clientes. <b className="text-bokalia-coral">El historial se limpia cada 24h.</b></p>

                     <div className="flex flex-col lg:flex-row gap-8">
                        <div className="lg:w-1/3">
                           <form onSubmit={enviarNotificacion} className="bg-white p-8 rounded-[2.5rem] shadow-elegant border border-bokalia-beige sticky top-6">
                              <h3 className="text-xl font-black text-bokalia-dark mb-6 tracking-tight">Nuevo Aviso</h3>
                              <div className="space-y-5">
                                 <div>
                                    <label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">Destinatarios</label>
                                    <select value={notiDestino} onChange={e => setNotiDestino(e.target.value)} className="w-full bg-bokalia-cream p-4 rounded-xl border border-bokalia-beige outline-none focus:border-bokalia-coral font-bold text-bokalia-dark text-sm">
                                       <option value="global">🌍 A TODA LA APP (Global)</option>
                                       <optgroup label="📍 Solo clientes de un local:">
                                          {restaurantes.map(r => <option key={r.id} value={r.id}>{r.nombre}</option>)}
                                       </optgroup>
                                    </select>
                                 </div>
                                 <div><label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">Título</label><input type="text" required maxLength="50" value={notiTitulo} onChange={e => setNotiTitulo(e.target.value)} className="w-full bg-bokalia-cream p-4 rounded-xl border border-bokalia-beige outline-none focus:border-bokalia-coral font-bold" /></div>
                                 <div><label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">Mensaje Corto</label><textarea required maxLength="150" value={notiMensaje} onChange={e => setNotiMensaje(e.target.value)} rows="3" className="w-full bg-bokalia-cream p-4 rounded-xl border border-bokalia-beige outline-none focus:border-bokalia-coral resize-none font-medium text-sm"></textarea></div>
                              </div>
                              <button type="submit" className="w-full bg-bokalia-coral text-white font-bold py-4 rounded-2xl mt-8 shadow-lg shadow-bokalia-coral/30 active:scale-95 transition-transform">🚀 Enviar Aviso</button>
                           </form>
                        </div>
                        <div className="lg:w-2/3">
                           <h3 className="text-xl font-bold text-bokalia-dark mb-6">Enviados (Últimas 24h)</h3>
                           {notificaciones.length === 0 ? (
                              <div className="bg-white rounded-[2.5rem] p-12 text-center border border-bokalia-beige shadow-sm"><div className="text-5xl mb-4 opacity-50">📭</div><p className="font-bold text-gray-500">No hay notificaciones recientes.</p></div>
                           ) : (
                              <div className="space-y-4">
                                 {notificaciones.map(noti => (
                                    <div key={noti.id} className="bg-white p-6 rounded-[2rem] shadow-elegant border border-bokalia-beige flex flex-col relative overflow-hidden">
                                       <div className={`absolute top-0 left-0 w-2 h-full ${noti.es_global ? 'bg-bokalia-coral' : 'bg-bokalia-dark'}`}></div>
                                       <div className="pl-4 flex justify-between items-start mb-3">
                                          <h4 className="font-bold text-bokalia-dark text-lg">{noti.titulo}</h4>
                                          <span className={`text-[10px] font-bold px-3 py-1.5 rounded-lg uppercase tracking-widest ${noti.es_global ? 'bg-bokalia-coral/10 text-bokalia-coral' : 'bg-gray-100 text-gray-600'}`}>{noti.es_global ? '🌍 GLOBAL' : `📍 ${noti.restaurante?.nombre}`}</span>
                                       </div>
                                       <p className="pl-4 text-gray-500 font-medium text-sm mb-4 leading-relaxed">{noti.mensaje}</p>
                                       <p className="pl-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Enviado a las {formatDate(noti.creado_en)}</p>
                                    </div>
                                 ))}
                              </div>
                           )}
                        </div>
                     </div>
                  </div>
               )}

            </main>
         </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SuperAdminApp />);
  </script>
</body>
</html>
